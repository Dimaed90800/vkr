app:
  description: 'Entry chatflow for the agentic REST API pentest platform. It accepts the user prompt, target parameters, creates an agentic session in the backend, and explains the next orchestration step.'
  icon: '💬'
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: chatflow-entry-agent
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 'Опиши цель пентеста, укажи target URL и ограничения. Я создам agentic session и подготовлю оркестрацию.'
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: start-to-normalize
      selected: false
      source: start
      sourceHandle: source
      target: normalize_input
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: http-request
      id: normalize-to-start-session
      selected: false
      source: normalize_input
      sourceHandle: source
      target: start_session
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: code
      id: session-to-parse
      selected: false
      source: start_session
      sourceHandle: source
      target: parse_session
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: llm
      id: parse-to-entry-llm
      selected: false
      source: parse_session
      sourceHandle: source
      target: entry_agent
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: answer
      id: llm-to-answer
      selected: false
      source: entry_agent
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: answer
        targetType: end
      id: answer-to-end
      selected: false
      source: answer
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 'Accept the prompt and campaign configuration from the user.'
        selected: false
        title: Start
        type: start
        variables:
        - label: Backend Base URL
          max_length: 200
          options: []
          required: true
          type: text-input
          variable: backend_base_url
        - label: Target Name
          max_length: 100
          options: []
          required: true
          type: text-input
          variable: target_name
        - label: Target URL
          max_length: 500
          options: []
          required: true
          type: text-input
          variable: target_url
        - label: User Prompt
          max_length: 4000
          options: []
          required: true
          type: paragraph
          variable: user_prompt
        - label: Allowed Test Classes CSV
          max_length: 200
          options: []
          required: false
          type: text-input
          variable: allowed_test_classes_csv
        - label: Max Rounds
          max_length: 10
          options: []
          required: false
          type: text-input
          variable: max_rounds
        x-outputs:
        - name: backend_base_url
          type: string
        - name: target_name
          type: string
        - name: target_url
          type: string
        - name: user_prompt
          type: string
        - name: allowed_test_classes_csv
          type: string
        - name: max_rounds
          type: string
      height: 210
      id: start
      position:
        x: 0
        y: 180
      positionAbsolute:
        x: 0
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 255
    - data:
        code: |
          def _normalize_classes(value: str) -> list:
              raw = str(value or "").strip()
              if not raw:
                  return ["discovery", "bola", "bopla", "auth"]
              result = []
              for item in raw.split(","):
                  normalized = str(item or "").strip().lower()
                  if normalized and normalized not in result:
                      result.append(normalized)
              return result or ["discovery", "bola", "bopla", "auth"]

          def _safe_int(value: str, default: int) -> int:
              value = str(value or "").strip()
              if not value:
                  return default
              try:
                  return int(value)
              except Exception:
                  return default

          def main(
              backend_base_url: str,
              target_name: str,
              target_url: str,
              user_prompt: str,
              allowed_test_classes_csv: str = "",
              max_rounds: str = "",
          ) -> dict:
              return {
                  "backend_base_url": str(backend_base_url or "").strip().rstrip("/"),
                  "target_name": str(target_name or "").strip(),
                  "target_url": str(target_url or "").strip(),
                  "user_prompt": str(user_prompt or "").strip(),
                  "allowed_test_classes_json": _normalize_classes(allowed_test_classes_csv),
                  "max_rounds_value": _safe_int(max_rounds, 12),
              }
        code_language: python3
        dependencies: []
        desc: 'Normalize campaign input before session creation.'
        outputs:
          backend_base_url:
            children: null
            type: string
          target_name:
            children: null
            type: string
          target_url:
            children: null
            type: string
          user_prompt:
            children: null
            type: string
          allowed_test_classes_json:
            children: null
            type: array[string]
          max_rounds_value:
            children: null
            type: number
        selected: false
        title: Normalize Input
        type: code
        variables:
        - value_selector:
          - start
          - backend_base_url
          variable: backend_base_url
        - value_selector:
          - start
          - target_name
          variable: target_name
        - value_selector:
          - start
          - target_url
          variable: target_url
        - value_selector:
          - start
          - user_prompt
          variable: user_prompt
        - value_selector:
          - start
          - allowed_test_classes_csv
          variable: allowed_test_classes_csv
        - value_selector:
          - start
          - max_rounds
          variable: max_rounds
      height: 100
      id: normalize_input
      position:
        x: 300
        y: 180
      positionAbsolute:
        x: 300
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 255
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: |
            {
              "target_name": "{{#normalize_input.target_name#}}",
              "target_url": "{{#normalize_input.target_url#}}",
              "user_prompt": "{{#normalize_input.user_prompt#}}",
              "allowed_test_classes": {{#normalize_input.allowed_test_classes_json#}},
              "max_rounds": {{#normalize_input.max_rounds_value#}}
            }
          type: json
        desc: 'Create backend agentic session.'
        headers: 'Content-Type:application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 300
        selected: false
        ssl_verify: false
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
        title: Start Agentic Session
        type: http-request
        url: '{{#normalize_input.backend_base_url#}}/agentic/start'
        variables: []
      height: 170
      id: start_session
      position:
        x: 610
        y: 180
      positionAbsolute:
        x: 610
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 255
    - data:
        code: |
          import json

          def main(body: str) -> dict:
              payload = json.loads(body)
              session = payload.get("session", {}) or {}
              agentic = payload.get("agentic", {}) or {}
              next_endpoints = payload.get("next_endpoints", {}) or {}
              prompt_focus = agentic.get("prompt_focus", {}) or {}

              return {
                  "session_id": session.get("id"),
                  "target_name": session.get("target_name"),
                  "target_url": session.get("target_url"),
                  "session_status": session.get("status"),
                  "prompt_focus_json": json.dumps(prompt_focus, ensure_ascii=False),
                  "router_plan_endpoint": next_endpoints.get("router_plan"),
                  "judge_state_endpoint": next_endpoints.get("judge_state"),
                  "report_package_endpoint": next_endpoints.get("report_package"),
                  "campaign_step_endpoint": next_endpoints.get("campaign_step"),
              }
        code_language: python3
        dependencies: []
        desc: 'Extract session bootstrap data.'
        outputs:
          session_id:
            children: null
            type: number
          target_name:
            children: null
            type: string
          target_url:
            children: null
            type: string
          session_status:
            children: null
            type: string
          prompt_focus_json:
            children: null
            type: string
          router_plan_endpoint:
            children: null
            type: string
          judge_state_endpoint:
            children: null
            type: string
          report_package_endpoint:
            children: null
            type: string
          campaign_step_endpoint:
            children: null
            type: string
        selected: false
        title: Parse Session Bootstrap
        type: code
        variables:
        - value_selector:
          - start_session
          - body
          variable: body
      height: 120
      id: parse_session
      position:
        x: 920
        y: 180
      positionAbsolute:
        x: 920
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 265
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 'Entry agent explains what session was created and what the orchestrator should do next.'
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: sys
          role: system
          text: |
            You are the entry agent for an adaptive REST API pentest system.

            Your job is to acknowledge the user goal, summarize the created backend session,
            and explain the next orchestration step clearly and briefly.

            Do not claim vulnerabilities.
            Do not invent findings.
            Mention the session id and the next backend endpoints.
        - id: user
          role: user
          text: |
            Backend session created.

            Session ID: {{#parse_session.session_id#}}
            Target: {{#parse_session.target_name#}} at {{#parse_session.target_url#}}
            Status: {{#parse_session.session_status#}}
            Prompt focus: {{#parse_session.prompt_focus_json#}}
            Router endpoint: {{#parse_session.router_plan_endpoint#}}
            Judge endpoint: {{#parse_session.judge_state_endpoint#}}
            Report endpoint: {{#parse_session.report_package_endpoint#}}
            Campaign step endpoint: {{#parse_session.campaign_step_endpoint#}}

            Explain the next step of the agentic orchestration in concise Russian.
        selected: false
        title: Entry Agent
        type: llm
        variables: []
        vision:
          enabled: false
      height: 140
      id: entry_agent
      position:
        x: 1240
        y: 180
      positionAbsolute:
        x: 1240
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 265
    - data:
        answer: '{{#entry_agent.text#}}'
        desc: ''
        selected: false
        title: Answer
        type: answer
        variables: []
      height: 100
      id: answer
      position:
        x: 1560
        y: 180
      positionAbsolute:
        x: 1560
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 240
    - data:
        desc: ''
        outputs: []
        selected: false
        title: End
        type: end
      height: 52
      id: end
      position:
        x: 1840
        y: 205
      positionAbsolute:
        x: 1840
        y: 205
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 240
    viewport:
      x: 0
      y: 0
      zoom: 0.68
  rag_pipeline_variables: []
