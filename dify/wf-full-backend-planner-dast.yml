          max_retries: 1
          retry_enabled: true
          retry_interval: 300
        selected: false
        ssl_verify: false
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
        title: Planner Candidates
        type: http-request
        url: '{{#normalize_inputs.toolbox_url#}}/v1/planner/{{#extract_campaign.campaign_id#}}/candidates'
        variables: []
      height: 140
      id: call_planner_candidates
      position:
        x: 1800
        y: 180
      positionAbsolute:
        x: 1800
        y: 180
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: |
          import json

          def main(body: str) -> dict:
              try:
                  payload = json.loads(body or '{}')
              except Exception:
                  payload = {}
              candidates = payload.get('candidates') or []
              selected = {}
              for candidate in candidates:
                  command = candidate.get('command')
                  if candidate.get('status') == 'ready' and isinstance(command, dict):
                      selected = candidate
                      break
              command = selected.get('command') if selected else {}
              missing = []
              for candidate in candidates:
                  if candidate.get('status') == 'blocked':
                      missing.append({
                          'kind': candidate.get('kind') or '',
                          'missing_inputs': candidate.get('missing_inputs') or [],
                          'reason': candidate.get('reason') or '',
                      })
              return {
                  'has_ready_candidate': 'true' if selected else 'false',
                  'candidate_id': str(selected.get('candidate_id') or ''),
                  'candidate_kind': str(selected.get('kind') or ''),
                  'command_json': json.dumps(command, ensure_ascii=False) if command else '{}',
                  'ready_count': str(payload.get('ready_count') or 0),
                  'blocked_count': str(payload.get('blocked_count') or 0),
                  'skipped_existing_count': str(payload.get('skipped_existing_count') or 0),
                  'blocked_missing_inputs_summary': json.dumps(missing[:5], ensure_ascii=False),
              }
        code_language: python3
        dependencies: []
        desc: Select first ready candidate. command_json is temporary and used only for tool start.
        outputs:
          blocked_count:
            children: null
            type: string
          blocked_missing_inputs_summary:
            children: null
            type: string
          candidate_id:
            children: null
            type: string
          candidate_kind:
            children: null
            type: string
          command_json:
            children: null
            type: string
          has_ready_candidate:
            children: null
            type: string
          ready_count:
            children: null
            type: string
          skipped_existing_count:
            children: null
            type: string
        selected: false
        title: Select First Ready Candidate
        type: code
        variables:
        - value_selector: [call_planner_candidates, body]
          value_type: string
          variable: body
      height: 52
      id: select_ready_candidate
      position:
        x: 2100
        y: 180
      positionAbsolute:
        x: 2100
        y: 180
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: is
            id: has-ready-candidate-condition
            value: 'true'
            variable_selector: [select_ready_candidate, has_ready_candidate]
            varType: string
          id: 'true'
          logical_operator: and
        desc: Continue only when planner returned a ready WorkerCommand.
        selected: false
