        y: 180
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: |
          import json
          from urllib.parse import urlparse

          DEFAULT_PLANNER_REQUEST = {
              "include_blocked": True,
              "max_candidates": 10,
              "zap": {
                  "enabled": True,
                  "target_url": "",
                  "zap_base_url": "http://zap:8080",
                  "seed_urls": [],
                  "use_spider": True,
                  "use_ajax_spider": False,
                  "max_duration_sec": 30,
                  "max_discovered_urls": 100,
                  "max_alerts": 100,
              },
              "bola": {
                  "enabled": True,
                  "object_pairs": [],
              },
          }

          def _json_list(value, default):
              raw = str(value or '').strip()
              if not raw:
                  return list(default)
              try:
                  parsed = json.loads(raw)
              except Exception:
                  return list(default)
              return parsed if isinstance(parsed, list) else list(default)

          def _json_object(value, default):
              raw = str(value or '').strip()
              if not raw:
                  return dict(default)
              try:
                  parsed = json.loads(raw)
              except Exception:
                  return dict(default)
              return parsed if isinstance(parsed, dict) else dict(default)

          def _default_allowed_hosts(target_url):
              parsed = urlparse(str(target_url or '').strip())
              host = parsed.netloc or parsed.hostname or ''
              return [host] if host else []

          def main(toolbox_url, target_url, openapi_spec_text='', openapi_url='', allowed_hosts_json='', roles_json='', planner_request_json='', task_id='', judge_model='') -> dict:
              target = str(target_url or '').rstrip('/')
              openapi_text = str(openapi_spec_text or '')
              allowed_hosts = _json_list(allowed_hosts_json, _default_allowed_hosts(target))
              roles = _json_list(roles_json, [])
              planner_request = _json_object(planner_request_json, DEFAULT_PLANNER_REQUEST)
              model_name = str(judge_model or 'bridge-full-backend-planner-dast-llm').strip()
              return {
                  'toolbox_url': str(toolbox_url or '').rstrip('/'),
                  'target_url': target,
                  'openapi_url': str(openapi_url or '').strip(),
                  'openapi_spec_text': openapi_text,
                  'openapi_spec_text_json': json.dumps(openapi_text, ensure_ascii=False),
                  'has_openapi_spec': 'true' if openapi_text.strip() else 'false',
                  'graph_built': 'true' if openapi_text.strip() else 'false',
                  'graph_status': 'build_requested' if openapi_text.strip() else 'skipped_no_openapi_spec',
                  'allowed_hosts_json': json.dumps(allowed_hosts, ensure_ascii=False),
                  'roles_json': json.dumps(roles, ensure_ascii=False),
                  'planner_request_json': json.dumps(planner_request, ensure_ascii=False),
                  'task_id': str(task_id or 'task_full_backend_planner_dast').strip(),
                  'judge_model': model_name,
              }
        code_language: python3
        dependencies: []
        desc: ''
        outputs:
          allowed_hosts_json:
            children: null
            type: string
          graph_built:
            children: null
            type: string
          graph_status:
            children: null
            type: string
          has_openapi_spec:
            children: null
            type: string
          judge_model:
            children: null
            type: string
          openapi_spec_text:
            children: null
            type: string
          openapi_spec_text_json:
            children: null
            type: string
          openapi_url:
            children: null
            type: string
          planner_request_json:
            children: null
            type: string
          roles_json:
            children: null
            type: string
          target_url:
            children: null
            type: string
          task_id:
            children: null
            type: string
          toolbox_url:
            children: null
            type: string
        selected: false
        title: Normalize Inputs
        type: code
        variables:
        - value_selector: [start, toolbox_url]
