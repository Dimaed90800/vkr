    - data:
        context:
          enabled: false
          variable_selector: []
        desc: LLM Judge returns only strict JudgeVerdictPayload JSON. Backend JudgeApply creates findings.
        model:
          completion_params:
            max_tokens: 900
            temperature: 0.0
          mode: chat
          name: openai/gpt-4o-mini
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: sys
          role: system
          text: |
            You are Judge for a backend-owned REST API DAST pipeline.

            Evaluate only compact EvidencePack summary.
            Do not create findings.
            Do not call tools.
            Do not invent evidence.
            Use only request refs, status values, booleans, counts, and compact evidence metadata.
            Do not require secret-bearing metadata, payload contents, session secrets, or stored blob contents.
            Return JSON only, no markdown/prose/code fences.

            Output must match JudgeVerdictPayload exactly:
            {
              "schema_version": "judge-verdict/v1",
              "verdict": "confirmed|rejected|rework|duplicate|out_of_scope|inconclusive",
              "confidence": 0.0,
              "severity": "info|low|medium|high|critical",
              "reason": "short grounded reason",
              "finding_candidate": {
                "title": "",
                "severity": "",
                "vulnerability_class": "",
                "summary": "",
                "extras": {}
              },
              "duplicate_of_finding_id": "",
              "judge_source": "dify",
              "judge_model": "{{#normalize_inputs.judge_model#}}"
            }

            If status != ready_for_judge, do not confirm.
            If judge_ready=false, do not confirm.
            If missing_evidence non-empty, return rework or inconclusive.
            For BOLA, confirmed requires baseline, attack, ownership proof, negative control, diff, and replay steps.
        - id: user
          role: user
          text: |-
            Evaluate this compact EvidencePack summary.

            EvidencePack summary:
            {{#compact_evidence_for_judge.judge_input_json#}}

            Decision guidance:
            - Confirm only if the evidence is structurally ready and supports BOLA.
            - Rework if specific evidence is missing and can be gathered.
            - Inconclusive if evidence is incomplete but no clear rework action is available.
            - Rejected if the compact evidence contradicts the vulnerability hypothesis.
            - Out_of_scope only if the evidence clearly targets an out-of-scope asset.
            - Duplicate only if duplicate_of_finding_id is available.

            Return strict JSON only.
        selected: false
        title: LLM Judge
        type: llm
        variables: []
        vision:
          enabled: false
      height: 164
      id: llm_judge
      position:
        x: 6000
        y: 180
      positionAbsolute:
        x: 6000
        y: 180
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: |
          import json
          import re

          ALLOWED = {
              'confirmed',
              'rejected',
              'rework',
              'duplicate',
              'out_of_scope',
              'inconclusive',
          }
          REQUIRED = [
              'schema_version',
              'verdict',
              'confidence',
              'severity',
              'reason',
              'finding_candidate',
              'duplicate_of_finding_id',
              'judge_source',
              'judge_model',
          ]

          def fallback(judge_model: str) -> dict:
              return {
                  'schema_version': 'judge-verdict/v1',
                  'verdict': 'inconclusive',
                  'confidence': 0.0,
                  'severity': 'info',
                  'reason': 'LLM judge returned invalid JSON; backend apply receives safe inconclusive fallback.',
                  'finding_candidate': {
                      'title': '',
                      'severity': '',
                      'vulnerability_class': '',
                      'summary': '',
                      'extras': {'fallback_reason': 'invalid_llm_json'},
                  },
                  'duplicate_of_finding_id': '',
                  'judge_source': 'dify',
                  'judge_model': judge_model,
              }

          def clean_text(text: str) -> str:
              value = (text or '').strip()
              fence = re.match(r'^```(?:json)?\s*(.*?)\s*```$', value, re.DOTALL)
              if fence:
                  value = fence.group(1).strip()
              return value

          def main(llm_text: str, judge_model: str) -> dict:
              model_name = str(judge_model or 'bridge-full-backend-planner-dast-llm').strip()
              try:
                  payload = json.loads(clean_text(llm_text))
                  if not isinstance(payload, dict):
                      raise ValueError('payload_not_object')
                  for field in REQUIRED:
                      if field not in payload:
                          raise ValueError(f'missing_{field}')
                  if payload.get('verdict') not in ALLOWED:
                      raise ValueError('invalid_verdict')
                  if not isinstance(payload.get('finding_candidate'), dict):
                      raise ValueError('finding_candidate_not_object')
              except Exception:
                  payload = fallback(model_name)

              payload['schema_version'] = 'judge-verdict/v1'
              payload['judge_source'] = payload.get('judge_source') or 'dify'
              payload['judge_model'] = model_name
              if not isinstance(payload.get('finding_candidate'), dict):
                  payload['finding_candidate'] = fallback(model_name)['finding_candidate']
              payload.setdefault('duplicate_of_finding_id', '')
              return {'judge_verdict_json': json.dumps(payload, ensure_ascii=False)}
        code_language: python3
        dependencies: []
        desc: Parse and validate LLM Judge output, with safe fallback for invalid JSON.
        outputs:
          judge_verdict_json:
            children: null
            type: string
        selected: false
        title: Parse/Validate Judge Verdict
        type: code
        variables:
        - value_selector: [llm_judge, text]
          value_type: string
          variable: llm_text
        - value_selector: [normalize_inputs, judge_model]
          value_type: string
