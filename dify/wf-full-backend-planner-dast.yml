    nodes:
    - data:
        desc: Full backend planner DAST inputs. Dify keeps compact IDs, counts, status values, and one temporary command object for tool start.
        selected: false
        title: Start
        type: start
        variables:
        - label: Toolbox URL
          max_length: 256
          options: []
          required: true
          type: text-input
          variable: toolbox_url
        - label: Target URL
          max_length: 512
          options: []
          required: true
          type: text-input
          variable: target_url
        - label: OpenAPI Spec Text optional
          max_length: 60000
          options: []
          required: false
          type: paragraph
          variable: openapi_spec_text
        - label: OpenAPI URL optional
          max_length: 512
          options: []
          required: false
          type: text-input
          variable: openapi_url
        - label: Allowed Hosts JSON
