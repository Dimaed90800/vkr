    - data:
        code: |
          import json

          def main(body: str) -> dict:
              try:
                  payload = json.loads(body or '{}')
              except Exception:
                  payload = {}
              pack = payload.get('evidence_pack') or payload.get('evidence') or {}

              def request_ref(exchange):
                  if not isinstance(exchange, dict):
                      return None
                  ref = exchange.get('request_ref') or {}
                  if not isinstance(ref, dict):
                      return None
                  return {
                      'request_id': ref.get('request_id') or '',
                      'role': ref.get('role') or '',
                      'method': ref.get('method') or '',
                      'path_template': ref.get('path_template') or '',
                      'status_code': ref.get('status_code') or 0,
                      'classification': ref.get('classification') or '',
                      'operation_id': ref.get('operation_id') or '',
                  }

              ownership = pack.get('ownership_proof') or {}
              baseline_ref = request_ref(pack.get('baseline') or {})
              attack_ref = request_ref(pack.get('attack') or {})
              owner_collection_ref = request_ref({
                  'request_ref': ownership.get('owner_collection_request_ref')
              })
              attacker_collection_ref = request_ref({
                  'request_ref': ownership.get('attacker_collection_request_ref')
              })

              control_refs = []
              for control in pack.get('controls') or []:
                  ref = request_ref(control)
                  if ref:
                      control_refs.append(ref)

              replay_step_refs = []
              for step in pack.get('replay_steps') or []:
                  ref = request_ref(step)
                  if ref:
                      replay_step_refs.append(ref)

              summary = {
                  'campaign_id': pack.get('campaign_id'),
                  'evidence_id': pack.get('evidence_id'),
                  'task_id': pack.get('task_id'),
                  'observation_id': pack.get('observation_id'),
                  'verification_plan_id': pack.get('verification_plan_id'),
                  'owasp_category': pack.get('owasp_category'),
                  'vulnerability_class': pack.get('vulnerability_class'),
                  'operation_id': pack.get('operation_id'),
                  'endpoint': pack.get('endpoint'),
                  'method': pack.get('method'),
                  'status': pack.get('status'),
                  'judge_ready': pack.get('judge_ready'),
                  'missing_evidence': pack.get('missing_evidence') or [],
                  'confidence': pack.get('confidence') or 0.0,
                  'hypothesis': pack.get('hypothesis') or '',
                  'derived_signals': pack.get('derived_signals') or [],
                  'has_baseline': bool(pack.get('baseline')),
                  'has_attack': bool(pack.get('attack')),
                  'has_ownership_proof': bool(pack.get('ownership_proof')),
                  'has_diff': bool(pack.get('diff')),
                  'controls_count': len(pack.get('controls') or []),
                  'replay_steps_count': len(pack.get('replay_steps') or []),
                  'artifact_refs_count': len(pack.get('artifact_refs') or []),
                  'baseline_ref': baseline_ref,
                  'attack_ref': attack_ref,
                  'ownership_owner_collection_ref': owner_collection_ref,
                  'ownership_attacker_collection_ref': attacker_collection_ref,
                  'control_refs': control_refs,
                  'replay_step_refs': replay_step_refs,
              }
              return {
                  'evidence_id': str(pack.get('evidence_id') or ''),
                  'task_id': str(pack.get('task_id') or ''),
                  'judge_input_json': json.dumps(summary, ensure_ascii=False),
              }
        code_language: python3
        dependencies: []
        desc: ''
        outputs:
          evidence_id:
            children: null
            type: string
          judge_input_json:
            children: null
            type: string
          task_id:
            children: null
            type: string
