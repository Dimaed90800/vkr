app:
  description: Phase 10 backend bridge workflow using real bola_replay_probe and an LLM Judge.
    Backend owns campaign state, tool runs, observations, evidence, decisions, and findings.
  icon: 🔗
  icon_background: '#E8F3FF'
  icon_type: emoji
  mode: workflow
  name: wf-backend-bridge-real-bola-llm
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      fileUploadConfig:
        file_size_limit: 15
        file_upload_limit: 20
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods: []
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        sourceType: start
        targetType: code
      id: start-to-normalize_inputs
      source: start
      sourceHandle: source
      target: normalize_inputs
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: code
        targetType: http-request
      id: normalize_inputs-to-create_campaign
      source: normalize_inputs
      sourceHandle: source
      target: create_campaign
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: http-request
        targetType: code
      id: create_campaign-to-extract_campaign
      source: create_campaign
      sourceHandle: source
      target: extract_campaign
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: code
        targetType: http-request
      id: extract_campaign-to-build_graph
      source: extract_campaign
      sourceHandle: source
      target: build_graph
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: http-request
        targetType: http-request
      id: build_graph-to-get_graph_summary
      source: build_graph
      sourceHandle: source
      target: get_graph_summary
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: http-request
        targetType: http-request
      id: get_graph_summary-to-run_bola_replay_probe
      source: get_graph_summary
      sourceHandle: source
      target: run_bola_replay_probe
      targetHandle: target
