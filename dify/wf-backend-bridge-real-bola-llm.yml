    - data:
        code: |
          import json
          from urllib.parse import urlparse

          def _json_list(value, default):
              raw = str(value or '').strip()
              if not raw:
                  return list(default)
              try:
                  parsed = json.loads(raw)
              except Exception:
                  return list(default)
              return parsed if isinstance(parsed, list) else list(default)

          def _default_allowed_hosts(target_url):
              parsed = urlparse(str(target_url or '').strip())
              host = parsed.netloc or parsed.hostname or ''
              return [host] if host else []

          def _default_openapi_spec():
              return {
                  'openapi': '3.0.3',
                  'info': {'title': 'Real BOLA Bridge API', 'version': '1.0.0'},
                  'paths': {
                      '/api/v1/vehicles': {'get': {'operationId': 'listVehicles', 'responses': {'200': {'description': 'Vehicle collection'}}}},
                      '/api/v1/vehicles/{vehicleId}': {'get': {'operationId': 'getVehicle', 'parameters': [{'name': 'vehicleId', 'in': 'path', 'required': True, 'schema': {'type': 'string'}}], 'responses': {'200': {'description': 'Vehicle'}}}},
                  },
              }

          def main(toolbox_url, target_url, openapi_url='', openapi_spec_text='', allowed_hosts_json='', roles_json='', object_url='', attacker_own_object_url='', collection_url='', object_id='', attacker_own_object_id='', owner_role='', attacker_role='', operation_id='', path_template='', collection_path_template='', collection_operation_id='', task_id='') -> dict:
              target = str(target_url or '').rstrip('/')
              allowed_hosts = _json_list(allowed_hosts_json, _default_allowed_hosts(target))
              roles = _json_list(roles_json, [])
              spec = str(openapi_spec_text or '').strip()
              if not spec:
                  spec = json.dumps(_default_openapi_spec(), ensure_ascii=False)
              return {
                  'toolbox_url': str(toolbox_url or '').rstrip('/'),
                  'target_url': target,
                  'openapi_url': str(openapi_url or '').strip(),
                  'openapi_spec_text_json': json.dumps(spec, ensure_ascii=False),
                  'allowed_hosts_json': json.dumps(allowed_hosts, ensure_ascii=False),
                  'roles_json': json.dumps(roles, ensure_ascii=False),
                  'object_url': str(object_url or '').strip(),
                  'attacker_own_object_url': str(attacker_own_object_url or '').strip(),
                  'collection_url': str(collection_url or '').strip(),
                  'object_id': str(object_id or '').strip(),
                  'attacker_own_object_id': str(attacker_own_object_id or '').strip(),
                  'owner_role': str(owner_role or 'owner').strip(),
                  'attacker_role': str(attacker_role or 'attacker').strip(),
                  'operation_id': str(operation_id or 'op_GET_/api/v1/vehicles/{vehicleId}').strip(),
                  'path_template': str(path_template or '/api/v1/vehicles/{vehicleId}').strip(),
                  'collection_path_template': str(collection_path_template or '/api/v1/vehicles').strip(),
                  'collection_operation_id': str(collection_operation_id or 'op_GET_/api/v1/vehicles').strip(),
                  'task_id': str(task_id or 'task_real_bola_bridge_001').strip(),
              }
        code_language: python3
        dependencies: []
        desc: ''
        outputs:
          allowed_hosts_json:
            children: null
            type: string
          attacker_own_object_id:
            children: null
            type: string
          attacker_own_object_url:
            children: null
            type: string
          attacker_role:
            children: null
            type: string
