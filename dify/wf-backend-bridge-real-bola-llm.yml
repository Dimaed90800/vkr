        targetType: http-request
      id: extract_tool_run-to-normalize_observations
      source: extract_tool_run
      sourceHandle: source
      target: normalize_observations
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        sourceType: http-request
        targetType: code
      id: normalize_observations-to-select_observation
      source: normalize_observations
