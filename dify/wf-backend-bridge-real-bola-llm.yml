        x: 4500
        y: 180
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: |
          import json
          import re

          ALLOWED = {
              'confirmed',
              'rejected',
              'rework',
              'duplicate',
              'out_of_scope',
              'inconclusive',
          }
          REQUIRED = [
              'schema_version',
              'verdict',
              'confidence',
              'severity',
              'reason',
              'finding_candidate',
              'duplicate_of_finding_id',
              'judge_source',
              'judge_model',
          ]

          def fallback() -> dict:
              return {
                  'schema_version': 'judge-verdict/v1',
                  'verdict': 'inconclusive',
                  'confidence': 0.0,
                  'severity': 'info',
                  'reason': 'LLM judge returned invalid JSON; backend apply receives safe inconclusive fallback.',
                  'finding_candidate': {
                      'title': '',
                      'severity': '',
                      'vulnerability_class': '',
                      'summary': '',
                      'extras': {'fallback_reason': 'invalid_llm_json'},
                  },
                  'duplicate_of_finding_id': '',
                  'judge_source': 'dify',
                  'judge_model': 'bridge-real-bola-llm',
              }

          def clean_text(text: str) -> str:
              value = (text or '').strip()
              fence = re.match(r'^```(?:json)?\s*(.*?)\s*```$', value, re.DOTALL)
              if fence:
                  value = fence.group(1).strip()
              return value

          def main(llm_text: str) -> dict:
              try:
                  payload = json.loads(clean_text(llm_text))
                  if not isinstance(payload, dict):
                      raise ValueError('payload_not_object')
                  for field in REQUIRED:
                      if field not in payload:
                          raise ValueError(f'missing_{field}')
                  if payload.get('verdict') not in ALLOWED:
                      raise ValueError('invalid_verdict')
                  if not isinstance(payload.get('finding_candidate'), dict):
                      raise ValueError('finding_candidate_not_object')
              except Exception:
                  payload = fallback()

              payload['schema_version'] = 'judge-verdict/v1'
              payload['judge_source'] = payload.get('judge_source') or 'dify'
              payload['judge_model'] = payload.get('judge_model') or 'bridge-real-bola-llm'
              if not isinstance(payload.get('finding_candidate'), dict):
                  payload['finding_candidate'] = fallback()['finding_candidate']
              payload.setdefault('duplicate_of_finding_id', '')
              return {'judge_verdict_json': json.dumps(payload, ensure_ascii=False)}
        code_language: python3
        dependencies: []
        desc: Parse and validate LLM Judge output, with safe fallback for invalid JSON.
