    - data:
        code: |
          import json
          from datetime import datetime, timezone


          def _emit(run_id: str, component: str, event_type: str, payload: dict):
              record = {
                  'timestamp': datetime.now(timezone.utc).isoformat(),
                  'event_type': event_type,
                  'component': component,
                  'run_id': str(run_id or '').strip(),
                  **payload,
              }
              try:
                  print('[diag-event]', json.dumps(record, ensure_ascii=False))
              except Exception:
                  pass


          def _stop_snapshot(state: dict, scheduler: dict) -> dict:
              pending_tasks = state.get('pending_tasks') or []
              runnable = [item for item in pending_tasks if isinstance(item, dict) and str(item.get('readiness') or '') == 'ready_to_test']
              waiting = [item for item in pending_tasks if isinstance(item, dict) and str(item.get('readiness') or '') == 'needs_preparation']
              blocked = [item for item in pending_tasks if isinstance(item, dict) and str(item.get('readiness') or '') == 'cannot_proceed']
              scheduler_state = state.get('scheduler_state') or {}
              return {
                  'pending_count': len(pending_tasks),
                  'runnable_count': len(runnable),
                  'blocked_count': len(blocked),
                  'waiting_for_preparation_count': len(waiting),
                  'stop_reason': str(state.get('stop_reason') or scheduler.get('selection_reason') or 'no_runnable_tasks'),
                  'exhausted_budget_counts': {
                      'exploration_budget_used': int(scheduler_state.get('exploration_budget_used') or 0),
                      'deepening_budget_used': int(scheduler_state.get('deepening_budget_used') or 0),
                      'preparation_budget_used': int(scheduler_state.get('preparation_budget_used') or 0),
                  },
                  'total_completed_tasks': len(state.get('completed_tasks') or []),
                  'total_rejected_tasks': len(state.get('rejected_findings') or []),
                  'total_rework_tasks': len([item for item in (state.get('rejected_findings') or []) if isinstance(item, dict) and str(item.get('reason') or '').strip().lower().startswith('rework')]),
                  'total_followups_generated': sum(int(value or 0) for value in ((scheduler_state.get('root_followup_counts') or {}).values() if isinstance(scheduler_state.get('root_followup_counts'), dict) else [])),
                  'total_preparation_tasks_generated': len(waiting),
                  'total_enriched_tasks': len(runnable),
                  'total_harvested_ids': len(((state.get('execution_context') or {}).get('harvested_object_ids') or [])),
                  'total_materialized_objects': len(((state.get('execution_context') or {}).get('prepared_objects') or {})),
              }


          def _emit_stop(state: dict, scheduler: dict):
              execution_context = state.get('execution_context') or {}
              run_id = str(execution_context.get('run_id') or (state.get('scheduler_state') or {}).get('run_id') or '').strip()
              root_trace_id = str(execution_context.get('root_trace_id') or run_id).strip()
              snapshot = _stop_snapshot(state, scheduler)
              pending_tasks = state.get('pending_tasks') or []
              strongest_candidates = []
              for task in sorted([item for item in pending_tasks if isinstance(item, dict)], key=lambda item: float(item.get('evidence_feasibility') or 0), reverse=True)[:5]:
                  strongest_candidates.append({
                      'id': task.get('id'),
                      'endpoint': task.get('endpoint'),
                      'class': task.get('class'),
                      'subtype': task.get('subtype'),
                      'readiness': task.get('readiness'),
                      'test_strategy': task.get('test_strategy'),
                  })
              _emit(run_id, 'scheduler', 'run_stop', {
                  'status': 'success',
                  'summary': 'Run stopped after scheduler dispatch produced no runnable task.',
                  'run_id': run_id,
                  'trace_id': root_trace_id,
                  'reason': snapshot,
                  'counters': snapshot,
                  'artifacts': {
                      'strongest_unconfirmed_candidates': strongest_candidates,
                      'last_selection_reason': state.get('last_selection_reason'),
                      'last_deferred_classes': state.get('last_deferred_classes') or [],
                  },
              })


          def _no_task() -> dict:
              return {
                  "id": "__no_task__",
                  "class": "authorization",
                  "subtype": "noop",
                  "endpoint": "/__dify_no_task__",
                  "method": "GET",
                  "params": {"path_params": [], "query_params": [], "body_fields": []},
                  "auth_context": {"owner_role": "user_a", "other_role": "user_b", "token_strategy": "none"},
                  "hypothesis": "No task available.",
                  "priority": 0,
                  "retry_count": 0,
                  "rework_hint": None,
                  "status": "pending",
                  "allowed_tools": ["noop_outcome"],
                  "readiness": "cannot_proceed",
                  "required_capabilities": [],
                  "preparation_options": [],
                  "test_strategy": "noop",
              }



          def _task_allowed_tools(task: dict) -> list:
              value = task.get("allowed_tools") or []
              if not isinstance(value, list):
                  return []
              return [str(item or "").strip() for item in value if str(item or "").strip()]


          def _is_executable_task(task: dict) -> bool:
              if not isinstance(task, dict):
                  return False
              readiness = str(task.get("readiness") or "").strip()
              return readiness in {"ready_to_test", "needs_preparation"} and bool(_task_allowed_tools(task))


          def _priority(task: dict) -> int:
              try:
                  return int(task.get("priority") or 0)
              except Exception:
                  return 0


          def _local_fallback_selection(tasks: list) -> tuple[dict, list, str]:
              ready = [item for item in (tasks or []) if _is_executable_task(item) and str(item.get("readiness") or "") == "ready_to_test"]
              waiting = [item for item in (tasks or []) if _is_executable_task(item) and str(item.get("readiness") or "") == "needs_preparation"]
              pool = ready or waiting
              if not pool:
                  return _no_task(), list(tasks or []), "no_local_executable_task"
              indexed = list(enumerate(tasks or []))
              candidates = []
              selected_ids = {id(item) for item in pool}
              for index, item in indexed:
                  if id(item) in selected_ids:
                      candidates.append((index, item))
              candidates.sort(key=lambda pair: (_priority(pair[1]), 1 if str(pair[1].get("readiness") or "") == "ready_to_test" else 0), reverse=True)
              selected_index, active = candidates[0]
              remaining = list(tasks or [])
              remaining.pop(selected_index)
              return active, remaining, "local_executable_fallback"


          def _soft_stop_reason(reason: str) -> bool:
              value = str(reason or "").strip().lower()
              return value in {
                  "all_class_budgets_exhausted",
                  "no_runnable_tasks",
                  "fallback_single_class_queue",
                  "no_tasks",
                  "",
              }

          def _resolve_final_stop_reason(state: dict, scheduler: dict) -> dict:
              raw_state_reason = str(state.get("stop_reason") or "").strip()
              scheduler_reason = str(state.get("scheduler_stop_reason") or scheduler.get("selection_reason") or scheduler.get("stop_reason") or "").strip()
              transient_reason = str(state.get("transient_stop_reason") or "").strip()
              soft_fallback = bool(state.get("soft_stop_fallback_used") or state.get("continued_after_soft_stop"))
              explicit_final = str(state.get("final_stop_reason") or "").strip()
              if explicit_final:
                  resolved = explicit_final
              elif raw_state_reason == "timeout" and scheduler_reason and scheduler_reason != "timeout":
                  resolved = scheduler_reason
              elif transient_reason == "timeout" and scheduler_reason and scheduler_reason != "timeout":
                  resolved = scheduler_reason
              elif soft_fallback and scheduler_reason and not _soft_stop_reason(scheduler_reason):
                  resolved = scheduler_reason
              else:
                  resolved = raw_state_reason or scheduler_reason or "loop_finished"
              return {
                  "raw_state_stop_reason": raw_state_reason,
                  "scheduler_selection_reason": scheduler_reason,
                  "transient_stop_reason": transient_reason,
                  "soft_stop_fallback_used": soft_fallback,
                  "resolved_final_stop_reason": resolved,
              }

          def main(state_json: str, scheduler_body: str = "") -> dict:
              try:
                  state = json.loads(state_json or '{}')
              except Exception:
                  state = {}
              try:
                  scheduler = json.loads(scheduler_body or '{}')
              except Exception:
                  scheduler = {}

              stop_reason = str(state.get("stop_reason") or "")
              if not stop_reason:
                  if state.get("budget_used", 0) >= state.get("max_requests", 100):
                      stop_reason = "budget_exceeded"
                  else:
                      start_ts = state.get("start_timestamp")
                      max_dur = int(state.get("max_duration_sec", 900) or 900)
                      if start_ts:
                          try:
                              started = datetime.fromisoformat(start_ts)
                              if (datetime.now(timezone.utc) - started).total_seconds() >= max_dur:
                                  stop_reason = "timeout"
                          except Exception:
                              pass

