    - data:
        code: "import json\n\nWORKER_SPECS = {\n    'Authorization Worker': {\n        'class_name': 'authorization',\n        'templates': {\n            'object_access_replay': 'auth_test_access',\n            'cross_role_read': 'auth_test_access',\n            'cross_role_update': 'auth_test_access',\n            'cross_role_delete': 'auth_test_access',\n            'function_level_access_probe': 'auth_test_access',\n            'admin_endpoint_probe': 'auth_test_access',\n        },\n        'direct_tools': {'auth_test_access', 'property_mutation_test'},\n        'preparation_tools': {'create_test_object', 'auto_provision', 'auth_probe_entrypoints'},\n    },\n    'Injection Worker': {\n        'class_name': 'injection',\n        'templates': {\n            'focused_injection_probe': 'injection_test',\n            'field_mutation_probe': 'injection_test',\n            'url_field_probe': 'injection_test',\n            'input_shape_probe': 'input_shape_probe',\n            'reflection_probe': 'reflection_probe',\n            'path_fuzz_probe': 'path_fuzz_probe',\n            'limit_or_size_probe': 'resource_abuse_test',\n        },\n        'direct_tools': {'injection_test', 'input_shape_probe', 'reflection_probe', 'path_fuzz_probe', 'resource_abuse_test', 'data_exposure_test'},\n        'preparation_tools': {'data_exposure_test'},\n    },\n    'Business Logic Worker': {\n        'class_name': 'business_logic',\n        'templates': {\n            'repeated_action': 'logic_test',\n            'skipped_step': 'logic_test',\n            'invalid_state_transition': 'logic_test',\n            'cross_role_workflow_abuse': 'logic_test',\n            'replay_idempotency': 'logic_test',\n            'business_value_abuse': 'logic_test',\n            'basic_race_like': 'logic_test',\n            'bounded_rate_probe': 'resource_abuse_test',\n        },\n        'template_aliases': {\n            'resource_abuse_rate_limit': 'bounded_rate_probe',\n        },\n        'direct_tools': {'logic_test', 'resource_abuse_test'},\n        'preparation_tools': {'workflow_probe'},\n    },\n}\n\nTOOL_ENDPOINTS = {\n    'auth_test_access': '/v1/auth/test-access',\n    'auth_probe_entrypoints': '/v1/auth/probe-entrypoints',\n    'auto_provision': '/v1/auth/auto-provision',\n    'create_test_object': '/v1/auth/create-test-object',\n    'property_mutation_test': '/v1/auth/property-mutation-test',\n    'injection_test': '/v1/injection/test',\n    'input_shape_probe': '/v1/injection/input-shape-probe',\n    'reflection_probe': '/v1/injection/reflection-probe',\n    'path_fuzz_probe': '/v1/injection/path-fuzz-probe',\n    'logic_test': '/v1/logic/test',\n    'workflow_probe': '/v1/logic/workflow-probe',\n    'data_exposure_test': '/v1/data/exposure-test',\n    'resource_abuse_test': '/v1/resource/abuse-test',\n    'noop_outcome': '/v1/worker/noop-outcome',\n}\n\nCLASS_TO_WORKER = {spec['class_name']: worker for worker, spec in WORKER_SPECS.items()}\nREQUIRED_FIELDS = {'worker', 'template', 'toolchain', 'hypothesis', 'arguments', 'success_criteria', 'needs_preparation'}\n\n\ndef _loads_text(text):\n    value = str(text or '').strip()\n    if value.startswith('```'):\n        lines = value.splitlines()\n        if lines and lines[0].startswith('```'):\n            lines = lines[1:]\n        if lines and lines[-1].strip() == '```':\n            lines = lines[:-1]\n        value = '\\n'.join(lines).strip()\n    try:\n        return json.loads(value or '{}')\n    except Exception:\n        return {}\n\n\ndef _default_template(active_task, worker_name):\n    hints = active_task.get('context_hints') or {}\n    template = str(hints.get('router_selected_template') or '').strip()\n    spec = WORKER_SPECS[worker_name]\n    aliases = spec.get('template_aliases') or {}\n    template = aliases.get(template, template)\n    if template in spec['templates']:\n        return template\n    return next(iter(spec['templates']))\n\n\ndef _noop_response(worker_name, reason, active_task, execution_context, parser_warning=None):\n    arguments = {}\n    if parser_warning:\n        arguments['_parser_warning'] = parser_warning\n    envelope = {\n        'execution_context': execution_context,\n        'task': active_task,\n        'tool_name': 'noop_outcome',\n        'arguments': arguments,\n    }\n    return {\n        'selected_worker': worker_name,\n        'selected_template': 'noop',\n        'tool_name': 'noop_outcome',\n        'tool_endpoint': TOOL_ENDPOINTS['noop_outcome'],\n        'tool_arguments_json': json.dumps(arguments, ensure_ascii=False),\n        'success_criteria_json': json.dumps([], ensure_ascii=False),\n        'worker_hypothesis': str(active_task.get('hypothesis') or reason),\n        'reasoning_summary': reason,\n        'normalized_backend_request_json': json.dumps(envelope, ensure_ascii=False),\n    }\n\n\ndef _validate_worker(payload, class_name, default_worker):\n    requested_worker = str(payload.get('worker') or '').strip()\n    if requested_worker != default_worker:\n        return False, default_worker, {\n            'error': 'invalid_worker',\n            'expected_worker': default_worker,\n            'received_worker': requested_worker,\n        }\n    spec = WORKER_SPECS[requested_worker]\n    if spec['class_name'] != class_name:\n        return False, default_worker, {\n            'error': 'class_worker_mismatch',\n            'expected_class': class_name,\n            'received_worker': requested_worker,\n        }\n    return True, requested_worker, None\n\n\ndef _normalize_tool_name(tool_name):\n    return str(tool_name or '').strip()\n\n\ndef _normalize_template(spec, template):\n    value = str(template or '').strip()\n    aliases = spec.get('template_aliases') or {}\n    return aliases.get(value, value)\n\n\ndef _validate_payload(payload, worker_name, active_task):\n    missing = sorted(REQUIRED_FIELDS - set(payload.keys()))\n    if missing:\n        return None, None, None, None, None, {'error': 'missing_required_fields', 'fields': missing}\n\n    spec = WORKER_SPECS[worker_name]\n    raw_template = str(payload.get('template') or '').strip()\n    template = _normalize_template(spec, raw_template)\n    if not template:\n        template = _default_template(active_task, worker_name)\n    elif template not in spec['templates']:\n        return None, None, None, None, None, {'error': 'invalid_template', 'template': raw_template or template, 'normalized_template': template}\n\n    toolchain = payload.get('toolchain')\n    if not isinstance(toolchain, list) or len(toolchain) != 1:\n        return None, None, None, None, None, {'error': 'invalid_toolchain', 'toolchain': toolchain}\n    tool_name = _normalize_tool_name(toolchain[0])\n\n    needs_preparation = bool(payload.get('needs_preparation'))\n    allowed_tools = set(str(item).strip() for item in (active_task.get('allowed_tools') or []) if str(item).strip())\n    prep_options = set(str(item).strip() for item in (active_task.get('preparation_options') or []) if str(item).strip())\n\n    if needs_preparation:\n        if tool_name not in spec['preparation_tools']:\n            return None, None, None, None, None, {'error': 'invalid_preparation_tool', 'tool_name': tool_name}\n        if prep_options and tool_name not in prep_options and tool_name not in allowed_tools:\n            return None, None, None, None, None, {'error': 'preparation_tool_not_allowed', 'tool_name': tool_name}\n    else:\n        expected_tool = spec['templates'][template]\n        if tool_name == 'property_mutation_test' and worker_name == 'Authorization Worker' and template in {'cross_role_update', 'function_level_access_probe', 'admin_endpoint_probe'}:\n            pass\n        elif tool_name != expected_tool:\n            return None, None, None, None, None, {'error': 'template_tool_mismatch', 'template': template, 'tool_name': tool_name, 'expected_tool': expected_tool}\n\n    if allowed_tools and tool_name not in allowed_tools:\n        return None, None, None, None, None, {'error': 'tool_not_in_allowed_tools', 'tool_name': tool_name, 'allowed_tools': sorted(allowed_tools)}\n\n    arguments = payload.get('arguments') if isinstance(payload.get('arguments'), dict) else {}\n    success_criteria = payload.get('success_criteria') if isinstance(payload.get('success_criteria'), list) else []\n    if not isinstance(payload.get('hypothesis'), str) or not str(payload.get('hypothesis')).strip():\n        return None, None, None, None, None, {'error': 'missing_hypothesis'}\n    return template, tool_name, arguments, success_criteria, needs_preparation, None\n\n\ndef main(task_class: str, auth_text: str = '', injection_text: str = '', business_text: str = '', active_task_json: str = '', current_execution_context_json: str = '') -> dict:\n    class_name = str(task_class or 'authorization').lower()\n    default_worker = CLASS_TO_WORKER.get(class_name, 'Authorization Worker')\n    payload_text = auth_text if class_name == 'authorization' else injection_text if class_name == 'injection' else business_text\n    payload = _loads_text(payload_text)\n    try:\n        active_task = json.loads(active_task_json or '{}')\n    except Exception:\n        active_task = {}\n    try:\n        execution_context = json.loads(current_execution_context_json or '{}')\n    except Exception:\n        execution_context = {}\n\n    if str(active_task.get('id') or '') == '__no_task__':\n        return _noop_response(default_worker, 'No active task available.', active_task, execution_context)\n\n    valid_worker, worker_name, worker_error = _validate_worker(payload, class_name, default_worker)\n    if not valid_worker:\n        return _noop_response(default_worker, 'Worker payload rejected: invalid worker selection.', active_task, execution_context, worker_error)\n\n    template, tool_name, arguments, success_criteria, needs_preparation, payload_error = _validate_payload(payload, worker_name, active_task)\n    if payload_error:\n        return _noop_response(worker_name, 'Worker payload rejected by parse_worker_command validation.', active_task, execution_context, payload_error)\n\n    envelope = {\n        'execution_context': execution_context,\n        'task': active_task,\n        'tool_name': tool_name,\n        'arguments': arguments,\n    }\n    reasoning_summary = 'Validated strict worker JSON and mapped it to a backend tool request.'\n    return {\n        'selected_worker': worker_name,\n        'selected_template': template,\n        'tool_name': tool_name,\n        'tool_endpoint': TOOL_ENDPOINTS.get(tool_name, TOOL_ENDPOINTS['noop_outcome']),\n        'tool_arguments_json': json.dumps(arguments, ensure_ascii=False),\n        'success_criteria_json': json.dumps(success_criteria, ensure_ascii=False),\n        'worker_hypothesis': str(payload.get('hypothesis') or active_task.get('hypothesis') or ''),\n        'reasoning_summary': reasoning_summary,\n        'normalized_backend_request_json': json.dumps(envelope, ensure_ascii=False),\n    }\n"
