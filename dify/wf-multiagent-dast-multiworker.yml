    - data:
        code: "import json\n\ndef main(remaining_state_json: str, active_task_json: str, verdict_json: str, evidence_json: str, queue_body: str = \"\") -> dict:\n    try:\n        state = json.loads(remaining_state_json or '{}')\n    except Exception:\n        state = {}\n    try:\n        task = json.loads(active_task_json or '{}')\n    except Exception:\n        task = {}\n    try:\n        verdict = json.loads(verdict_json or '{}')\n    except Exception:\n        verdict = {}\n    try:\n        evidence = json.loads(evidence_json or '{}')\n    except Exception:\n        evidence = {}\n    try:\n        queue_update = json.loads(queue_body or '{}')\n    except Exception:\n        queue_update = {}\n\n    task_id = str(task.get(\"id\") or \"\")\n    if task_id == \"__no_task__\":\n        state[\"stop_reason\"] = state.get(\"stop_reason\") or \"no_tasks\"\n        return {\n            \"state_json\": json.dumps(state, ensure_ascii=False),\n            \"should_exit_loop\": True,\n        }\n\n    state.setdefault(\"pending_tasks\", [])\n    state.setdefault(\"confirmed_findings\", [])\n    state.setdefault(\"rejected_findings\", [])\n    state.setdefault(\"evidence_records\", [])\n    state.setdefault(\"completed_tasks\", [])\n    state[\"pending_tasks\"] = queue_update.get(\"pending_tasks\") or state.get(\"pending_tasks\") or []\n    state[\"scheduler_state\"] = queue_update.get(\"scheduler_state\") or state.get(\"scheduler_state\") or {}\n    state[\"last_queue_update_reason\"] = str(queue_update.get(\"queue_update_reason\") or \"\")\n\n    state[\"budget_used\"] = int(state.get(\"budget_used\", 0) or 0) + 1\n    state[\"evidence_records\"].append(evidence)\n    state[\"completed_tasks\"].append(task_id)\n\n    verdict_name = str(verdict.get(\"verdict\") or \"rejected\")\n    if verdict_name == \"confirmed\" and verdict.get(\"finding_candidate\"):\n        state[\"confirmed_findings\"].append(verdict[\"finding_candidate\"])\n    elif verdict_name == \"rework\" and queue_update.get(\"requeued_task_id\"):\n        pass\n    elif verdict_name == \"rework\" and not queue_update.get(\"requeued_task_id\"):\n        state[\"rejected_findings\"].append({\n            \"task_id\": task_id,\n            \"reason\": str(queue_update.get(\"queue_update_reason\") or \"retry_limit_exceeded\"),\n        })\n    else:\n        state[\"rejected_findings\"].append({\n            \"task_id\": task_id,\n            \"reason\": str(verdict.get(\"reason\") or \"\"),\n        })\n\n    if queue_update.get(\"should_stop\") and not state.get(\"pending_tasks\"):\n        state[\"stop_reason\"] = state.get(\"stop_reason\") or \"no_tasks\"\n    should_exit = bool(state.get(\"stop_reason\")) or len(state.get(\"pending_tasks\") or []) == 0\n    return {\n        \"state_json\": json.dumps(state, ensure_ascii=False),\n        \"should_exit_loop\": should_exit,\n    }\n"
