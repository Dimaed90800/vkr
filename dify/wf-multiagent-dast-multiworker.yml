        code: |
          import json
          from datetime import datetime, timezone


          def _dedupe_findings(findings):
              seen = set()
              result = []
              for item in findings or []:
                  if not isinstance(item, dict):
                      continue
                  key = (
                      str(item.get("endpoint") or "").strip(),
                      str(item.get("method") or "").strip().upper(),
                      str(item.get("vuln_type") or "").strip().upper(),
                  )
                  if key in seen:
                      continue
                  seen.add(key)
                  result.append(item)
              return result

          def _emit(run_id: str, component: str, event_type: str, payload: dict):
              record = {
                  "timestamp": datetime.now(timezone.utc).isoformat(),
                  "event_type": event_type,
                  "component": component,
                  "run_id": str(run_id or "").strip(),
                  **payload,
              }
              try:
                  print("[diag-event]", json.dumps(record, ensure_ascii=False))
              except Exception:
                  pass


          def _resolve_final_stop_reason(state: dict) -> dict:
              existing = state.get("final_stop_reason_resolution") or {}
              if isinstance(existing, dict) and str(existing.get("resolved_final_stop_reason") or "").strip():
                  return existing
              raw_state_reason = str(state.get("raw_stop_reason_before_resolution") or state.get("stop_reason") or "").strip()
              scheduler_reason = str(state.get("scheduler_stop_reason") or state.get("last_scheduler_stop_reason") or "").strip()
              transient_reason = str(state.get("transient_stop_reason") or "").strip()
              soft_fallback = bool(state.get("soft_stop_fallback_used") or state.get("continued_after_soft_stop"))
              explicit_final = str(state.get("final_stop_reason") or "").strip()
              if explicit_final:
                  resolved = explicit_final
              elif raw_state_reason == "timeout" and scheduler_reason and scheduler_reason != "timeout":
                  resolved = scheduler_reason
              elif transient_reason == "timeout" and scheduler_reason and scheduler_reason != "timeout":
                  resolved = scheduler_reason
              else:
                  resolved = raw_state_reason or scheduler_reason or "loop_finished"
              return {
                  "raw_state_stop_reason": raw_state_reason,
                  "scheduler_selection_reason": scheduler_reason,
                  "transient_stop_reason": transient_reason,
                  "soft_stop_fallback_used": soft_fallback,
                  "resolved_final_stop_reason": resolved,
              }


          def main(target_url: str, state_json: str) -> dict:
              try:
                  state = json.loads(state_json or '{}')
              except Exception:
                  state = {}
              confirmed_findings = _dedupe_findings(state.get("confirmed_findings", []))
              resolution = _resolve_final_stop_reason(state)
              run_id = str((state.get("execution_context") or {}).get("run_id") or (state.get("scheduler_state") or {}).get("run_id") or "").strip()
              _emit(run_id, "reporter", "final_stop_reason_resolved", {
                  "status": "success",
                  "summary": "Resolved final report stop reason.",
                  "reason": {
                      "raw_state_stop_reason": resolution["raw_state_stop_reason"],
                      "scheduler_selection_reason": resolution["scheduler_selection_reason"],
                      "resolved_final_stop_reason": resolution["resolved_final_stop_reason"],
                  },
                  "artifacts": {
                      "transient_stop_reason": resolution["transient_stop_reason"],
                      "soft_stop_fallback_used": resolution["soft_stop_fallback_used"],
                  },
              })
              report_context = {
                  "target_url": target_url,
                  "confirmed_findings": confirmed_findings,
                  "completed_tasks": len(state.get("completed_tasks", [])),
                  "rejected_tasks": len(state.get("rejected_findings", [])),
                  "evidence_records": len(state.get("evidence_records", [])),
                  "stop_reason": resolution["resolved_final_stop_reason"],
                  "stop_reason_resolution": resolution,
                  "budget_used": state.get("budget_used", 0),
              }
              return {
                  "report_context_json": json.dumps(report_context, ensure_ascii=False),
              }
