    - data:
        code: "import json\nfrom datetime import datetime, timezone\n\ndef _no_task() -> dict:\n    return {\n        \"id\": \"__no_task__\",\n        \"class\": \"authorization\",\n        \"subtype\": \"noop\",\n        \"endpoint\": \"/__dify_no_task__\",\n        \"method\": \"GET\",\n        \"params\": {\"path_params\": [], \"query_params\": [], \"body_fields\": []},\n        \"auth_context\": {\"owner_role\": \"user_a\", \"other_role\": \"user_b\", \"token_strategy\": \"none\"},\n        \"hypothesis\": \"No task available.\",\n        \"priority\": 0,\n        \"retry_count\": 0,\n        \"rework_hint\": None,\n        \"status\": \"pending\",\n        \"allowed_tools\": [\"auth_test_access\"],\n    }\n\ndef main(state_json: str, scheduler_body: str = \"\") -> dict:\n    try:\n        state = json.loads(state_json or '{}')\n    except Exception:\n        state = {}\n    try:\n        scheduler = json.loads(scheduler_body or '{}')\n    except Exception:\n        scheduler = {}\n\n    stop_reason = str(state.get(\"stop_reason\") or \"\")\n    if not stop_reason:\n        if state.get(\"budget_used\", 0) >= state.get(\"max_requests\", 100):\n            stop_reason = \"budget_exceeded\"\n        else:\n            start_ts = state.get(\"start_timestamp\")\n            max_dur = int(state.get(\"max_duration_sec\", 900) or 900)\n            if start_ts:\n                try:\n                    started = datetime.fromisoformat(start_ts)\n                    if (datetime.now(timezone.utc) - started).total_seconds() >= max_dur:\n                        stop_reason = \"timeout\"\n                except Exception:\n                    pass\n\n    if stop_reason:\n        state[\"stop_reason\"] = stop_reason\n        active = _no_task()\n        return {\n            \"active_task_json\": json.dumps(active, ensure_ascii=False),\n            \"task_class\": \"authorization\",\n            \"remaining_tasks_json\": json.dumps(state.get(\"pending_tasks\") or [], ensure_ascii=False),\n            \"scheduler_state_json\": json.dumps(state.get(\"scheduler_state\") or {}, ensure_ascii=False),\n            \"remaining_state_json\": json.dumps(state, ensure_ascii=False),\n            \"max_retries\": int(state.get(\"max_retries\", 1) or 1),\n        }\n\n    should_stop = bool(scheduler.get(\"should_stop\"))\n    if should_stop:\n        state[\"stop_reason\"] = state.get(\"stop_reason\") or \"no_runnable_tasks\"\n        active = _no_task()\n        return {\n            \"active_task_json\": json.dumps(active, ensure_ascii=False),\n            \"task_class\": \"authorization\",\n            \"remaining_tasks_json\": json.dumps(state.get(\"pending_tasks\") or [], ensure_ascii=False),\n            \"remaining_state_json\": json.dumps(state, ensure_ascii=False),\n            \"scheduler_state_json\": json.dumps(state.get(\"scheduler_state\") or {}, ensure_ascii=False),\n            \"max_retries\": int(state.get(\"max_retries\", 1) or 1),\n        }\n\n    active = scheduler.get(\"next_task\") or _no_task()\n    state[\"pending_tasks\"] = scheduler.get(\"remaining_tasks\") or []\n    state[\"scheduler_state\"] = scheduler.get(\"scheduler_state\") or state.get(\"scheduler_state\") or {}\n    state[\"last_selection_reason\"] = str(scheduler.get(\"selection_reason\") or \"\")\n    state[\"last_deferred_classes\"] = scheduler.get(\"deferred_classes\") or []\n    return {\n        \"active_task_json\": json.dumps(active, ensure_ascii=False),\n        \"task_class\": str(active.get(\"class\") or \"authorization\").lower(),\n        \"remaining_tasks_json\": json.dumps(state.get(\"pending_tasks\") or [], ensure_ascii=False),\n        \"scheduler_state_json\": json.dumps(state.get(\"scheduler_state\") or {}, ensure_ascii=False),\n        \"remaining_state_json\": json.dumps(state, ensure_ascii=False),\n        \"max_retries\": int(state.get(\"max_retries\", 1) or 1),\n    }\n"
