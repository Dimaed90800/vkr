    - data:
        code: "import json\n\ndef _empty_payload() -> dict:\n    return {\n        'authorization': {\n            'candidate_targets': [],\n            'likely_subtypes': [],\n            'missing_prerequisites': [],\n            'candidate_bootstrap_endpoints': {'register': [], 'login': [], 'profile': [], 'create_resource': []},\n            'preparation_suggestions': [],\n            'priority_hint': 0.0,\n            'confidence': 0.0,\n        },\n        'injection': {\n            'candidate_targets': [],\n            'likely_subtypes': [],\n            'missing_prerequisites': [],\n            'candidate_bootstrap_endpoints': {'shape_probe': [], 'reflection_probe': [], 'path_probe': []},\n            'preparation_suggestions': [],\n            'priority_hint': 0.0,\n            'confidence': 0.0,\n        },\n        'business_logic': {\n            'candidate_targets': [],\n            'likely_subtypes': [],\n            'missing_prerequisites': [],\n            'candidate_bootstrap_endpoints': {'workflow_roots': [], 'create': [], 'transition': []},\n            'preparation_suggestions': [],\n            'priority_hint': 0.0,\n            'confidence': 0.0,\n        },\n        'global_notes': [],\n        'global_priority_order': [],\n    }\n\ndef _normalize_list(value):\n    return [str(item or '').strip() for item in (value or []) if str(item or '').strip()]\n\ndef _normalize_float(value):\n    try:\n        numeric = float(value)\n    except Exception:\n        return 0.0\n    return max(0.0, min(1.0, numeric))\n\ndef _normalize_section(section_name, payload):\n    section = payload.get(section_name) or {}\n    if not isinstance(section, dict):\n        section = {}\n    result = _empty_payload()[section_name]\n    result['candidate_targets'] = _normalize_list(section.get('candidate_targets'))\n    result['likely_subtypes'] = _normalize_list(section.get('likely_subtypes'))\n    result['missing_prerequisites'] = _normalize_list(section.get('missing_prerequisites'))\n    result['preparation_suggestions'] = _normalize_list(section.get('preparation_suggestions'))\n    result['priority_hint'] = _normalize_float(section.get('priority_hint'))\n    result['confidence'] = _normalize_float(section.get('confidence'))\n    candidate_bootstrap = section.get('candidate_bootstrap_endpoints') or {}\n    if not isinstance(candidate_bootstrap, dict):\n        candidate_bootstrap = {}\n    for key in result['candidate_bootstrap_endpoints'].keys():\n        result['candidate_bootstrap_endpoints'][key] = _normalize_list(candidate_bootstrap.get(key))\n    return result\n\ndef main(text: str) -> dict:\n    try:\n        payload = json.loads(text or '{}')\n    except Exception:\n        payload = {}\n    normalized = _empty_payload()\n    normalized['authorization'] = _normalize_section('authorization', payload)\n    normalized['injection'] = _normalize_section('injection', payload)\n    normalized['business_logic'] = _normalize_section('business_logic', payload)\n    normalized['global_notes'] = _normalize_list(payload.get('global_notes'))\n    normalized['global_priority_order'] = _normalize_list(payload.get('global_priority_order'))\n    return {\n        'synthesized_security_context_json': json.dumps(normalized, ensure_ascii=False)\n    }\n"
