    - data:
        code: "import json\nimport re\nfrom datetime import datetime, timezone\n\nUUID_RE = re.compile(r'[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}')\nNUMERIC_ID_RE = re.compile(r'(?<![A-Za-z0-9_])(\\d{2,})(?![A-Za-z0-9_])')\n\n\ndef _task_type(task):\n    cls = str(task.get('class') or '').strip().lower()\n    if cls == 'authorization':\n        return 'authz_check'\n    if cls == 'injection':\n        return 'focused_injection_check'\n    if cls == 'business_logic':\n        return 'business_flow_check'\n    subtype = str(task.get('subtype') or '').strip().lower()\n    if 'bola' in subtype or 'privilege' in subtype or 'authorization' in subtype:\n        return 'authz_check'\n    if 'workflow' in subtype or 'logic' in subtype:\n        return 'business_flow_check'\n    return 'focused_injection_check'\n\n\ndef _append_unique(items, value):\n    text = str(value or '').strip()\n    if text and text not in items:\n        items.append(text)\n\n\ndef _extract_ids(task, result):\n    ids = []\n    params = task.get('params') or {}\n    _append_unique(ids, params.get('selected_object_id'))\n    for candidate in params.get('object_id_candidates') or []:\n        _append_unique(ids, candidate)\n\n    created = result.get('created_object') or {}\n    if isinstance(created, dict):\n        for key in ('id', 'object_id', 'resource_id'):\n            _append_unique(ids, created.get(key))\n\n    request_summary = result.get('request_summary') or {}\n    endpoint = str(request_summary.get('endpoint') or '')\n    for match in UUID_RE.findall(endpoint):\n        _append_unique(ids, match)\n    for match in NUMERIC_ID_RE.findall(endpoint):\n        _append_unique(ids, match)\n\n    response_summary = result.get('response_summary') or {}\n    for container_key in ('owner', 'other', 'attack', 'baseline', 'repeat'):\n        container = response_summary.get(container_key) or {}\n        if isinstance(container, dict):\n            for key in ('id', 'object_id', 'resource_id'):\n                _append_unique(ids, container.get(key))\n            json_body = container.get('json_body') or {}\n            if isinstance(json_body, dict):\n                for key in ('id', 'object_id', 'resource_id'):\n                    _append_unique(ids, json_body.get(key))\n\n    for artifact in result.get('artifacts') or []:\n        if not isinstance(artifact, dict):\n            continue\n        value = artifact.get('value')\n        if isinstance(value, dict):\n            for key in ('id', 'object_id', 'resource_id', 'selected_object_id'):\n                _append_unique(ids, value.get(key))\n    return ids\n\n\ndef _sequence_steps(task, result):\n    steps = []\n    hints = task.get('context_hints') or {}\n    _append_unique(steps, hints.get('sequence_template'))\n    request_summary = result.get('request_summary') or {}\n    for key in ('baseline_sequence', 'attack_sequence', 'sequence_steps', 'workflow_steps', 'steps'):\n        value = request_summary.get(key)\n        if isinstance(value, list):\n            for item in value:\n                _append_unique(steps, item)\n    response_summary = result.get('response_summary') or {}\n    for key in ('sequence_steps', 'workflow_steps', 'steps'):\n        value = response_summary.get(key)\n        if isinstance(value, list):\n            for item in value:\n                _append_unique(steps, item)\n    return steps\n\n\ndef _diff_summary(response_summary):\n    if not isinstance(response_summary, dict):\n        return {}\n    for key in ('diff', 'state_delta_summary', 'violated_invariant_summary', 'status_diff'):\n        value = response_summary.get(key)\n        if isinstance(value, dict) and value:\n            return value\n    owner = response_summary.get('owner') or {}\n    other = response_summary.get('other') or {}\n    summary = {}\n    if 'similarity' in response_summary:\n        summary['similarity'] = response_summary.get('similarity')\n    if isinstance(owner, dict) and 'status_code' in owner:\n        summary['owner_status'] = owner.get('status_code')\n    if isinstance(other, dict) and 'status_code' in other:\n        summary['other_status'] = other.get('status_code')\n    return summary\n\n\ndef _is_2xx(value):\n    try:\n        code = int(value)\n    except Exception:\n        return False\n    return 200 <= code < 300\n\n\ndef _oracle_flags(indicators, response_summary):\n    flags = []\n    mapping = {\n        'potential_bola': 'cross_tenant_access',\n        'access_control_difference': 'missing_403',\n        'mutated_field_reflected': 'privileged_field_write',\n        'sensitive_field_accepted': 'privileged_field_write',\n        'sensitive_field_persisted': 'privileged_field_write',\n        'invalid_transition_accepted': 'invalid_state_transition',\n        'repeated_sensitive_action_allowed': 'repeated_sensitive_action',\n        'workflow_state_bypass': 'step_bypass',\n        'reflection_signal': 'reflection_signal',\n        'sql_error_signal': 'reflection_signal',\n        'template_error_signal': 'reflection_signal',\n        'command_error_signal': 'reflection_signal',\n        'parser_error_signal': 'reflection_signal',\n        'no_rate_limit_detected': 'abnormal_response_time',\n        'parser_validation_error': 'parser_validation_error',\n        'invalid_template_for_worker': 'invalid_template_for_worker',\n    }\n    for item in indicators or []:\n        mapped = mapping.get(str(item))\n        if mapped and mapped not in flags:\n            flags.append(mapped)\n\n    if not isinstance(response_summary, dict):\n        return flags\n\n    owner = response_summary.get('owner') or {}\n    other = response_summary.get('other') or {}\n    similarity = response_summary.get('similarity')\n    if isinstance(owner, dict) and isinstance(other, dict):\n        owner_status = owner.get('status_code')\n        other_status = other.get('status_code')\n        if _is_2xx(owner_status) and _is_2xx(other_status):\n            _append_unique(flags, 'unexpected_2xx')\n            _append_unique(flags, 'cross_tenant_access')\n            _append_unique(flags, 'missing_403')\n        if similarity not in (None, ''):\n            try:\n                if float(similarity) >= 0.9 and _is_2xx(owner_status) and _is_2xx(other_status):\n                    _append_unique(flags, 'cross_tenant_access')\n            except Exception:\n                pass\n\n    reflection = response_summary.get('reflection') or {}\n    sink_signal = response_summary.get('sink_signal') or {}\n    time_signal = response_summary.get('time_signal') or {}\n    if isinstance(reflection, dict) and (reflection.get('reflection_detected') or reflection.get('unescaped_reflection')):\n        _append_unique(flags, 'reflection_signal')\n    if isinstance(sink_signal, dict) and any(sink_signal.get(key) for key in ('sql_error_signal', 'template_error_signal', 'command_error_signal', 'parser_error_signal')):\n        _append_unique(flags, 'reflection_signal')\n    if isinstance(time_signal, dict) and time_signal.get('significant_time_anomaly'):\n        _append_unique(flags, 'abnormal_response_time')\n\n    diff = response_summary.get('diff') or {}\n    if isinstance(diff, dict):\n        if diff.get('response_size_delta'):\n            _append_unique(flags, 'abnormal_response_size')\n        try:\n            if float(diff.get('time_delta_ms') or 0) > 0:\n                _append_unique(flags, 'abnormal_response_time')\n        except Exception:\n            pass\n\n    invariant = response_summary.get('violated_invariant_summary') or {}\n    state_delta = response_summary.get('state_delta_summary') or {}\n    if isinstance(invariant, dict):\n        if invariant.get('invalid_transition_accepted'):\n            _append_unique(flags, 'invalid_state_transition')\n        if invariant.get('repeated_sensitive_action_allowed'):\n            _append_unique(flags, 'repeated_sensitive_action')\n            _append_unique(flags, 'idempotency_violation')\n        if invariant.get('cross_role_workflow_access'):\n            _append_unique(flags, 'step_bypass')\n    if isinstance(state_delta, dict):\n        if state_delta.get('owner_repeat_allowed'):\n            _append_unique(flags, 'repeated_sensitive_action')\n            _append_unique(flags, 'idempotency_violation')\n        if state_delta.get('cross_role_attack_allowed'):\n            _append_unique(flags, 'step_bypass')\n\n    auth_hint = str(response_summary.get('auth_finding_type') or '').strip().lower()\n    if auth_hint in {'potential_bola', 'bola', 'horizontal_privilege_escalation', 'vertical_privilege_escalation', 'generic_access_control', 'function_level_authorization'}:\n        _append_unique(flags, 'cross_tenant_access')\n        _append_unique(flags, 'missing_403')\n\n    return flags\n\n\ndef _short_execution_summary(response_summary, indicators, reasoning_summary, worker_hypothesis):\n    if isinstance(response_summary, dict):\n        auth_hint = response_summary.get('auth_finding_type')\n        if auth_hint:\n            owner = response_summary.get('owner') or {}\n            other = response_summary.get('other') or {}\n            if owner or other:\n                return f'Authorization comparison completed with finding hint {auth_hint}.'\n        if response_summary.get('finding_title_hint'):\n            return str(response_summary.get('finding_title_hint'))\n        invariant = response_summary.get('violated_invariant_summary') or {}\n        if isinstance(invariant, dict):\n            if invariant.get('invalid_transition_accepted'):\n                return 'Workflow test accepted an invalid state transition.'\n            if invariant.get('repeated_sensitive_action_allowed'):\n                return 'Workflow test allowed a repeated sensitive action.'\n        reflection = response_summary.get('reflection') or {}\n        if isinstance(reflection, dict) and reflection.get('reflection_detected'):\n            return 'Injection probe caused reflected attacker-controlled input.'\n        sink_signal = response_summary.get('sink_signal') or {}\n        if isinstance(sink_signal, dict) and any(sink_signal.get(key) for key in ('sql_error_signal', 'template_error_signal', 'command_error_signal', 'parser_error_signal')):\n            return 'Injection probe produced a backend error signal consistent with unsafe input handling.'\n\n    if indicators:\n        return 'Observed indicators: ' + ', '.join(str(item) for item in indicators[:5])\n    if reasoning_summary:\n        return str(reasoning_summary)\n    return str(worker_hypothesis or '')\n\n\ndef _loads_json(value, default):\n    try:\n        parsed = json.loads(value or 'null')\n    except Exception:\n        return default\n    return parsed if parsed is not None else default\n\n\ndef _parser_validation_error(tool_name, tool_arguments):\n    if str(tool_name or '').strip() != 'noop_outcome':\n        return None\n    warning = tool_arguments.get('_parser_warning') if isinstance(tool_arguments, dict) else None\n    if not isinstance(warning, dict):\n        return None\n    error = str(warning.get('error') or '').strip().lower()\n    if not error:\n        return {'classification': 'parser_validation_error', 'indicator': 'parser_validation_error'}\n    if error == 'invalid_template':\n        return {'classification': 'parser_validation_error', 'indicator': 'invalid_template_for_worker'}\n    return {'classification': 'parser_validation_error', 'indicator': 'parser_validation_error'}\n\n\ndef main(active_task_json: str, body: str, worker_hypothesis: str, reasoning_summary: str, current_execution_context_json: str = '', selected_worker: str = '', selected_template: str = '', success_criteria_json: str = '', tool_name: str = '', tool_arguments_json: str = '{}') -> dict:\n    try:\n        task = json.loads(active_task_json or '{}')\n    except Exception:\n        task = {}\n    try:\n        result = json.loads(body or '{}')\n    except Exception:\n        result = {}\n    try:\n        execution_context = json.loads(current_execution_context_json or '{}')\n    except Exception:\n        execution_context = {}\n    try:\n        success_criteria = json.loads(success_criteria_json or '[]')\n    except Exception:\n        success_criteria = []\n    tool_arguments = _loads_json(tool_arguments_json, {})\n\n    request_summary = result.get('request_summary') or {}\n    response_summary = result.get('response_summary') or {}\n    indicators = list(result.get('indicators') or [])\n    run_id = str(execution_context.get('run_id') or '').strip()\n    root_trace_id = str(execution_context.get('root_trace_id') or run_id).strip()\n    sequence_template = ((task.get('context_hints') or {}).get('sequence_template'))\n    auth_context = task.get('auth_context') or {}\n    parser_error = _parser_validation_error(tool_name, tool_arguments)\n    classification_hint = response_summary.get('finding_type_hint') or response_summary.get('auth_finding_type') or task.get('subtype')\n    if parser_error:\n        classification_hint = parser_error['classification']\n        _append_unique(indicators, 'parser_validation_error')\n        _append_unique(indicators, parser_error['indicator'])\n\n    evidence = {\n        'task_id': task.get('id'),\n        'task_type': _task_type(task),\n        'assigned_worker': selected_worker or ((task.get('context_hints') or {}).get('router_assigned_worker')),\n        'chosen_template': selected_template or ((task.get('context_hints') or {}).get('router_selected_template')),\n        'operation': f\"{str(task.get('method') or '').upper()} {str(task.get('endpoint') or '')}\".strip(),\n        'sequence_template': sequence_template,\n        'auth_contexts_used': [item for item in [auth_context.get('owner_role'), auth_context.get('other_role')] if item],\n        'request_summary': request_summary,\n        'response_summary': response_summary,\n        'extracted_ids': _extract_ids(task, result),\n        'sequence_steps': _sequence_steps(task, result),\n        'diff_summary': _diff_summary(response_summary),\n        'oracle_flags': _oracle_flags(indicators, response_summary),\n        'short_execution_summary': _short_execution_summary(response_summary, indicators, reasoning_summary, worker_hypothesis),\n        'retry_count': int(task.get('retry_count') or 0),\n        'timestamps': {\n            'executed_at': datetime.now(timezone.utc).isoformat(),\n            'run_id': run_id,\n            'root_trace_id': root_trace_id,\n        },\n        'artifacts': result.get('artifacts') or [],\n        'raw_status': result.get('raw_status') or 'unknown',\n        'success_criteria': success_criteria if isinstance(success_criteria, list) else [],\n        'indicators': indicators,\n        'classification_hint': classification_hint,\n        'reasoning': reasoning_summary or worker_hypothesis,\n    }\n    return {'evidence_json': json.dumps(evidence, ensure_ascii=False)}\n"
