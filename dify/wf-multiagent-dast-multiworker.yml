    - data:
        code: "import json\n\ndef _endpoint_key(endpoint):\n    return (str(endpoint.get('method') or 'GET').upper(), str(endpoint.get('path') or ''))\n\ndef _merge_strings(left, right):\n    values = []\n    seen = set()\n    for item in [*(left or []), *(right or [])]:\n        value = str(item or '').strip()\n        if not value or value in seen:\n            continue\n        seen.add(value)\n        values.append(value)\n    return values\n\ndef _merge_examples(left, right):\n    values = []\n    seen = set()\n    for item in [*(left or []), *(right or [])]:\n        if not isinstance(item, dict):\n            continue\n        key = (str(item.get('source') or ''), str(item.get('method') or ''), str(item.get('url') or ''))\n        if key in seen:\n            continue\n        seen.add(key)\n        values.append(item)\n    return values[:5]\n\ndef _merge_endpoint(primary, secondary):\n    merged = dict(primary)\n    merged['path_params'] = merged.get('path_params') or secondary.get('path_params') or []\n    merged['query_params'] = sorted(set((merged.get('query_params') or []) + (secondary.get('query_params') or [])))\n    merged['body_fields'] = sorted(set((merged.get('body_fields') or []) + (secondary.get('body_fields') or [])))\n    merged['object_param_name'] = merged.get('object_param_name') or secondary.get('object_param_name') or ''\n    merged['object_id_candidates'] = _merge_strings(merged.get('object_id_candidates') or [], secondary.get('object_id_candidates') or [])\n    left_signals = merged.get('resource_signals') or {}\n    right_signals = secondary.get('resource_signals') or {}\n    merged['resource_signals'] = {\n        'has_object_id': bool(left_signals.get('has_object_id')) or bool(right_signals.get('has_object_id')),\n        'has_role_fields': bool(left_signals.get('has_role_fields')) or bool(right_signals.get('has_role_fields')),\n        'has_sensitive_keywords': bool(left_signals.get('has_sensitive_keywords')) or bool(right_signals.get('has_sensitive_keywords')),\n    }\n    left_auth = merged.get('auth_signals') or {}\n    right_auth = secondary.get('auth_signals') or {}\n    merged['auth_signals'] = {\n        'has_auth_header': bool(left_auth.get('has_auth_header')) or bool(right_auth.get('has_auth_header')),\n        'has_cookie_auth': bool(left_auth.get('has_cookie_auth')) or bool(right_auth.get('has_cookie_auth')),\n        'header_names': _merge_strings(left_auth.get('header_names') or [], right_auth.get('header_names') or []),\n        'cookie_names': _merge_strings(left_auth.get('cookie_names') or [], right_auth.get('cookie_names') or []),\n    }\n    merged['observed_examples'] = _merge_examples(merged.get('observed_examples') or [], secondary.get('observed_examples') or [])\n    merged['sources'] = _merge_strings(merged.get('sources') or [], secondary.get('sources') or [])\n    merged['source_confidence'] = max(float(merged.get('source_confidence') or 0), float(secondary.get('source_confidence') or 0))\n    merged['auth_required'] = bool(merged.get('auth_required')) or bool(secondary.get('auth_required'))\n    merged['security_schemes'] = _merge_strings(merged.get('security_schemes') or [], secondary.get('security_schemes') or [])\n    left_classes = merged.get('candidate_classes') or []\n    right_classes = secondary.get('candidate_classes') or []\n    merged['candidate_classes'] = list(dict.fromkeys(left_classes + right_classes))\n    left_scores = merged.get('candidate_scores') or {}\n    right_scores = secondary.get('candidate_scores') or {}\n    merged['candidate_scores'] = {\n        'authorization': max(float(left_scores.get('authorization') or 0), float(right_scores.get('authorization') or 0)),\n        'injection': max(float(left_scores.get('injection') or 0), float(right_scores.get('injection') or 0)),\n        'business_logic': max(float(left_scores.get('business_logic') or 0), float(right_scores.get('business_logic') or 0)),\n    }\n    return merged\n\ndef _annotate(endpoint, source_name, confidence):\n    enriched = dict(endpoint)\n    enriched['sources'] = _merge_strings(enriched.get('sources') or [], [source_name])\n    enriched['source_confidence'] = max(float(enriched.get('source_confidence') or 0), confidence)\n    return enriched\n\ndef main(openapi_surface_json: str, discovery_surface_json: str, traffic_surface_json: str) -> dict:\n    try:\n        openapi_surface = json.loads(openapi_surface_json or '{}')\n    except Exception:\n        openapi_surface = {}\n    try:\n        discovery_surface = json.loads(discovery_surface_json or '{}')\n    except Exception:\n        discovery_surface = {}\n    try:\n        traffic_surface = json.loads(traffic_surface_json or '{}')\n    except Exception:\n        traffic_surface = {}\n\n    merged = {}\n    for endpoint in openapi_surface.get('endpoints') or []:\n        if isinstance(endpoint, dict):\n            merged[_endpoint_key(endpoint)] = _annotate(endpoint, 'openapi', 0.9)\n    for surface_name, confidence, surface in [('discovery', 0.75, discovery_surface), ('traffic', 0.95, traffic_surface)]:\n        for endpoint in surface.get('endpoints') or []:\n            if not isinstance(endpoint, dict):\n                continue\n            endpoint = _annotate(endpoint, surface_name, confidence)\n            key = _endpoint_key(endpoint)\n            if key in merged:\n                merged[key] = _merge_endpoint(merged[key], endpoint)\n            else:\n                merged[key] = endpoint\n\n    merged_surface = {'endpoints': sorted(merged.values(), key=lambda item: (str(item.get('path') or ''), str(item.get('method') or 'GET')))}\n    return {\n        'merged_surface_json': json.dumps(merged_surface, ensure_ascii=False),\n        'merged_surface_total': len(merged_surface['endpoints']),\n    }\n"
