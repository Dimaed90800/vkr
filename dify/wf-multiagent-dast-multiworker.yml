    - data:
        code: |
          import json
          import re
          from datetime import datetime, timezone

          UUID_RE = re.compile(r'[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}')
          NUMERIC_ID_RE = re.compile(r'(?<![A-Za-z0-9_])(\d{2,})(?![A-Za-z0-9_])')


          def _task_type(task):
              cls = str(task.get('class') or '').strip().lower()
              if cls == 'authorization':
                  return 'authz_check'
              if cls == 'injection':
                  return 'focused_injection_check'
              if cls == 'business_logic':
                  return 'business_flow_check'
              subtype = str(task.get('subtype') or '').strip().lower()
              if 'bola' in subtype or 'privilege' in subtype or 'authorization' in subtype:
                  return 'authz_check'
              if 'workflow' in subtype or 'logic' in subtype:
                  return 'business_flow_check'
              return 'focused_injection_check'


          def _append_unique(items, value):
              text = str(value or '').strip()
              if text and text not in items:
                  items.append(text)


          def _extract_ids(task, result):
              ids = []
              params = task.get('params') or {}
              _append_unique(ids, params.get('selected_object_id'))
              for candidate in params.get('object_id_candidates') or []:
                  _append_unique(ids, candidate)

              created = result.get('created_object') or {}
              if isinstance(created, dict):
                  for key in ('id', 'object_id', 'resource_id'):
                      _append_unique(ids, created.get(key))

              request_summary = result.get('request_summary') or {}
              endpoint = str(request_summary.get('endpoint') or '')
              for match in UUID_RE.findall(endpoint):
                  _append_unique(ids, match)
              for match in NUMERIC_ID_RE.findall(endpoint):
                  _append_unique(ids, match)

              response_summary = result.get('response_summary') or {}
              for container_key in ('owner', 'other', 'attack', 'baseline', 'repeat'):
                  container = response_summary.get(container_key) or {}
                  if isinstance(container, dict):
                      for key in ('id', 'object_id', 'resource_id'):
                          _append_unique(ids, container.get(key))
                      json_body = container.get('json_body') or {}
                      if isinstance(json_body, dict):
                          for key in ('id', 'object_id', 'resource_id'):
                              _append_unique(ids, json_body.get(key))

              for artifact in result.get('artifacts') or []:
                  if not isinstance(artifact, dict):
                      continue
                  value = artifact.get('value')
                  if isinstance(value, dict):
                      for key in ('id', 'object_id', 'resource_id', 'selected_object_id'):
                          _append_unique(ids, value.get(key))
              return ids


          def _sequence_steps(task, result):
              steps = []
              hints = task.get('context_hints') or {}
              _append_unique(steps, hints.get('sequence_template'))
              request_summary = result.get('request_summary') or {}
              for key in ('baseline_sequence', 'attack_sequence', 'sequence_steps', 'workflow_steps', 'steps'):
                  value = request_summary.get(key)
                  if isinstance(value, list):
                      for item in value:
                          _append_unique(steps, item)
              response_summary = result.get('response_summary') or {}
              for key in ('sequence_steps', 'workflow_steps', 'steps'):
                  value = response_summary.get(key)
                  if isinstance(value, list):
                      for item in value:
                          _append_unique(steps, item)
              return steps


          def _diff_summary(response_summary):
              if not isinstance(response_summary, dict):
                  return {}
              for key in ('diff', 'state_delta_summary', 'violated_invariant_summary', 'status_diff'):
                  value = response_summary.get(key)
                  if isinstance(value, dict) and value:
                      return value
              owner = response_summary.get('owner') or {}
              other = response_summary.get('other') or {}
              summary = {}
              if 'similarity' in response_summary:
                  summary['similarity'] = response_summary.get('similarity')
              if isinstance(owner, dict) and 'status_code' in owner:
                  summary['owner_status'] = owner.get('status_code')
              if isinstance(other, dict) and 'status_code' in other:
                  summary['other_status'] = other.get('status_code')
              return summary


          def _is_2xx(value):
              try:
                  code = int(value)
              except Exception:
                  return False
              return 200 <= code < 300


          def _oracle_flags(indicators, response_summary):
              flags = []
              mapping = {
                  'potential_bola': 'cross_tenant_access',
                  'access_control_difference': 'missing_403',
                  'mutated_field_reflected': 'privileged_field_write',
                  'sensitive_field_accepted': 'privileged_field_write',
                  'sensitive_field_persisted': 'privileged_field_write',
                  'invalid_transition_accepted': 'invalid_state_transition',
                  'repeated_sensitive_action_allowed': 'repeated_sensitive_action',
                  'workflow_state_bypass': 'step_bypass',
                  'reflection_signal': 'reflection_signal',
                  'sql_error_signal': 'reflection_signal',
                  'template_error_signal': 'reflection_signal',
                  'command_error_signal': 'reflection_signal',
                  'parser_error_signal': 'reflection_signal',
                  'no_rate_limit_detected': 'abnormal_response_time',
                  'parser_validation_error': 'parser_validation_error',
                  'invalid_template_for_worker': 'invalid_template_for_worker',
              }
              for item in indicators or []:
                  mapped = mapping.get(str(item))
                  if mapped and mapped not in flags:
                      flags.append(mapped)

              if not isinstance(response_summary, dict):
                  return flags

              owner = response_summary.get('owner') or {}
              other = response_summary.get('other') or {}
              similarity = response_summary.get('similarity')
              if isinstance(owner, dict) and isinstance(other, dict):
                  owner_status = owner.get('status_code')
                  other_status = other.get('status_code')
                  if _is_2xx(owner_status) and _is_2xx(other_status):
                      _append_unique(flags, 'unexpected_2xx')
                      _append_unique(flags, 'cross_tenant_access')
                      _append_unique(flags, 'missing_403')
                  if similarity not in (None, ''):
                      try:
                          if float(similarity) >= 0.9 and _is_2xx(owner_status) and _is_2xx(other_status):
                              _append_unique(flags, 'cross_tenant_access')
                      except Exception:
                          pass

              reflection = response_summary.get('reflection') or {}
              sink_signal = response_summary.get('sink_signal') or {}
              time_signal = response_summary.get('time_signal') or {}
              if isinstance(reflection, dict) and (reflection.get('reflection_detected') or reflection.get('unescaped_reflection')):
                  _append_unique(flags, 'reflection_signal')
              if isinstance(sink_signal, dict) and any(sink_signal.get(key) for key in ('sql_error_signal', 'template_error_signal', 'command_error_signal', 'parser_error_signal')):
                  _append_unique(flags, 'reflection_signal')
              if isinstance(time_signal, dict) and time_signal.get('significant_time_anomaly'):
                  _append_unique(flags, 'abnormal_response_time')

              diff = response_summary.get('diff') or {}
              if isinstance(diff, dict):
                  if diff.get('response_size_delta'):
                      _append_unique(flags, 'abnormal_response_size')
                  try:
                      if float(diff.get('time_delta_ms') or 0) > 0:
                          _append_unique(flags, 'abnormal_response_time')
                  except Exception:
                      pass

              invariant = response_summary.get('violated_invariant_summary') or {}
              state_delta = response_summary.get('state_delta_summary') or {}
              if isinstance(invariant, dict):
                  if invariant.get('invalid_transition_accepted'):
                      _append_unique(flags, 'invalid_state_transition')
                  if invariant.get('repeated_sensitive_action_allowed'):
                      _append_unique(flags, 'repeated_sensitive_action')
                      _append_unique(flags, 'idempotency_violation')
                  if invariant.get('cross_role_workflow_access'):
                      _append_unique(flags, 'step_bypass')
              if isinstance(state_delta, dict):
                  if state_delta.get('owner_repeat_allowed'):
                      _append_unique(flags, 'repeated_sensitive_action')
                      _append_unique(flags, 'idempotency_violation')
                  if state_delta.get('cross_role_attack_allowed'):
                      _append_unique(flags, 'step_bypass')

              auth_hint = str(response_summary.get('auth_finding_type') or '').strip().lower()
              if auth_hint in {'potential_bola', 'bola', 'horizontal_privilege_escalation', 'vertical_privilege_escalation', 'generic_access_control', 'function_level_authorization'}:
                  _append_unique(flags, 'cross_tenant_access')
                  _append_unique(flags, 'missing_403')

              return flags


          def _short_execution_summary(response_summary, indicators, reasoning_summary, worker_hypothesis):
              if isinstance(response_summary, dict):
                  auth_hint = response_summary.get('auth_finding_type')
                  if auth_hint:
                      owner = response_summary.get('owner') or {}
                      other = response_summary.get('other') or {}
                      if owner or other:
                          return f'Authorization comparison completed with finding hint {auth_hint}.'
                  if response_summary.get('finding_title_hint'):
                      return str(response_summary.get('finding_title_hint'))
                  invariant = response_summary.get('violated_invariant_summary') or {}
                  if isinstance(invariant, dict):
                      if invariant.get('invalid_transition_accepted'):
                          return 'Workflow test accepted an invalid state transition.'
                      if invariant.get('repeated_sensitive_action_allowed'):
                          return 'Workflow test allowed a repeated sensitive action.'
                  reflection = response_summary.get('reflection') or {}
                  if isinstance(reflection, dict) and reflection.get('reflection_detected'):
                      return 'Injection probe caused reflected attacker-controlled input.'
                  sink_signal = response_summary.get('sink_signal') or {}
                  if isinstance(sink_signal, dict) and any(sink_signal.get(key) for key in ('sql_error_signal', 'template_error_signal', 'command_error_signal', 'parser_error_signal')):
                      return 'Injection probe produced a backend error signal consistent with unsafe input handling.'

              if indicators:
                  return 'Observed indicators: ' + ', '.join(str(item) for item in indicators[:5])
              if reasoning_summary:
                  return str(reasoning_summary)
              return str(worker_hypothesis or '')


          def _loads_json(value, default):
              try:
                  parsed = json.loads(value or 'null')
              except Exception:
                  return default
              return parsed if parsed is not None else default


          def _parser_validation_error(tool_name, tool_arguments):
              if str(tool_name or '').strip() != 'noop_outcome':
                  return None
              warning = tool_arguments.get('_parser_warning') if isinstance(tool_arguments, dict) else None
              if not isinstance(warning, dict):
                  return None
              error = str(warning.get('error') or '').strip().lower()
              if not error:
                  return {'classification': 'parser_validation_error', 'indicator': 'parser_validation_error'}
              if error == 'invalid_template':
                  return {'classification': 'parser_validation_error', 'indicator': 'invalid_template_for_worker'}
              return {'classification': 'parser_validation_error', 'indicator': 'parser_validation_error'}


          def _wrapper_strong_indicators(signals):
              strong = {
                  'no_rate_limit_detected',
                  'rate_limit_detected',
                  'repeated_success_without_throttle',
                  'repeated_429_detected',
                  'schema_violation',
                  'server_error_signal',
                  'workflow_state_bypass',
                  'invalid_transition_accepted',
                  'cross_role_workflow_access',
                  'repeated_sensitive_action_allowed',
                  'invariant_violation',
              }
              return [item for item in (signals or []) if str(item or '').strip() in strong]


          def _wrapper_classification_hint(task, wrapper_evidence):
              existing = str(wrapper_evidence.get('classification_hint') or '').strip()
              if existing:
                  return existing
              task_text = ' '.join(str(task.get(key) or '') for key in ('class', 'subtype', 'hypothesis', 'test_strategy', 'strategy_family', 'hypothesis_family')).lower()
              if any(needle in task_text for needle in ('rate', 'throttle', 'resource_abuse', 'resource abuse', 'burst')):
                  return 'unrestricted_resource_consumption'
              if any(item in set(wrapper_evidence.get('signals') or []) for item in ('workflow_state_bypass', 'invalid_transition_accepted', 'cross_role_workflow_access', 'repeated_sensitive_action_allowed', 'invariant_violation')):
                  return 'workflow_abuse'
              return str(task.get('subtype') or task.get('class') or '').strip()


          def main(active_task_json: str, body: str, worker_hypothesis: str, reasoning_summary: str, current_execution_context_json: str = '', selected_worker: str = '', selected_template: str = '', success_criteria_json: str = '', tool_name: str = '', tool_arguments_json: str = '{}') -> dict:
              try:
                  task = json.loads(active_task_json or '{}')
              except Exception:
                  task = {}
              try:
                  result = json.loads(body or '{}')
              except Exception:
                  result = {}
              try:
                  execution_context = json.loads(current_execution_context_json or '{}')
              except Exception:
                  execution_context = {}
              try:
                  success_criteria = json.loads(success_criteria_json or '[]')
              except Exception:
                  success_criteria = []
              tool_arguments = _loads_json(tool_arguments_json, {})

              wrapper_evidence = result.get('judge_ready_evidence') if isinstance(result, dict) else None
              if isinstance(wrapper_evidence, dict) and wrapper_evidence:
                  run_id = str(execution_context.get('run_id') or wrapper_evidence.get('run_id') or '').strip()
                  root_trace_id = str(execution_context.get('root_trace_id') or run_id).strip()
                  wrapper_evidence.setdefault('task_id', task.get('id'))
                  wrapper_evidence.setdefault('worker_role', selected_worker or task.get('worker_role') or '')
                  wrapper_evidence.setdefault('tool_name', tool_name)
                  wrapper_evidence.setdefault('hypothesis', worker_hypothesis or task.get('hypothesis') or '')
                  wrapper_evidence.setdefault('run_id', run_id)
                  wrapper_evidence.setdefault('root_trace_id', root_trace_id)
                  wrapper_evidence.setdefault('signals', [])
                  signals = wrapper_evidence.get('signals') if isinstance(wrapper_evidence.get('signals'), list) else []
                  strong_indicators = wrapper_evidence.get('strong_indicators') if isinstance(wrapper_evidence.get('strong_indicators'), list) else []
                  if not strong_indicators:
                      strong_indicators = _wrapper_strong_indicators(signals)
                      wrapper_evidence['strong_indicators'] = strong_indicators
                  indicators = wrapper_evidence.get('indicators') if isinstance(wrapper_evidence.get('indicators'), list) else []
                  if not indicators:
                      wrapper_evidence['indicators'] = list(dict.fromkeys([*strong_indicators, *signals]))
                  classification_hint = _wrapper_classification_hint(task, wrapper_evidence)
                  wrapper_evidence['classification_hint'] = classification_hint
                  response_summary = wrapper_evidence.get('response_summary') if isinstance(wrapper_evidence.get('response_summary'), dict) else {}
                  response_summary.setdefault('finding_type_hint', classification_hint)
                  response_summary.setdefault('evidence_strength', 'sufficient_indicators' if strong_indicators else 'generic_wrapper_output')
                  response_summary.setdefault('tool_name', wrapper_evidence.get('tool_name') or tool_name)
                  response_summary.setdefault('signals', signals)
                  response_summary.setdefault('strong_indicators', strong_indicators)
                  if isinstance(wrapper_evidence.get('tool_summary'), dict):
                      response_summary.setdefault('tool_summary', wrapper_evidence.get('tool_summary'))
                  wrapper_evidence['response_summary'] = response_summary
                  wrapper_evidence.setdefault('notes', [])
                  if isinstance(wrapper_evidence['notes'], list):
                      wrapper_evidence['notes'].append('dify_wrapper_evidence_passthrough')
                  return {'evidence_json': json.dumps(wrapper_evidence, ensure_ascii=False)}

              request_summary = result.get('request_summary') or {}
              response_summary = result.get('response_summary') or {}
              indicators = list(result.get('indicators') or [])
              run_id = str(execution_context.get('run_id') or '').strip()
              root_trace_id = str(execution_context.get('root_trace_id') or run_id).strip()
              sequence_template = ((task.get('context_hints') or {}).get('sequence_template'))
              auth_context = task.get('auth_context') or {}
              parser_error = _parser_validation_error(tool_name, tool_arguments)
              classification_hint = response_summary.get('finding_type_hint') or response_summary.get('auth_finding_type') or task.get('subtype')
              if parser_error:
                  classification_hint = parser_error['classification']
                  _append_unique(indicators, 'parser_validation_error')
                  _append_unique(indicators, parser_error['indicator'])

              evidence = {
                  'task_id': task.get('id'),
                  'task_type': _task_type(task),
                  'assigned_worker': selected_worker or ((task.get('context_hints') or {}).get('router_assigned_worker')),
                  'chosen_template': selected_template or ((task.get('context_hints') or {}).get('router_selected_template')),
                  'operation': f"{str(task.get('method') or '').upper()} {str(task.get('endpoint') or '')}".strip(),
                  'sequence_template': sequence_template,
                  'auth_contexts_used': [item for item in [auth_context.get('owner_role'), auth_context.get('other_role')] if item],
                  'request_summary': request_summary,
                  'response_summary': response_summary,
                  'extracted_ids': _extract_ids(task, result),
                  'sequence_steps': _sequence_steps(task, result),
                  'diff_summary': _diff_summary(response_summary),
                  'oracle_flags': _oracle_flags(indicators, response_summary),
                  'short_execution_summary': _short_execution_summary(response_summary, indicators, reasoning_summary, worker_hypothesis),
                  'retry_count': int(task.get('retry_count') or 0),
                  'timestamps': {
                      'executed_at': datetime.now(timezone.utc).isoformat(),
                      'run_id': run_id,
                      'root_trace_id': root_trace_id,
                  },
                  'artifacts': result.get('artifacts') or [],
                  'raw_status': result.get('raw_status') or 'unknown',
                  'success_criteria': success_criteria if isinstance(success_criteria, list) else [],
                  'indicators': indicators,
                  'classification_hint': classification_hint,
                  'reasoning': reasoning_summary or worker_hypothesis,
              }
              return {'evidence_json': json.dumps(evidence, ensure_ascii=False)}
