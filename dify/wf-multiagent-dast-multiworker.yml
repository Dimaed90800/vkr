        code: |
          import json

          WRAPPER_TOOLS = {'restler_compile','restler_fuzz','restler_replay','schemathesis_negative_test','schemathesis_stateful_test','cats_fuzz_test','akto_inventory_discovery','akto_authz_scan','astf_top10_suite'}
          LEGACY_TOOL_ENDPOINTS = {'auth_test_access':'/v1/auth/test-access','auth_probe_entrypoints':'/v1/auth/probe-entrypoints','auto_provision':'/v1/auth/auto-provision','create_test_object':'/v1/auth/create-test-object','property_mutation_test':'/v1/auth/property-mutation-test','injection_test':'/v1/injection/test','input_shape_probe':'/v1/injection/input-shape-probe','import_har_capture':'/v1/traffic/import-har','runtime_inventory':'/v1/inventory/runtime','reflection_probe':'/v1/injection/reflection-probe','path_fuzz_probe':'/v1/injection/path-fuzz-probe','logic_test':'/v1/logic/test','workflow_probe':'/v1/logic/workflow-probe','replay_http_sequence':'/v1/replay/http-sequence','data_exposure_test':'/v1/data/exposure-test','resource_abuse_test':'/v1/resource/abuse-test','bounded_burst_helper':'/v1/resource/bounded-burst-helper','misconfiguration_test':'/v1/config/misconfiguration-test','version_diff_test':'/v1/assets/version-diff-test','noop_outcome':'/v1/worker/noop-outcome'}
          CLASS_TO_WORKER = {'authorization':'Auth & Identity Agent','injection':'Contract & Negative Testing Agent','business_logic':'Business Flow / Stateful Agent'}
          WORKER_TO_CLASS = {v:k for k,v in CLASS_TO_WORKER.items()}
          DIRECT_TOOLS = {
           'Auth & Identity Agent': {'akto_authz_scan','akto_inventory_discovery','astf_top10_suite','auth_test_access','property_mutation_test','replay_http_sequence'},
           'Contract & Negative Testing Agent': {'schemathesis_negative_test','cats_fuzz_test','astf_top10_suite','injection_test','runtime_inventory','reflection_probe','path_fuzz_probe','data_exposure_test','resource_abuse_test','version_diff_test'},
           'Business Flow / Stateful Agent': {'restler_compile','restler_fuzz','restler_replay','schemathesis_stateful_test','akto_authz_scan','akto_inventory_discovery','cats_fuzz_test','astf_top10_suite','runtime_inventory','replay_http_sequence','logic_test','resource_abuse_test','bounded_burst_helper','misconfiguration_test','version_diff_test'},
          }
          PREP_TOOLS = {'create_test_object','auto_provision','auth_probe_entrypoints','workflow_probe','input_shape_probe','import_har_capture'}
          REQUIRED_FIELDS = {'worker','template','toolchain','hypothesis','arguments','success_criteria','needs_preparation'}

          def _loads_text(text):
              value = str(text or '').strip()
              if value.startswith('```'):
                  lines = value.splitlines()
                  if lines and lines[0].startswith('```'):
                      lines = lines[1:]
                  if lines and lines[-1].strip() == '```':
                      lines = lines[:-1]
                  value = '\n'.join(lines).strip()
              try:
                  return json.loads(value or '{}')
              except Exception:
                  return {}

          def _normalized_allowed_tools(active_task):
              allowed = [str(item).strip() for item in (active_task.get('allowed_tools') or []) if str(item).strip()]
              preferred = str(active_task.get('preferred_tool') or (active_task.get('tool_preference') or {}).get('preferred_tool') or '').strip()
              fallback = active_task.get('fallback_tools') or (active_task.get('tool_preference') or {}).get('fallback_tools') or []
              result = []
              for item in allowed + ([preferred] if preferred else []) + [str(value).strip() for value in fallback if str(value).strip()]:
                  if item and item not in result:
                      result.append(item)
              return result

          def _endpoint(tool_name):
              return '/v1/tools/wrappers/execute' if tool_name in WRAPPER_TOOLS else LEGACY_TOOL_ENDPOINTS.get(tool_name, LEGACY_TOOL_ENDPOINTS['noop_outcome'])

          def _noop(worker_name, reason, active_task, execution_context, warning=None):
              arguments = {'_parser_warning': warning} if warning else {}
              envelope = {'execution_context': execution_context, 'task': active_task, 'tool_name': 'noop_outcome', 'arguments': arguments}
              return {'selected_worker': worker_name, 'selected_template': 'noop', 'tool_name': 'noop_outcome', 'tool_endpoint': LEGACY_TOOL_ENDPOINTS['noop_outcome'], 'tool_arguments_json': json.dumps(arguments, ensure_ascii=False), 'success_criteria_json': '[]', 'dispatch_notes_json': '[]', 'worker_hypothesis': str(active_task.get('hypothesis') or reason), 'reasoning_summary': reason, 'normalized_backend_request_json': json.dumps(envelope, ensure_ascii=False)}

          def _wrapper_template(tool_name):
              if tool_name == 'schemathesis_negative_test':
                  return 'schema_negative_test'
              if tool_name == 'schemathesis_stateful_test':
                  return 'stateful_fuzz'
              if tool_name == 'restler_compile':
                  return 'restler_compile'
              if tool_name == 'restler_fuzz':
                  return 'stateful_sequence_fuzz'
              if tool_name == 'restler_replay':
                  return 'sequence_replay'
              return 'tool_execution'

          def _preferred_tool(active_task):
              return str(active_task.get('preferred_tool') or (active_task.get('tool_preference') or {}).get('preferred_tool') or '').strip()

          def _candidate_rescue_tools(active_task, worker_name, needs_preparation=False):
              allowed_tools = _normalized_allowed_tools(active_task)
              preferred_tool = _preferred_tool(active_task)
              fallback = active_task.get('fallback_tools') or (active_task.get('tool_preference') or {}).get('fallback_tools') or []
              valid = PREP_TOOLS if needs_preparation else DIRECT_TOOLS.get(worker_name, set())
              ordered = []
              for item in ([preferred_tool] if preferred_tool else []) + [str(value).strip() for value in fallback if str(value).strip()] + allowed_tools:
                  if item and item in valid and item not in ordered:
                      ordered.append(item)
              return ordered

          def _rescue_dispatch(worker_name, active_task, execution_context, reason, warning=None, attempted_tool='', needs_preparation=False):
              candidates = _candidate_rescue_tools(active_task, worker_name, needs_preparation=needs_preparation)
              if not candidates:
                  return None
              tool_name = candidates[0]
              template = _wrapper_template(tool_name) if tool_name in WRAPPER_TOOLS else ('preparation' if needs_preparation else 'tool_execution')
              arguments = {'_parser_warning': warning, '_parser_rescue_reason': reason}
              if attempted_tool:
                  arguments['_attempted_tool'] = attempted_tool
              dispatch_notes = [f'parser_rescue:{attempted_tool or "invalid_worker_payload"}->{tool_name}', f'parser_rescue_reason:{reason}']
              envelope = {'execution_context': execution_context, 'task': active_task, 'tool_name': tool_name, 'arguments': arguments}
              if tool_name in WRAPPER_TOOLS:
                  envelope.update({'run_id': execution_context.get('run_id'), 'target_url': execution_context.get('target_url'), 'openapi_url': execution_context.get('openapi_url'), 'openapi_spec_text': execution_context.get('openapi_spec_text'), 'roles_json': execution_context.get('roles') or [], 'task_metadata': {'worker_role': worker_name, 'template': template, 'dispatch_notes': dispatch_notes}, 'budgets': {'max_requests': execution_context.get('max_requests', 0), 'max_duration_sec': execution_context.get('max_duration_sec', 0), 'concurrency': 1}})
              reasoning_summary = 'Parser rescue selected a normalized allowed tool after worker payload mismatch. Dispatch notes: ' + ', '.join(dispatch_notes)
              return {'selected_worker': worker_name, 'selected_template': template, 'tool_name': tool_name, 'tool_endpoint': _endpoint(tool_name), 'tool_arguments_json': json.dumps(arguments, ensure_ascii=False), 'success_criteria_json': '[]', 'dispatch_notes_json': json.dumps(dispatch_notes, ensure_ascii=False), 'worker_hypothesis': str(active_task.get('hypothesis') or reason), 'reasoning_summary': reasoning_summary, 'normalized_backend_request_json': json.dumps(envelope, ensure_ascii=False)}

          def _validate(payload, worker_name, active_task):
              missing = sorted(REQUIRED_FIELDS - set(payload.keys()))
              if missing:
                  return None, None, None, None, False, {'error':'missing_required_fields','fields':missing}
              toolchain = payload.get('toolchain')
              if isinstance(toolchain, str):
                  toolchain = [toolchain]
              if isinstance(toolchain, list):
                  toolchain = [str(item or '').strip() for item in toolchain if str(item or '').strip()]
              if not isinstance(toolchain, list) or not toolchain:
                  return None, None, None, None, bool(payload.get('needs_preparation')), {'error':'invalid_toolchain','toolchain':toolchain}
              tool_name = str(toolchain[0] or '').strip()
              allowed = set(_normalized_allowed_tools(active_task))
              needs_preparation = bool(payload.get('needs_preparation'))
              valid = PREP_TOOLS if needs_preparation else DIRECT_TOOLS.get(worker_name, set())
              if tool_name not in valid:
                  return None, None, None, None, needs_preparation, {'error':'tool_not_valid_for_worker','tool_name':tool_name,'valid_tools':sorted(valid)}
              if allowed and tool_name not in allowed:
                  return None, None, None, None, needs_preparation, {'error':'tool_not_in_allowed_tools','tool_name':tool_name,'allowed_tools':sorted(allowed)}
              arguments = payload.get('arguments') if isinstance(payload.get('arguments'), dict) else {}
              success_criteria = payload.get('success_criteria') if isinstance(payload.get('success_criteria'), list) else []
              return str(payload.get('template') or '').strip() or ('preparation' if needs_preparation else 'tool_execution'), tool_name, arguments, success_criteria, needs_preparation, None

          def main(task_class: str, auth_text: str = '', injection_text: str = '', business_text: str = '', active_task_json: str = '', current_execution_context_json: str = '') -> dict:
              class_name = str(task_class or 'authorization').lower()
              default_worker = CLASS_TO_WORKER.get(class_name, 'Auth & Identity Agent')
              payload_text = auth_text if class_name == 'authorization' else injection_text if class_name == 'injection' else business_text
              payload = _loads_text(payload_text)
              try:
                  active_task = json.loads(active_task_json or '{}')
              except Exception:
                  active_task = {}
              try:
                  execution_context = json.loads(current_execution_context_json or '{}')
              except Exception:
                  execution_context = {}
              if str(active_task.get('id') or '') == '__no_task__':
                  return _noop(default_worker, 'No active task available.', active_task, execution_context)
              worker_name = str(payload.get('worker') or '').strip()
              if worker_name != default_worker or WORKER_TO_CLASS.get(worker_name) != class_name:
                  rescued = _rescue_dispatch(default_worker, active_task, execution_context, 'invalid_worker_selection', {'error':'invalid_worker','received_worker':worker_name}, needs_preparation=str(active_task.get('readiness') or '').strip().lower() == 'needs_preparation')
                  if rescued:
                      return rescued
                  return _noop(default_worker, 'Worker payload rejected: invalid worker selection.', active_task, execution_context, {'error':'invalid_worker','received_worker':worker_name})
              template, tool_name, arguments, success_criteria, needs_preparation, error = _validate(payload, worker_name, active_task)
              if error:
                  attempted_tool = ''
                  toolchain = payload.get('toolchain') if isinstance(payload, dict) else None
                  if isinstance(toolchain, list) and toolchain:
                      attempted_tool = str(toolchain[0] or '').strip()
                  if isinstance(toolchain, str):
                      attempted_tool = toolchain.strip()
                  rescued = _rescue_dispatch(worker_name, active_task, execution_context, 'worker_payload_validation_failed', error, attempted_tool, needs_preparation=needs_preparation)
                  if rescued:
                      return rescued
                  return _noop(worker_name, 'Worker payload rejected by parse_worker_command validation.', active_task, execution_context, error)
              dispatch_notes = []
              preferred_tool = _preferred_tool(active_task)
              allowed_tools = set(_normalized_allowed_tools(active_task))
              if preferred_tool and preferred_tool in allowed_tools and tool_name != preferred_tool and not needs_preparation and preferred_tool in DIRECT_TOOLS.get(worker_name, set()):
                  dispatch_notes.append(f'preferred_tool_override:{tool_name}->{preferred_tool}')
                  tool_name = preferred_tool
                  template = _wrapper_template(preferred_tool) if preferred_tool in WRAPPER_TOOLS else template
              envelope = {'execution_context': execution_context, 'task': active_task, 'tool_name': tool_name, 'arguments': arguments}
              if tool_name in WRAPPER_TOOLS:
