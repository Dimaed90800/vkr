    - data:
        code: |
          import json

          def _artifacts(evidence):
              value = evidence.get('artifacts') or []
              return value if isinstance(value, list) else []

          def _artifact_value(artifacts, artifact_type):
              for item in artifacts:
                  if not isinstance(item, dict):
                      continue
                  if str(item.get('type') or '') == artifact_type:
                      return item.get('value')
              return None

          def _has_auth_material(role):
              if not isinstance(role, dict):
                  return False
              return bool(role.get('token') or role.get('auth_headers') or role.get('cookies'))


          def _merge_roles(existing_roles, prepared_roles):
              merged = []
              by_name = {}
              for role in existing_roles or []:
                  if isinstance(role, dict):
                      name = str(role.get('name') or role.get('role') or '').strip()
                      if name:
                          by_name[name] = dict(role)
              for role in prepared_roles or []:
                  if not isinstance(role, dict):
                      continue
                  name = str(role.get('name') or role.get('role') or '').strip()
                  if not name:
                      continue
                  current = dict(by_name.get(name) or {})
                  current.update(role)
                  by_name[name] = current
              for key in sorted(by_name.keys()):
                  merged.append(by_name[key])
              return merged


          def _merge_auth_endpoints(existing_items, discovered_items):
              merged = []
              seen = set()
              for item in [*(existing_items or []), *(discovered_items or [])]:
                  if not isinstance(item, dict):
                      continue
                  key = (str(item.get('type') or ''), str(item.get('path') or ''), str(item.get('method') or ''))
                  if key in seen or not key[1]:
                      continue
                  seen.add(key)
                  merged.append(item)
              return merged[:12]


          def _merge_traffic_requests(existing_requests, observed_requests):
              merged = []
              seen = set()
              for item in [*(existing_requests or []), *(observed_requests or [])]:
                  if not isinstance(item, dict):
                      continue
                  key = (str(item.get('method') or ''), str(item.get('url') or ''))
                  if key in seen or not key[1]:
                      continue
                  seen.add(key)
                  merged.append(item)
              return merged[:20]


          def _merge_strings(existing, new_items):
              merged = []
              seen = set()
              for item in [*(existing or []), *(new_items or [])]:
                  value = str(item or '').strip()
                  if not value or value in seen:
                      continue
                  seen.add(value)
                  merged.append(value)
              return merged


          def _surface_to_requests(surface):
              if not isinstance(surface, dict):
                  return []
              normalized_surface = surface.get('normalized_surface') or {}
              endpoints = normalized_surface.get('endpoints') or []
              requests = []
              for endpoint in endpoints:
                  if not isinstance(endpoint, dict):
                      continue
                  examples = endpoint.get('observed_examples') or []
                  for example in examples:
                      if not isinstance(example, dict):
                          continue
                      url = str(example.get('url') or '').strip()
                      if not url:
                          continue
                      requests.append({
                          'method': str(example.get('method') or endpoint.get('method') or 'GET').upper(),
                          'url': url,
                          'headers': {},
                          'query_params': {},
                          'json_body': None,
                      })
              return requests


          def _is_object_auth_task(task):
              params = task.get('params') or {}
              if not isinstance(params, dict):
                  params = {}
              return bool(params.get('path_params')) and ('{id}' in str(task.get('endpoint') or '') or params.get('object_param_name'))


          def _is_auth_bootstrap_task(task):
              subtype = str(task.get('subtype') or '').strip().lower()
              endpoint = str(task.get('endpoint') or '').strip().lower()
              if subtype == 'auth_bootstrap':
                  return True
              return any(marker in endpoint for marker in ('login', 'signin', 'sign-in', 'signup', 'register'))


          def _task_resource_family(task):
              hints = task.get('context_hints') or {}
              if isinstance(hints, dict) and hints.get('resource_family'):
                  return str(hints.get('resource_family') or '').strip().lower()
              endpoint = str(task.get('endpoint') or '').lower()
              for family, keywords in {
                  'vehicle': ('vehicle', 'vehicles', 'vin', 'location'),
                  'order': ('order', 'orders', 'checkout', 'return_order'),
                  'post': ('post', 'posts', 'community'),
                  'video': ('video', 'videos'),
                  'report': ('report', 'reports', 'mechanic_report', 'service_requests'),
                  'coupon': ('coupon', 'redeem'),
              }.items():
                  if any(keyword in endpoint for keyword in keywords):
                      return family
              return 'generic_resource'


          def _task_accepts_family(task, family):
              task_family = _task_resource_family(task)
              if not family:
                  return False
              if task_family == family:
                  return True
              aliases = {
                  'mechanic': {'report'},
                  'report': {'mechanic'},
              }
              return family in aliases.get(task_family, set()) or task_family in aliases.get(family, set())


          def _apply_object_context_to_task(task, object_id, family):
              updated = json.loads(json.dumps(task or {}))
              params = updated.get('params') or {}
              if not isinstance(params, dict):
                  params = {}
                  updated['params'] = params
              if object_id in (None, ''):
                  return updated
              candidates = params.get('object_id_candidates') or []
              if not isinstance(candidates, list):
                  candidates = []
              normalized = [item for item in candidates if item not in (None, '')]
              if object_id not in normalized:
                  normalized.insert(0, object_id)
              params['object_id_candidates'] = normalized
              params['selected_object_id'] = params.get('selected_object_id') or object_id
              if _task_accepts_family(updated, family) or str(updated.get('class') or '').lower() == 'authorization':
                  params['requires_object_id_enrichment'] = False
              capability_state = updated.get('capability_state') or {}
              if not isinstance(capability_state, dict):
                  capability_state = {}
              capability_state['has_object_candidates'] = True
              if str(updated.get('class') or '').lower() == 'business_logic' and _task_accepts_family(updated, family):
                  capability_state['has_workflow_hints'] = True
                  updated['readiness'] = 'ready_to_test'
                  updated['allowed_tools'] = ['logic_test']
                  updated['preparation_options'] = []
                  updated['test_strategy'] = 'workflow_sequence_probe'
              updated['capability_state'] = capability_state
              return updated


          def _auth_capabilities(roles, execution_context=None):
              auth_roles = [item for item in (roles or []) if _has_auth_material(item)]
              capabilities = ((execution_context or {}).get('capabilities') or {}) if isinstance(execution_context, dict) else {}
              if not isinstance(capabilities, dict):
                  capabilities = {}
              has_auth_profiles = bool(capabilities.get('has_auth_profiles')) or len(auth_roles) >= 1
              has_multi_role_auth = bool(capabilities.get('has_multi_role_auth')) or len(auth_roles) >= 2
              has_provisioned_identities = bool(capabilities.get('has_provisioned_identities')) or has_multi_role_auth
              return auth_roles, {
                  'has_auth_profiles': has_auth_profiles,
                  'has_multi_role_auth': has_multi_role_auth,
                  'has_provisioned_identities': has_provisioned_identities,
              }


          def _enrich_pending_authorization_tasks(tasks, roles, execution_context=None):
              auth_roles, auth_caps = _auth_capabilities(roles, execution_context)
              if not auth_caps['has_auth_profiles']:
                  return tasks or []

              role_names = [str(item.get('name') or item.get('role') or '').strip() for item in auth_roles if isinstance(item, dict)]
              role_names = [item for item in role_names if item]
              enriched = []
              for task in tasks or []:
                  if not isinstance(task, dict) or str(task.get('class') or '').lower() != 'authorization':
                      enriched.append(task)
                      continue
                  updated = json.loads(json.dumps(task))
                  params = updated.get('params') or {}
                  if not isinstance(params, dict):
                      params = {}
                      updated['params'] = params
                  capability_state = updated.get('capability_state') or {}
                  if not isinstance(capability_state, dict):
                      capability_state = {}
                  capability_state['has_auth_profiles'] = auth_caps['has_auth_profiles']
                  capability_state['has_multi_role_auth'] = auth_caps['has_multi_role_auth']
                  capability_state['has_provisioned_identities'] = auth_caps['has_provisioned_identities']
                  updated['capability_state'] = capability_state
                  if len(role_names) >= 2:
                      auth_context = updated.get('auth_context') or {}
                      auth_context['owner_role'] = role_names[0]
                      auth_context['other_role'] = role_names[1]
                      updated['auth_context'] = auth_context

                  if _is_auth_bootstrap_task(updated):
                      enriched.append(updated)
                      continue

                  has_object_id = bool(params.get('selected_object_id') or params.get('object_id_candidates'))
                  requires_object_id = bool(params.get('requires_object_id_enrichment')) or ('has_object_candidates' in [str(value or '').strip() for value in (updated.get('required_capabilities') or [])])

                  if auth_caps['has_multi_role_auth'] and (not requires_object_id or has_object_id):
                      updated['readiness'] = 'ready_to_test'
                      updated['allowed_tools'] = ['auth_test_access']
                      updated['preparation_options'] = []
                      updated['test_strategy'] = 'cross_role_replay'
                  elif auth_caps['has_multi_role_auth'] and requires_object_id and not has_object_id:
                      updated['readiness'] = 'needs_preparation'
                      updated['allowed_tools'] = ['create_test_object']
                      updated['preparation_options'] = ['create_test_object']
                      updated['test_strategy'] = 'prepare_object_then_replay'
                  elif auth_caps['has_auth_profiles']:
                      updated['readiness'] = 'needs_preparation'
                      updated['allowed_tools'] = ['auto_provision']
                      updated['preparation_options'] = ['auto_provision']
                      updated['test_strategy'] = 'provision_then_replay'
                  enriched.append(updated)
              return enriched




          def _finding_key(finding):
              if not isinstance(finding, dict):
                  return None
              return (
                  str(finding.get("endpoint") or "").strip(),
                  str(finding.get("method") or "").strip().upper(),
                  str(finding.get("vuln_type") or finding.get("title") or "").strip().upper(),
              )


          def _append_unique_finding(findings, finding):
              key = _finding_key(finding)
              if key is None:
                  return findings
              for item in findings or []:
                  if _finding_key(item) == key:
                      return findings
              findings.append(finding)
              return findings

          def _has_executable_pending_tasks(tasks):
              for item in tasks or []:
                  if not isinstance(item, dict):
                      continue
                  readiness = str(item.get('readiness') or '').strip()
                  allowed_tools = [str(tool or '').strip() for tool in (item.get('allowed_tools') or []) if str(tool or '').strip()]
                  if readiness in {'ready_to_test', 'needs_preparation'} and allowed_tools:
                      return True
              return False


          def _enrich_pending_tasks_with_object(tasks, prepared_object, harvested_ids, workflow_context=None):
              object_id = None
              family = ''
              if isinstance(prepared_object, dict):
                  object_id = prepared_object.get('object_id')
                  family = str(prepared_object.get('resource_family') or prepared_object.get('object_type') or '').strip().lower()
              if object_id in (None, ''):
                  values = [item for item in (harvested_ids or []) if item not in (None, '')]
                  object_id = values[0] if values else None
              if not family and isinstance(workflow_context, dict):
                  family = str(workflow_context.get('resource_family') or '').strip().lower()
              if object_id in (None, ''):
                  return tasks or []
              enriched = []
              for task in tasks or []:
                  if not isinstance(task, dict):
                      enriched.append(task)
                      continue
                  if _task_accepts_family(task, family) or str(task.get('class') or '').lower() == 'authorization':
                      enriched.append(_apply_object_context_to_task(task, object_id, family))
                  else:
                      enriched.append(task)
              return enriched


          def _apply_preparation(task, roles, prepared_object, captured_surface, discovered_auth_endpoints):
              updated = json.loads(json.dumps(task or {}))
              params = updated.get('params') or {}
              if not isinstance(params, dict):
                  params = {}
                  updated['params'] = params
              capability_state = updated.get('capability_state') or {}
              if not isinstance(capability_state, dict):
                  capability_state = {}
              role_names = [str(item.get('name') or item.get('role') or '').strip() for item in roles if isinstance(item, dict)]
              role_names = [item for item in role_names if item]
              auth_roles = [item for item in roles if _has_auth_material(item)]

              if len(role_names) >= 2:
                  auth_context = updated.get('auth_context') or {}
                  auth_context['owner_role'] = role_names[0]
                  auth_context['other_role'] = role_names[1]
                  updated['auth_context'] = auth_context
              capability_state['has_auth_profiles'] = len(auth_roles) >= 1
              capability_state['has_multi_role_auth'] = len(auth_roles) >= 2
              capability_state['has_login_endpoint'] = any(isinstance(item, dict) and str(item.get('type') or '').lower() == 'login' for item in (discovered_auth_endpoints or [])) or capability_state.get('has_login_endpoint', False)
              capability_state['has_register_endpoint'] = any(isinstance(item, dict) and str(item.get('type') or '').lower() == 'register' for item in (discovered_auth_endpoints or [])) or capability_state.get('has_register_endpoint', False)

              object_id = None
              if isinstance(prepared_object, dict):
                  object_id = prepared_object.get('object_id')
              if object_id not in (None, ''):
                  existing = params.get('object_id_candidates') or []
                  if not isinstance(existing, list):
                      existing = []
                  normalized = [item for item in existing if item not in (None, '')]
                  if object_id not in normalized:
                      normalized.insert(0, object_id)
                  params['object_id_candidates'] = normalized
                  params['selected_object_id'] = object_id
                  params['requires_object_id_enrichment'] = False
                  capability_state['has_object_candidates'] = True
              else:
                  capability_state['has_object_candidates'] = bool(params.get('selected_object_id') or params.get('object_id_candidates'))

              if isinstance(captured_surface, dict):
                  normalized_surface = captured_surface.get('normalized_surface') or {}
                  endpoints = normalized_surface.get('endpoints') or []
                  capability_state['has_traffic_surface'] = bool(endpoints)
                  capability_state['has_input_shape'] = bool(params.get('query_params') or params.get('body_fields')) or any(
                      isinstance(item, dict) and (item.get('query_params') or item.get('body_fields') or item.get('path_params'))
                      for item in endpoints
                  )
                  capability_state['has_workflow_hints'] = capability_state.get('has_workflow_hints') or len(endpoints) >= 2
                  if updated.get('class') == 'injection' and endpoints:
                      for endpoint in endpoints:
                          if isinstance(endpoint, dict) and str(endpoint.get('path') or '') == str(updated.get('endpoint') or ''):
                              params['query_params'] = list(endpoint.get('query_params') or params.get('query_params') or [])
                              params['body_fields'] = list(endpoint.get('body_fields') or params.get('body_fields') or [])
                              break

              updated['capability_state'] = capability_state
              if updated.get('class') == 'authorization':
                  if capability_state.get('has_multi_role_auth') and (not _is_object_auth_task(updated) or capability_state.get('has_object_candidates')):
                      updated['readiness'] = 'ready_to_test'
                      updated['allowed_tools'] = ['auth_test_access']
                      updated['preparation_options'] = []
                      updated['test_strategy'] = 'cross_role_replay'
                  elif capability_state.get('has_login_endpoint') and capability_state.get('has_register_endpoint') and not capability_state.get('has_auth_profiles'):
                      updated['readiness'] = 'needs_preparation'
                      updated['allowed_tools'] = ['auto_provision']
                      updated['preparation_options'] = ['auto_provision']
                      updated['test_strategy'] = 'provision_then_replay'
                  elif capability_state.get('has_multi_role_auth') and _is_object_auth_task(updated):
                      updated['readiness'] = 'needs_preparation'
                      updated['allowed_tools'] = ['create_test_object']
                      updated['preparation_options'] = ['create_test_object']
                      updated['test_strategy'] = 'prepare_object_then_replay'
                  else:
                      updated['readiness'] = 'needs_preparation'
                      updated['allowed_tools'] = ['auth_probe_entrypoints']
                      updated['preparation_options'] = ['auth_probe_entrypoints']
                      updated['test_strategy'] = 'discover_auth_bootstrap_then_provision'
              elif updated.get('class') == 'injection':
                  if capability_state.get('has_input_shape'):
                      updated['readiness'] = 'ready_to_test'
                      updated['allowed_tools'] = ['injection_test', 'reflection_probe', 'path_fuzz_probe']
                      updated['preparation_options'] = []
                      updated['test_strategy'] = 'direct_input_probe'
                  else:
                      updated['readiness'] = 'needs_preparation'
                      updated['allowed_tools'] = ['input_shape_probe']
                      updated['preparation_options'] = ['input_shape_probe', 'capture_authenticated_traffic']
                      updated['test_strategy'] = 'shape_probe_then_test'
              elif updated.get('class') == 'business_logic':
                  if capability_state.get('has_workflow_hints') or capability_state.get('has_object_candidates'):
                      updated['readiness'] = 'ready_to_test'
                      updated['allowed_tools'] = ['logic_test']
                      updated['preparation_options'] = []
                      updated['test_strategy'] = 'workflow_sequence_probe'
                  else:
                      updated['readiness'] = 'needs_preparation'
                      updated['allowed_tools'] = ['workflow_probe']
                      updated['preparation_options'] = ['workflow_probe', 'capture_authenticated_traffic']
                      updated['test_strategy'] = 'workflow_probe_then_test'
              return updated


          def _upsert_task(tasks, task):
              task_id = str(task.get('id') or '')
              result = []
              replaced = False
              for item in tasks or []:
                  if isinstance(item, dict) and str(item.get('id') or '') == task_id:
                      result.append(task)
                      replaced = True
                  else:
                      result.append(item)
              if not replaced:
                  result.insert(0, task)
              return result


          def main(remaining_state_json: str, active_task_json: str, verdict_json: str, evidence_json: str, queue_body: str = "") -> dict:
              try:
                  state = json.loads(remaining_state_json or '{}')
              except Exception:
                  state = {}
              try:
                  task = json.loads(active_task_json or '{}')
              except Exception:
                  task = {}
              try:
                  verdict = json.loads(verdict_json or '{}')
              except Exception:
                  verdict = {}
              try:
                  evidence = json.loads(evidence_json or '{}')
              except Exception:
                  evidence = {}
              try:
                  queue_update = json.loads(queue_body or '{}')
              except Exception:
                  queue_update = {}

              task_id = str(task.get("id") or "")
              if task_id == "__no_task__":
                  state["stop_reason"] = state.get("stop_reason") or "no_tasks"
                  return {
                      "state_json": json.dumps(state, ensure_ascii=False),
                      "should_exit_loop": True,
                  }

              state.setdefault("pending_tasks", [])
              state.setdefault("confirmed_findings", [])
              state.setdefault("rejected_findings", [])
              state.setdefault("evidence_records", [])
              state.setdefault("completed_tasks", [])
              state.setdefault("execution_context", {})
              state["pending_tasks"] = queue_update.get("pending_tasks") or state.get("pending_tasks") or []
              state["scheduler_state"] = queue_update.get("scheduler_state") or state.get("scheduler_state") or {}
              state["last_queue_update_reason"] = str(queue_update.get("queue_update_reason") or "")
              backend_execution_context = queue_update.get("updated_execution_context")
              backend_enrichment_present = isinstance(backend_execution_context, dict) and bool(backend_execution_context)
              if backend_enrichment_present:
                  previous_context = state.get("execution_context") or {}
                  if not str(backend_execution_context.get("openapi_url") or "").strip() and str(previous_context.get("openapi_url") or "").strip():
                      backend_execution_context["openapi_url"] = previous_context.get("openapi_url")
                  if not str(backend_execution_context.get("openapi_spec_text") or "").strip() and str(previous_context.get("openapi_spec_text") or "").strip():
                      backend_execution_context["openapi_spec_text"] = previous_context.get("openapi_spec_text")
                  state["execution_context"] = backend_execution_context

              state["budget_used"] = int(state.get("budget_used", 0) or 0) + 1
              state["evidence_records"].append(evidence)

              artifacts = _artifacts(evidence)
              prepared_roles = _artifact_value(artifacts, 'provisioned_identities') or []
              prepared_object = _artifact_value(artifacts, 'prepared_object') or None
              harvested_object_ids = _artifact_value(artifacts, 'harvested_object_ids') or []
              harvested_links = _artifact_value(artifacts, 'harvested_links') or []
              workflow_context = _artifact_value(artifacts, 'workflow_context') or None
              captured_surface = _artifact_value(artifacts, 'captured_traffic_surface') or None
              discovered_auth_endpoints = _artifact_value(artifacts, 'discovered_auth_endpoints') or []
              continuation = False

              if prepared_roles:
                  ctx = state.get('execution_context') or {}
                  merged_roles = _merge_roles(ctx.get('roles') or [], prepared_roles)
                  ctx['roles'] = merged_roles
                  capabilities = ctx.get('capabilities') or {}
                  if not isinstance(capabilities, dict):
                      capabilities = {}
                  capabilities['has_auth_profiles'] = any(_has_auth_material(item) for item in merged_roles)
                  capabilities['has_multi_role_auth'] = sum(1 for item in merged_roles if _has_auth_material(item)) >= 2
                  capabilities['has_provisioned_identities'] = capabilities['has_multi_role_auth']
                  ctx['capabilities'] = capabilities
                  state['execution_context'] = ctx
                  continuation = True

              if discovered_auth_endpoints:
                  ctx = state.get('execution_context') or {}
                  merged_auth_endpoints = _merge_auth_endpoints(ctx.get('discovered_auth_endpoints') or [], discovered_auth_endpoints)
                  ctx['discovered_auth_endpoints'] = merged_auth_endpoints
                  capabilities = ctx.get('capabilities') or {}
                  if not isinstance(capabilities, dict):
                      capabilities = {}
                  capabilities['has_login_endpoint'] = any(str(item.get('type') or '').lower() == 'login' for item in merged_auth_endpoints if isinstance(item, dict))
                  capabilities['has_register_endpoint'] = any(str(item.get('type') or '').lower() == 'register' for item in merged_auth_endpoints if isinstance(item, dict))
                  capabilities['has_auth_entrypoint_candidates'] = capabilities.get('has_auth_entrypoint_candidates', False) or bool(merged_auth_endpoints)
                  ctx['capabilities'] = capabilities
                  state['execution_context'] = ctx
                  continuation = True

              if isinstance(prepared_object, dict) and prepared_object.get('object_id') not in (None, ''):
                  ctx = state.get('execution_context') or {}
                  capabilities = ctx.get('capabilities') or {}
                  if not isinstance(capabilities, dict):
                      capabilities = {}
                  capabilities['has_object_candidates'] = True
                  capabilities['has_prepared_object'] = True
                  ctx['capabilities'] = capabilities
                  ctx['harvested_object_ids'] = _merge_strings(ctx.get('harvested_object_ids') or [], harvested_object_ids or [prepared_object.get('object_id')])
                  prepared_objects = ctx.get('prepared_objects') or {}
                  if not isinstance(prepared_objects, dict):
                      prepared_objects = {}
                  family = str(prepared_object.get('resource_family') or prepared_object.get('object_type') or 'resource').strip().lower()
                  prepared_objects[family] = prepared_object
                  ctx['prepared_objects'] = prepared_objects
                  if harvested_links:
                      ctx['harvested_links'] = _merge_strings(ctx.get('harvested_links') or [], harvested_links)
                  state['execution_context'] = ctx
                  continuation = True

              if isinstance(workflow_context, dict) and workflow_context.get('object_id') not in (None, ''):
                  ctx = state.get('execution_context') or {}
                  ctx['workflow_context'] = workflow_context
                  ctx['harvested_object_ids'] = _merge_strings(ctx.get('harvested_object_ids') or [], [workflow_context.get('object_id')])
                  capabilities = ctx.get('capabilities') or {}
                  if not isinstance(capabilities, dict):
                      capabilities = {}
                  capabilities['has_workflow_hints'] = True
                  capabilities['has_object_candidates'] = True
                  ctx['capabilities'] = capabilities
                  state['execution_context'] = ctx
                  continuation = True

              if isinstance(captured_surface, dict):
                  ctx = state.get('execution_context') or {}
                  existing_requests = ctx.get('traffic_requests') or []
                  ctx['traffic_requests'] = _merge_traffic_requests(existing_requests, _surface_to_requests(captured_surface))
                  capabilities = ctx.get('capabilities') or {}
                  if not isinstance(capabilities, dict):
                      capabilities = {}
                  endpoints = ((captured_surface.get('normalized_surface') or {}).get('endpoints') or []) if isinstance(captured_surface, dict) else []
                  capabilities['has_traffic_surface'] = bool(endpoints)
                  capabilities['has_browser_capture'] = capabilities.get('has_browser_capture') or False
                  capabilities['has_input_shape'] = capabilities.get('has_input_shape') or any(
                      isinstance(item, dict) and (item.get('query_params') or item.get('body_fields') or item.get('path_params'))
                      for item in endpoints
                  )
                  capabilities['has_workflow_hints'] = capabilities.get('has_workflow_hints') or len(endpoints) >= 2
                  ctx['capabilities'] = capabilities
                  state['execution_context'] = ctx
                  continuation = True

              roles = (state.get('execution_context') or {}).get('roles') or []
              if roles or backend_enrichment_present:
                  state['pending_tasks'] = _enrich_pending_authorization_tasks(state.get('pending_tasks') or [], roles, state.get('execution_context') or {})
              state['pending_tasks'] = _enrich_pending_tasks_with_object(state.get('pending_tasks') or [], prepared_object, harvested_object_ids, workflow_context)

              if continuation:
                  if not backend_enrichment_present:
                      updated_task = _apply_preparation(task, roles, prepared_object, captured_surface, (state.get('execution_context') or {}).get('discovered_auth_endpoints') or discovered_auth_endpoints)
                      if not (prepared_roles and _is_auth_bootstrap_task(updated_task)):
                          state['pending_tasks'] = _upsert_task(state.get('pending_tasks') or [], updated_task)
                      state['pending_tasks'] = _enrich_pending_authorization_tasks(state.get('pending_tasks') or [], roles, state.get('execution_context') or {})
                      state['pending_tasks'] = _enrich_pending_tasks_with_object(state.get('pending_tasks') or [], prepared_object, harvested_object_ids, workflow_context)
                  if not backend_enrichment_present:
                      state['last_queue_update_reason'] = 'preparation_continued'
              else:
                  state["completed_tasks"].append(task_id)
                  verdict_name = str(verdict.get("verdict") or "rejected")
                  if verdict_name == "confirmed" and verdict.get("finding_candidate"):
                      state["confirmed_findings"] = _append_unique_finding(state.get("confirmed_findings") or [], verdict["finding_candidate"])
                  elif verdict_name == "rework" and queue_update.get("requeued_task_id"):
                      pass
                  elif verdict_name == "rework" and not queue_update.get("requeued_task_id"):
                      state["rejected_findings"].append({
                          "task_id": task_id,
                          "reason": str(queue_update.get("queue_update_reason") or "retry_limit_exceeded"),
                      })
                  else:
                      state["rejected_findings"].append({
                          "task_id": task_id,
                          "reason": str(verdict.get("reason") or ""),
                      })

              executable_pending_tasks = _has_executable_pending_tasks(state.get('pending_tasks') or [])
              if executable_pending_tasks:
                  state["stop_reason"] = ""
              if queue_update.get("should_stop") and not state.get("pending_tasks"):
                  state["stop_reason"] = state.get("stop_reason") or "no_tasks"
              should_exit = len(state.get("pending_tasks") or []) == 0 or (bool(state.get("stop_reason")) and not executable_pending_tasks)
              return {
                  "state_json": json.dumps(state, ensure_ascii=False),
                  "should_exit_loop": should_exit,
              }
