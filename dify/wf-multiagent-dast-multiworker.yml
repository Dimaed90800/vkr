    - data:
        code: "import json\n\n\ndef _should_skip_task(task):\n    if not isinstance(task, dict):\n        return True\n    task_class = str(task.get(\"class\") or \"\").lower()\n    endpoint = str(task.get(\"endpoint\") or \"\").strip().lower()\n    subtype = str(task.get(\"subtype\") or \"\").lower()\n    strategy_family = str(task.get(\"strategy_family\") or \"\").lower()\n    test_strategy = str(task.get(\"test_strategy\") or \"\").lower()\n\n    if task_class == \"business_logic\" and subtype == \"improper_assets_management\" and endpoint in {\"/v1\", \"/v2\", \"/v3\"}:\n        return True\n    if task_class == \"business_logic\" and endpoint in {\"/v1\", \"/v2\", \"/v3\"} and (\n        \"version_diff\" in strategy_family or\n        \"version_diff\" in test_strategy or\n        \"workflow_state\" in strategy_family or\n        \"prepare_workflow_state\" in test_strategy\n    ):\n        return True\n    return False\n\n\ndef _sort_key(task):\n    task_class = str(task.get(\"class\") or \"authorization\").lower()\n    class_rank = {\"authorization\": 0, \"injection\": 1, \"business_logic\": 2}.get(task_class, 9)\n    priority = -int(task.get(\"priority\") or 0)\n    return (class_rank, priority)\n\n\ndef _normalize_tasks(tasks):\n    normalized = []\n    allowed_classes = {\"authorization\", \"injection\", \"business_logic\"}\n    for task in tasks or []:\n        if not isinstance(task, dict):\n            continue\n        task = json.loads(json.dumps(task))\n        if str(task.get(\"class\") or \"\").lower() not in allowed_classes:\n            task[\"class\"] = \"authorization\"\n        if _should_skip_task(task):\n            continue\n        normalized.append(task)\n    normalized.sort(key=_sort_key)\n    return normalized\n\n\ndef main(text: str, planner_body: str = \"\") -> dict:\n    try:\n        payload = json.loads(text or '{}')\n    except Exception:\n        payload = {}\n\n    try:\n        planner = json.loads(planner_body or '{}')\n    except Exception:\n        planner = {}\n\n    router_tasks = payload.get('tasks') or []\n    if not isinstance(router_tasks, list):\n        router_tasks = []\n\n    fallback_tasks = planner.get(\"final_task_queue\") or planner.get(\"router_candidate_queue\") or planner.get(\"generated_tasks\") or []\n    if not isinstance(fallback_tasks, list):\n        fallback_tasks = []\n\n    normalized = _normalize_tasks(router_tasks) or _normalize_tasks(fallback_tasks)\n\n    return {\n        \"router_summary\": str(payload.get(\"router_summary\") or planner.get(\"planner_summary\") or \"\"),\n        \"pending_tasks_json\": json.dumps(normalized, ensure_ascii=False),\n        \"tasks_total\": len(normalized),\n    }\n"
