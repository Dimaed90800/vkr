    - data:
        code: |
          import json

          SOURCE_CONFIDENCE = {
              'openapi': 0.9,
              'passive_discovery': 0.55,
              'discovery': 0.75,
              'traffic': 0.95,
              'js_analysis': 0.65,
          }

          def _endpoint_key(endpoint):
              return (str(endpoint.get('method') or 'GET').upper(), str(endpoint.get('path') or ''))

          def _merge_strings(left, right):
              values = []
              seen = set()
              for item in [*(left or []), *(right or [])]:
                  value = str(item or '').strip()
                  if not value or value in seen:
                      continue
                  seen.add(value)
                  values.append(value)
              return values

          def _merge_examples(left, right):
              values = []
              seen = set()
              for item in [*(left or []), *(right or [])]:
                  if not isinstance(item, dict):
                      continue
                  key = (str(item.get('source') or ''), str(item.get('method') or ''), str(item.get('url') or ''))
                  if key in seen:
                      continue
                  seen.add(key)
                  values.append(item)
              return values[:5]

          def _score_sources(sources):
              normalized = {str(item or '').strip().lower() for item in (sources or []) if str(item or '').strip()}
              if not normalized:
                  return 0.0
              base = max(SOURCE_CONFIDENCE.get(item, 0.5) for item in normalized)
              bonus = min(0.04 * max(len(normalized) - 1, 0), 0.12)
              return min(base + bonus, 0.99)

          def _merge_endpoint(primary, secondary):
              merged = dict(primary)
              merged['path_params'] = merged.get('path_params') or secondary.get('path_params') or []
              merged['query_params'] = sorted(set((merged.get('query_params') or []) + (secondary.get('query_params') or [])))
              merged['body_fields'] = sorted(set((merged.get('body_fields') or []) + (secondary.get('body_fields') or [])))
              merged['object_param_name'] = merged.get('object_param_name') or secondary.get('object_param_name') or ''
              merged['object_id_candidates'] = _merge_strings(merged.get('object_id_candidates') or [], secondary.get('object_id_candidates') or [])
              left_signals = merged.get('resource_signals') or {}
              right_signals = secondary.get('resource_signals') or {}
              merged['resource_signals'] = {
                  'has_object_id': bool(left_signals.get('has_object_id')) or bool(right_signals.get('has_object_id')),
                  'has_role_fields': bool(left_signals.get('has_role_fields')) or bool(right_signals.get('has_role_fields')),
                  'has_sensitive_keywords': bool(left_signals.get('has_sensitive_keywords')) or bool(right_signals.get('has_sensitive_keywords')),
              }
              left_auth = merged.get('auth_signals') or {}
              right_auth = secondary.get('auth_signals') or {}
              merged['auth_signals'] = {
                  'has_auth_header': bool(left_auth.get('has_auth_header')) or bool(right_auth.get('has_auth_header')),
                  'has_cookie_auth': bool(left_auth.get('has_cookie_auth')) or bool(right_auth.get('has_cookie_auth')),
                  'header_names': _merge_strings(left_auth.get('header_names') or [], right_auth.get('header_names') or []),
                  'cookie_names': _merge_strings(left_auth.get('cookie_names') or [], right_auth.get('cookie_names') or []),
              }
              merged['observed_examples'] = _merge_examples(merged.get('observed_examples') or [], secondary.get('observed_examples') or [])
              merged['sources'] = _merge_strings(merged.get('sources') or [], secondary.get('sources') or [])
              merged['source_confidence'] = max(float(merged.get('source_confidence') or 0), float(secondary.get('source_confidence') or 0), _score_sources(merged.get('sources') or []))
              merged['auth_required'] = bool(merged.get('auth_required')) or bool(secondary.get('auth_required'))
              merged['security_schemes'] = _merge_strings(merged.get('security_schemes') or [], secondary.get('security_schemes') or [])
              left_classes = merged.get('candidate_classes') or []
              right_classes = secondary.get('candidate_classes') or []
              merged['candidate_classes'] = list(dict.fromkeys(left_classes + right_classes))
              left_scores = merged.get('candidate_scores') or {}
              right_scores = secondary.get('candidate_scores') or {}
              merged['candidate_scores'] = {
                  'authorization': max(float(left_scores.get('authorization') or 0), float(right_scores.get('authorization') or 0)),
                  'injection': max(float(left_scores.get('injection') or 0), float(right_scores.get('injection') or 0)),
                  'business_logic': max(float(left_scores.get('business_logic') or 0), float(right_scores.get('business_logic') or 0)),
              }
              return merged

          def _annotate(endpoint, source_name):
              enriched = dict(endpoint)
              enriched['sources'] = _merge_strings(enriched.get('sources') or [], [source_name])
              enriched['source_confidence'] = max(float(enriched.get('source_confidence') or 0), _score_sources(enriched.get('sources') or []))
              for item in enriched.get('observed_examples') or []:
                  if isinstance(item, dict) and not item.get('source'):
                      item['source'] = source_name
              return enriched

          def main(openapi_surface_json: str, passive_surface_json: str, discovery_surface_json: str, traffic_surface_json: str, js_surface_json: str) -> dict:
              surfaces = {}
              for key, value in [('openapi', openapi_surface_json), ('passive_discovery', passive_surface_json), ('discovery', discovery_surface_json), ('traffic', traffic_surface_json), ('js_analysis', js_surface_json)]:
                  try:
                      surfaces[key] = json.loads(value or '{}')
                  except Exception:
                      surfaces[key] = {}

              merged = {}
              for source_name in ['openapi', 'passive_discovery', 'discovery', 'traffic', 'js_analysis']:
                  for endpoint in (surfaces.get(source_name) or {}).get('endpoints') or []:
                      if not isinstance(endpoint, dict):
                          continue
                      endpoint = _annotate(endpoint, source_name)
                      key = _endpoint_key(endpoint)
                      if key in merged:
                          merged[key] = _merge_endpoint(merged[key], endpoint)
                      else:
                          merged[key] = endpoint

              merged_surface = {'endpoints': sorted(merged.values(), key=lambda item: (str(item.get('path') or ''), str(item.get('method') or 'GET')))}
              return {
                  'merged_surface_json': json.dumps(merged_surface, ensure_ascii=False),
                  'merged_surface_total': len(merged_surface['endpoints']),
              }
