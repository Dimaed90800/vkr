    - data:
        code: "import json\nfrom datetime import datetime, timezone\n\ndef _safe_int(value: str, default: int) -> int:\n    try:\n        return int(str(value or '').strip())\n    except Exception:\n        return default\n\ndef _safe_bool(value: str, default: bool) -> bool:\n    normalized = str(value or '').strip().lower()\n    if not normalized:\n        return default\n    if normalized in {'1', 'true', 'yes', 'y', 'on'}:\n        return True\n    if normalized in {'0', 'false', 'no', 'n', 'off'}:\n        return False\n    return default\n\ndef main(\n    toolbox_url: str,\n    target_url: str,\n    openapi_url: str = \"\",\n    openapi_spec_text: str = \"\",\n    roles_json: str = \"[]\",\n    allowed_hosts_json: str = \"[]\",\n    traffic_requests_json: str = \"[]\",\n    enable_discovery: str = \"\",\n    discovery_mode: str = \"\",\n    zap_base_url: str = \"\",\n    discovery_seeds_json: str = \"[]\",\n    use_authenticated_discovery: str = \"\",\n    discovery_max_depth: str = \"\",\n    discovery_max_children: str = \"\",\n    discovery_max_duration_sec: str = \"\",\n    use_ajax_spider: str = \"\",\n    max_requests: str = \"\",\n    max_duration_sec: str = \"\",\n    max_retries_per_task: str = \"\",\n    user_prompt: str = \"\",\n) -> dict:\n    try:\n        roles = json.loads(roles_json or '[]')\n    except Exception:\n        roles = []\n    try:\n        allowed_hosts = json.loads(allowed_hosts_json or '[]')\n    except Exception:\n        allowed_hosts = []\n    try:\n        discovery_seeds = json.loads(discovery_seeds_json or '[]')\n    except Exception:\n        discovery_seeds = []\n    if not isinstance(discovery_seeds, list):\n        discovery_seeds = []\n    try:\n        traffic_requests = json.loads(traffic_requests_json or '[]')\n    except Exception:\n        traffic_requests = []\n    if not isinstance(traffic_requests, list):\n        traffic_requests = []\n\n    discovery_enabled = _safe_bool(enable_discovery, True)\n    discovery_mode_value = str(discovery_mode or 'zap').strip() or 'zap'\n    zap_base_url_value = str(zap_base_url or 'http://zap:8080').strip() or 'http://zap:8080'\n    use_authenticated_discovery_value = _safe_bool(use_authenticated_discovery, False)\n    discovery_max_depth_value = _safe_int(discovery_max_depth, 2)\n    discovery_max_children_value = _safe_int(discovery_max_children, 50)\n    discovery_max_duration_sec_value = _safe_int(discovery_max_duration_sec, 120)\n    use_ajax_spider_value = _safe_bool(use_ajax_spider, False)\n\n    execution_context = {\n        \"toolbox_url\": str(toolbox_url or \"\").rstrip(\"/\"),\n        \"target_url\": str(target_url or \"\").rstrip(\"/\"),\n        \"openapi_url\": str(openapi_url or \"\").strip(),\n        \"openapi_spec_text\": str(openapi_spec_text or \"\"),\n        \"roles\": roles,\n        \"allowed_hosts\": allowed_hosts,\n        \"traffic_requests\": traffic_requests,\n        \"enable_discovery\": discovery_enabled,\n        \"discovery_mode\": discovery_mode_value,\n        \"zap_base_url\": zap_base_url_value,\n        \"discovery_seeds\": discovery_seeds,\n        \"use_authenticated_discovery\": use_authenticated_discovery_value,\n        \"discovery_max_depth\": discovery_max_depth_value,\n        \"discovery_max_children\": discovery_max_children_value,\n        \"discovery_max_duration_sec\": discovery_max_duration_sec_value,\n        \"use_ajax_spider\": use_ajax_spider_value,\n        \"max_requests\": _safe_int(max_requests, 100),\n        \"max_duration_sec\": _safe_int(max_duration_sec, 900),\n        \"max_retries_per_task\": _safe_int(max_retries_per_task, 1),\n        \"start_timestamp\": datetime.now(timezone.utc).isoformat(),\n        \"user_prompt\": str(user_prompt or \"\").strip(),\n    }\n\n    return {\n        \"toolbox_url\": execution_context[\"toolbox_url\"],\n        \"target_url\": execution_context[\"target_url\"],\n        \"openapi_url\": execution_context[\"openapi_url\"],\n        \"openapi_spec_text\": execution_context[\"openapi_spec_text\"],\n        \"roles_json\": json.dumps(roles, ensure_ascii=False),\n        \"allowed_hosts_json\": json.dumps(allowed_hosts, ensure_ascii=False),\n        \"traffic_requests_json\": json.dumps(traffic_requests, ensure_ascii=False),\n        \"enable_discovery\": discovery_enabled,\n        \"discovery_mode\": discovery_mode_value,\n        \"zap_base_url\": zap_base_url_value,\n        \"discovery_seeds_json\": json.dumps(discovery_seeds, ensure_ascii=False),\n        \"use_authenticated_discovery\": use_authenticated_discovery_value,\n        \"discovery_max_depth\": discovery_max_depth_value,\n        \"discovery_max_children\": discovery_max_children_value,\n        \"discovery_max_duration_sec\": discovery_max_duration_sec_value,\n        \"use_ajax_spider\": use_ajax_spider_value,\n        \"execution_context_json\": json.dumps(execution_context, ensure_ascii=False),\n    }\n"
