    - data:
        code: |
          import json

          MAX_ENDPOINTS = 20
          MAX_GENERATED_TASKS = 20


          def _clip(value, limit: int = 200) -> str:
              text = str(value or '').strip()
              if len(text) <= limit:
                  return text
              return text[: limit - 3] + '...'


          def _compact_endpoint(endpoint: dict) -> dict:
              return {
                  'path': _clip(endpoint.get('path'), 180),
                  'method': _clip(endpoint.get('method'), 16),
                  'auth_required': bool(endpoint.get('auth_required')),
                  'path_params': list(endpoint.get('path_params') or [])[:6],
                  'query_params': list(endpoint.get('query_params') or [])[:8],
                  'body_fields': list(endpoint.get('body_fields') or [])[:10],
                  'tags': list(endpoint.get('tags') or [])[:5],
                  'source_confidence': float(endpoint.get('source_confidence') or 0.0),
              }


          def _compact_task(task: dict) -> dict:
              return {
                  'id': _clip(task.get('id'), 96),
                  'class': _clip(task.get('class'), 48),
                  'subtype': _clip(task.get('subtype'), 48),
                  'endpoint': _clip(task.get('endpoint'), 180),
                  'method': _clip(task.get('method'), 16),
                  'priority': int(task.get('priority') or 0),
                  'readiness': _clip(task.get('readiness'), 32),
                  'hypothesis_family': _clip(task.get('hypothesis_family'), 64),
              }


          def main(body: str) -> dict:
              try:
                  payload = json.loads(body or '{}')
              except Exception:
                  payload = {}

              normalized_surface = payload.get('normalized_surface') or {'endpoints': []}
              generated_tasks = payload.get('generated_tasks') or []
              endpoints = normalized_surface.get('endpoints') or []
              if not isinstance(endpoints, list):
                  endpoints = []
              if not isinstance(generated_tasks, list):
                  generated_tasks = []

              recon_summary = {
                  'target_url': _clip(payload.get('target_url'), 300),
                  'planner_mode': _clip((payload.get('raw_metadata') or {}).get('planner_mode'), 32),
                  'surface_counts': {
                      'total_endpoints': len(endpoints),
                      'auth_required_endpoints': sum(1 for item in endpoints if isinstance(item, dict) and item.get('auth_required')),
                  },
                  'top_endpoints': [_compact_endpoint(item) for item in endpoints[:MAX_ENDPOINTS] if isinstance(item, dict)],
                  'generated_tasks_total': len(generated_tasks),
                  'top_generated_tasks': [_compact_task(item) for item in generated_tasks[:MAX_GENERATED_TASKS] if isinstance(item, dict)],
              }

              return {
                  'recon_body_json': json.dumps(recon_summary, ensure_ascii=False),
                  'normalized_surface_json': json.dumps(normalized_surface, ensure_ascii=False),
                  'generated_tasks_json': json.dumps(generated_tasks, ensure_ascii=False),
              }
        code_language: python3
        dependencies: []
        desc: Extract normalized OpenAPI surface and planner seed hints from recon response.
        outputs:
          generated_tasks_json:
            children: 
            type: string
          normalized_surface_json:
            children: 
            type: string
          recon_body_json:
            children: 
            type: string
        selected: false
        title: Extract Spec Surface & Seed Tasks
        type: code
        variables:
        - value_selector:
          - parse_openapi
          - body
          value_type: string
          variable: body
