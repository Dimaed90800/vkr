    - data:
        code: |
          import json


          def _should_skip_task(task):
              if not isinstance(task, dict):
                  return True
              task_class = str(task.get("class") or "").lower()
              endpoint = str(task.get("endpoint") or "").strip().lower()
              subtype = str(task.get("subtype") or "").lower()
              strategy_family = str(task.get("strategy_family") or "").lower()
              test_strategy = str(task.get("test_strategy") or "").lower()

              if task_class == "business_logic" and subtype == "improper_assets_management" and endpoint in {"/v1", "/v2", "/v3"}:
                  return True
              if task_class == "business_logic" and endpoint in {"/v1", "/v2", "/v3"} and (
                  "version_diff" in strategy_family or
                  "version_diff" in test_strategy or
                  "workflow_state" in strategy_family or
                  "prepare_workflow_state" in test_strategy
              ):
                  return True
              return False


          def _sort_key(task):
              task_class = str(task.get("class") or "authorization").lower()
              class_rank = {"authorization": 0, "injection": 1, "business_logic": 2}.get(task_class, 9)
              priority = -int(task.get("priority") or 0)
              return (class_rank, priority)


          def _normalize_tasks(tasks):
              normalized = []
              allowed_classes = {"authorization", "injection", "business_logic"}
              for task in tasks or []:
                  if not isinstance(task, dict):
                      continue
                  task = json.loads(json.dumps(task))
                  if str(task.get("class") or "").lower() not in allowed_classes:
                      task["class"] = "authorization"
                  if _should_skip_task(task):
                      continue
                  normalized.append(task)
              normalized.sort(key=_sort_key)
              return normalized


          def main(text: str, planner_body: str = "") -> dict:
              try:
                  payload = json.loads(text or '{}')
              except Exception:
                  payload = {}

              try:
                  planner = json.loads(planner_body or '{}')
              except Exception:
                  planner = {}

              router_tasks = payload.get('tasks') or []
              if not isinstance(router_tasks, list):
                  router_tasks = []

              fallback_tasks = planner.get("final_task_queue") or planner.get("router_candidate_queue") or planner.get("generated_tasks") or []
              if not isinstance(fallback_tasks, list):
                  fallback_tasks = []

              normalized = _normalize_tasks(router_tasks) or _normalize_tasks(fallback_tasks)

              return {
                  "router_summary": str(payload.get("router_summary") or planner.get("planner_summary") or ""),
                  "pending_tasks_json": json.dumps(normalized, ensure_ascii=False),
                  "tasks_total": len(normalized),
              }
