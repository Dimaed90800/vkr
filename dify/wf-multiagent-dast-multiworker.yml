    - data:
        code: |
          import json
          import re

          MAX_TASKS = 10
          MAX_HINTS = 10
          MAX_STR = 240


          def _loads(value, default):
              try:
                  parsed = json.loads(value or 'null')
              except Exception:
                  return default
              return parsed if parsed is not None else default


          def _clip(value, limit=MAX_STR):
              text = str(value or '').strip()
              if len(text) <= limit:
                  return text
              return text[: limit - 3] + '...'


          def _has_auth_material(role):
              if not isinstance(role, dict):
                  return False
              return bool(role.get('token') or role.get('auth_headers') or role.get('cookies'))


          def _endpoint_flags(endpoint):
              path = str((endpoint or {}).get('path') or '').lower()
              path_params = (endpoint or {}).get('path_params') or []
              query_params = [str(item or '').lower() for item in ((endpoint or {}).get('query_params') or [])]
              object_like = bool(path_params) or any(item == 'id' or item.endswith('_id') for item in query_params) or '{' in path
              privileged = any(token in path for token in ('/admin', '/management', '/moderation', '/internal', '/staff', '/reports', '/config'))
              versioned = bool(re.search(r'/v\d+(?:\.\d+)?(?:/|$)', path))
              return object_like, privileged, versioned


          def _top_candidate_tasks(planner):
              tasks = planner.get('router_candidate_queue') or planner.get('final_task_queue') or planner.get('generated_tasks') or []
              if not isinstance(tasks, list):
                  tasks = []
              trimmed = []
              for task in tasks[:MAX_TASKS]:
                  if not isinstance(task, dict):
                      continue
                  trimmed.append({
                      'id': _clip(task.get('id')),
                      'class': _clip(task.get('class')),
                      'subtype': _clip(task.get('subtype')),
                      'endpoint': _clip(task.get('endpoint')),
                      'method': _clip(task.get('method'), 16),
                      'priority': int(task.get('priority') or 0),
                      'readiness': _clip(task.get('readiness'), 48),
                      'allowed_tools': [str(item or '') for item in (task.get('allowed_tools') or [])[:4]],
                      'hypothesis_family': _clip(task.get('hypothesis_family')),
                      'recommended_next_step': _clip(task.get('recommended_next_step'), 48),
                  })
              return trimmed, len(tasks)


          def _bootstrap_endpoints(tasks, endpoints):
              values = []
              seen = set()
              for task in tasks or []:
                  if not isinstance(task, dict):
                      continue
                  endpoint = _clip(task.get('endpoint'))
                  subtype = str(task.get('subtype') or '').lower()
                  if endpoint and (subtype == 'auth_bootstrap' or any(token in endpoint.lower() for token in ('login', 'signup', 'register', 'signin', 'password', 'otp', 'token'))):
                      if endpoint not in seen:
                          seen.add(endpoint)
                          values.append(endpoint)
                  if len(values) >= MAX_HINTS:
                      return values
              for endpoint in endpoints or []:
                  if not isinstance(endpoint, dict):
                      continue
                  path = _clip(endpoint.get('path'))
                  if path and any(token in path.lower() for token in ('login', 'signup', 'register', 'signin', 'password', 'otp', 'token')):
                      if path not in seen:
                          seen.add(path)
                          values.append(path)
                  if len(values) >= MAX_HINTS:
                      break
              return values


          def _versioned_paths(endpoints):
              values = []
              seen = set()
              for endpoint in endpoints or []:
                  if not isinstance(endpoint, dict):
                      continue
                  path = _clip(endpoint.get('path'))
                  if not path or path in seen:
                      continue
                  _, _, versioned = _endpoint_flags(endpoint)
                  if versioned:
                      seen.add(path)
                      values.append(path)
                  if len(values) >= MAX_HINTS:
                      break
              return values


          def _high_conf_sources(endpoints):
              values = []
              seen = set()
              for endpoint in endpoints or []:
                  if not isinstance(endpoint, dict):
                      continue
                  if float(endpoint.get('source_confidence') or 0.0) < 0.8:
                      continue
                  for source in (endpoint.get('sources') or []):
                      value = str(source or '').strip()
                      if value and value not in seen:
                          seen.add(value)
                          values.append(value)
                      if len(values) >= MAX_HINTS:
                          return values
              return values


          def main(execution_context_json: str, normalized_surface_json: str, planner_body: str) -> dict:
              execution_context = _loads(execution_context_json, {})
              surface = _loads(normalized_surface_json, {'endpoints': []})
              planner = _loads(planner_body, {})

              planner_surface = planner.get('normalized_surface') or {}
              if isinstance(planner_surface, dict) and planner_surface.get('endpoints'):
                  surface = planner_surface
              endpoints = surface.get('endpoints') or []
              if not isinstance(endpoints, list):
                  endpoints = []

              total_endpoints = 0
              auth_required_endpoints = 0
              object_like_endpoints = 0
              privileged_endpoints = 0
              for endpoint in endpoints:
                  if not isinstance(endpoint, dict):
                      continue
                  total_endpoints += 1
                  if bool(endpoint.get('auth_required')):
                      auth_required_endpoints += 1
                  object_like, privileged, _ = _endpoint_flags(endpoint)
                  if object_like:
                      object_like_endpoints += 1
                  if privileged:
                      privileged_endpoints += 1

              top_tasks, source_task_count = _top_candidate_tasks(planner)
              roles = execution_context.get('roles') or []
              roles_summary = []
              for role in roles[:MAX_HINTS]:
                  if not isinstance(role, dict):
                      continue
                  roles_summary.append({
                      'name': _clip(role.get('name') or role.get('role'), 64),
                      'has_auth_material': _has_auth_material(role),
                  })

              summary = {
                  'target_url': _clip(execution_context.get('target_url'), 500),
                  'user_prompt': _clip(execution_context.get('user_prompt'), 500),
                  'capabilities': execution_context.get('capabilities') if isinstance(execution_context.get('capabilities'), dict) else {},
                  'roles_summary': roles_summary,
                  'surface_counts': {
                      'total_endpoints': total_endpoints,
                      'auth_required_endpoints': auth_required_endpoints,
                      'object_like_endpoints': object_like_endpoints,
                      'privileged_endpoints': privileged_endpoints,
                  },
                  'planner_summary': _clip(planner.get('planner_summary'), 500),
                  'planner_stats': {
                      'generated_total': int(((planner.get('stats') or {}).get('generated_total') or 0)),
                      'returned_total': int(((planner.get('stats') or {}).get('returned_total') or 0)),
                      'router_candidate_total': int(((planner.get('stats') or {}).get('router_candidate_total') or 0)),
                  },
                  'planner_metadata': {
                      'filtered_duplicates': int(((planner.get('metadata') or {}).get('filtered_duplicates') or 0)),
                      'filtered_inactive': int(((planner.get('metadata') or {}).get('filtered_inactive') or 0)),
                      'filtered_requires_enrichment': int(((planner.get('metadata') or {}).get('filtered_requires_enrichment') or 0)),
                      'capabilities': ((planner.get('metadata') or {}).get('capabilities') if isinstance((planner.get('metadata') or {}).get('capabilities'), dict) else {}),
                  },
                  'top_candidate_tasks': top_tasks,
                  'top_recon_hints': {
                      'bootstrap_endpoints': _bootstrap_endpoints(planner.get('router_candidate_queue') or planner.get('final_task_queue') or planner.get('generated_tasks') or [], endpoints)[:MAX_HINTS],
                      'versioned_paths': _versioned_paths(endpoints)[:MAX_HINTS],
                      'high_confidence_sources': _high_conf_sources(endpoints)[:MAX_HINTS],
                  },
                  'summary_debug': {
                      'source_task_count': source_task_count,
                      'source_endpoint_count': total_endpoints,
                  },
              }
              return {
                  'router_context_summary_json': json.dumps(summary, ensure_ascii=False)
              }
