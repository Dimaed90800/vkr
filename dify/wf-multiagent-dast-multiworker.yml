        code: "import json\nfrom datetime import datetime, timezone\n\n\ndef _emit(run_id: str, component: str, event_type: str, payload: dict):\n    record = {\n        'timestamp': datetime.now(timezone.utc).isoformat(),\n        'event_type': event_type,\n        'component': component,\n        'run_id': str(run_id or '').strip(),\n        **payload,\n    }\n    try:\n        print('[diag-event]', json.dumps(record, ensure_ascii=False))\n    except Exception:\n        pass\n\n\ndef _stop_snapshot(state: dict, scheduler: dict) -> dict:\n    pending_tasks = state.get('pending_tasks') or []\n    runnable = [item for item in pending_tasks if isinstance(item, dict) and str(item.get('readiness') or '') == 'ready_to_test']\n    waiting = [item for item in pending_tasks if isinstance(item, dict) and str(item.get('readiness') or '') == 'needs_preparation']\n    blocked = [item for item in pending_tasks if isinstance(item, dict) and str(item.get('readiness') or '') == 'cannot_proceed']\n    scheduler_state = state.get('scheduler_state') or {}\n    return {\n        'pending_count': len(pending_tasks),\n        'runnable_count': len(runnable),\n        'blocked_count': len(blocked),\n        'waiting_for_preparation_count': len(waiting),\n        'stop_reason': str(state.get('stop_reason') or scheduler.get('selection_reason') or 'no_runnable_tasks'),\n        'exhausted_budget_counts': {\n            'exploration_budget_used': int(scheduler_state.get('exploration_budget_used') or 0),\n            'deepening_budget_used': int(scheduler_state.get('deepening_budget_used') or 0),\n            'preparation_budget_used': int(scheduler_state.get('preparation_budget_used') or 0),\n        },\n        'total_completed_tasks': len(state.get('completed_tasks') or []),\n        'total_rejected_tasks': len(state.get('rejected_findings') or []),\n        'total_rework_tasks': len([item for item in (state.get('rejected_findings') or []) if isinstance(item, dict) and str(item.get('reason') or '').strip().lower().startswith('rework')]),\n        'total_followups_generated': sum(int(value or 0) for value in ((scheduler_state.get('root_followup_counts') or {}).values() if isinstance(scheduler_state.get('root_followup_counts'), dict) else [])),\n        'total_preparation_tasks_generated': len(waiting),\n        'total_enriched_tasks': len(runnable),\n        'total_harvested_ids': len(((state.get('execution_context') or {}).get('harvested_object_ids') or [])),\n        'total_materialized_objects': len(((state.get('execution_context') or {}).get('prepared_objects') or {})),\n    }\n\n\ndef _emit_stop(state: dict, scheduler: dict):\n    execution_context = state.get('execution_context') or {}\n    run_id = str(execution_context.get('run_id') or (state.get('scheduler_state') or {}).get('run_id') or '').strip()\n    root_trace_id = str(execution_context.get('root_trace_id') or run_id).strip()\n    snapshot = _stop_snapshot(state, scheduler)\n    pending_tasks = state.get('pending_tasks') or []\n    strongest_candidates = []\n    for task in sorted([item for item in pending_tasks if isinstance(item, dict)], key=lambda item: float(item.get('evidence_feasibility') or 0), reverse=True)[:5]:\n        strongest_candidates.append({\n            'id': task.get('id'),\n            'endpoint': task.get('endpoint'),\n            'class': task.get('class'),\n            'subtype': task.get('subtype'),\n            'readiness': task.get('readiness'),\n            'test_strategy': task.get('test_strategy'),\n        })\n    _emit(run_id, 'scheduler', 'run_stop', {\n        'status': 'success',\n        'summary': 'Run stopped after scheduler dispatch produced no runnable task.',\n        'run_id': run_id,\n        'trace_id': root_trace_id,\n        'reason': snapshot,\n        'counters': snapshot,\n        'artifacts': {\n            'strongest_unconfirmed_candidates': strongest_candidates,\n            'last_selection_reason': state.get('last_selection_reason'),\n            'last_deferred_classes': state.get('last_deferred_classes') or [],\n        },\n    })\n\n\ndef _no_task() -> dict:\n    return {\n        \"id\": \"__no_task__\",\n        \"class\": \"authorization\",\n        \"subtype\": \"noop\",\n        \"endpoint\": \"/__dify_no_task__\",\n        \"method\": \"GET\",\n        \"params\": {\"path_params\": [], \"query_params\": [], \"body_fields\": []},\n        \"auth_context\": {\"owner_role\": \"user_a\", \"other_role\": \"user_b\", \"token_strategy\": \"none\"},\n        \"hypothesis\": \"No task available.\",\n        \"priority\": 0,\n        \"retry_count\": 0,\n        \"rework_hint\": None,\n        \"status\": \"pending\",\n        \"allowed_tools\": [\"noop_outcome\"],\n        \"readiness\": \"cannot_proceed\",\n        \"required_capabilities\": [],\n        \"preparation_options\": [],\n        \"test_strategy\": \"noop\",\n    }\n\n\n\ndef _task_allowed_tools(task: dict) -> list:\n    value = task.get(\"allowed_tools\") or []\n    if not isinstance(value, list):\n        return []\n    return [str(item or \"\").strip() for item in value if str(item or \"\").strip()]\n\n\ndef _is_executable_task(task: dict) -> bool:\n    if not isinstance(task, dict):\n        return False\n    readiness = str(task.get(\"readiness\") or \"\").strip()\n    return readiness in {\"ready_to_test\", \"needs_preparation\"} and bool(_task_allowed_tools(task))\n\n\ndef _priority(task: dict) -> int:\n    try:\n        return int(task.get(\"priority\") or 0)\n    except Exception:\n        return 0\n\n\ndef _local_fallback_selection(tasks: list) -> tuple[dict, list, str]:\n    ready = [item for item in (tasks or []) if _is_executable_task(item) and str(item.get(\"readiness\") or \"\") == \"ready_to_test\"]\n    waiting = [item for item in (tasks or []) if _is_executable_task(item) and str(item.get(\"readiness\") or \"\") == \"needs_preparation\"]\n    pool = ready or waiting\n    if not pool:\n        return _no_task(), list(tasks or []), \"no_local_executable_task\"\n    indexed = list(enumerate(tasks or []))\n    candidates = []\n    selected_ids = {id(item) for item in pool}\n    for index, item in indexed:\n        if id(item) in selected_ids:\n            candidates.append((index, item))\n    candidates.sort(key=lambda pair: (_priority(pair[1]), 1 if str(pair[1].get(\"readiness\") or \"\") == \"ready_to_test\" else 0), reverse=True)\n    selected_index, active = candidates[0]\n    remaining = list(tasks or [])\n    remaining.pop(selected_index)\n    return active, remaining, \"local_executable_fallback\"\n\n\ndef _soft_stop_reason(reason: str) -> bool:\n    value = str(reason or \"\").strip().lower()\n    return value in {\n        \"all_class_budgets_exhausted\",\n        \"no_runnable_tasks\",\n        \"fallback_single_class_queue\",\n        \"no_tasks\",\n        \"\",\n    }\n\ndef main(state_json: str, scheduler_body: str = \"\") -> dict:\n    try:\n        state = json.loads(state_json or '{}')\n    except Exception:\n        state = {}\n    try:\n        scheduler = json.loads(scheduler_body or '{}')\n    except Exception:\n        scheduler = {}\n\n    stop_reason = str(state.get(\"stop_reason\") or \"\")\n    if not stop_reason:\n        if state.get(\"budget_used\", 0) >= state.get(\"max_requests\", 100):\n            stop_reason = \"budget_exceeded\"\n        else:\n            start_ts = state.get(\"start_timestamp\")\n            max_dur = int(state.get(\"max_duration_sec\", 900) or 900)\n            if start_ts:\n                try:\n                    started = datetime.fromisoformat(start_ts)\n                    if (datetime.now(timezone.utc) - started).total_seconds() >= max_dur:\n                        stop_reason = \"timeout\"\n                except Exception:\n                    pass\n\n    pending_tasks = scheduler.get(\"remaining_tasks\") or state.get(\"pending_tasks\") or []\n    executable_pending = [item for item in pending_tasks if _is_executable_task(item)]\n\n    if stop_reason and _soft_stop_reason(stop_reason) and executable_pending:\n        state[\"stop_reason\"] = \"\"\n        active, remaining, fallback_reason = _local_fallback_selection(pending_tasks)\n        state[\"pending_tasks\"] = remaining\n        state[\"scheduler_state\"] = scheduler.get(\"scheduler_state\") or state.get(\"scheduler_state\") or {}\n        state[\"last_selection_reason\"] = fallback_reason\n        state[\"last_deferred_classes\"] = scheduler.get(\"deferred_classes\") or []\n        return {\n            \"active_task_json\": json.dumps(active, ensure_ascii=False),\n            \"task_class\": str(active.get(\"class\") or \"authorization\").lower(),\n            \"remaining_tasks_json\": json.dumps(state.get(\"pending_tasks\") or [], ensure_ascii=False),\n            \"scheduler_state_json\": json.dumps(state.get(\"scheduler_state\") or {}, ensure_ascii=False),\n            \"remaining_state_json\": json.dumps(state, ensure_ascii=False),\n            \"current_execution_context_json\": json.dumps(state.get(\"execution_context\") or {}, ensure_ascii=False),\n            \"max_retries\": int(state.get(\"max_retries\", 1) or 1),\n        }\n\n    if stop_reason:\n        state[\"stop_reason\"] = stop_reason\n        _emit_stop(state, scheduler)\n        active = _no_task()\n        return {\n            \"active_task_json\": json.dumps(active, ensure_ascii=False),\n            \"task_class\": \"authorization\",\n            \"remaining_tasks_json\": json.dumps(state.get(\"pending_tasks\") or [], ensure_ascii=False),\n            \"scheduler_state_json\": json.dumps(state.get(\"scheduler_state\") or {}, ensure_ascii=False),\n            \"remaining_state_json\": json.dumps(state, ensure_ascii=False),\n            \"current_execution_context_json\": json.dumps(state.get(\"execution_context\") or {}, ensure_ascii=False),\n            \"max_retries\": int(state.get(\"max_retries\", 1) or 1),\n        }\n\n    should_stop = bool(scheduler.get(\"should_stop\"))\n    if should_stop and executable_pending and _soft_stop_reason(scheduler.get(\"selection_reason\") or state.get(\"stop_reason\") or \"\"):\n        state[\"stop_reason\"] = \"\"\n        active, remaining, fallback_reason = _local_fallback_selection(pending_tasks)\n        state[\"pending_tasks\"] = remaining\n        state[\"scheduler_state\"] = scheduler.get(\"scheduler_state\") or state.get(\"scheduler_state\") or {}\n        state[\"last_selection_reason\"] = fallback_reason\n        state[\"last_deferred_classes\"] = scheduler.get(\"deferred_classes\") or []\n        return {\n            \"active_task_json\": json.dumps(active, ensure_ascii=False),\n            \"task_class\": str(active.get(\"class\") or \"authorization\").lower(),\n            \"remaining_tasks_json\": json.dumps(state.get(\"pending_tasks\") or [], ensure_ascii=False),\n            \"scheduler_state_json\": json.dumps(state.get(\"scheduler_state\") or {}, ensure_ascii=False),\n            \"remaining_state_json\": json.dumps(state, ensure_ascii=False),\n            \"current_execution_context_json\": json.dumps(state.get(\"execution_context\") or {}, ensure_ascii=False),\n            \"max_retries\": int(state.get(\"max_retries\", 1) or 1),\n        }\n\n    if should_stop:\n        state[\"stop_reason\"] = state.get(\"stop_reason\") or str(scheduler.get('selection_reason') or 'no_runnable_tasks')\n        _emit_stop(state, scheduler)\n        active = _no_task()\n        return {\n            \"active_task_json\": json.dumps(active, ensure_ascii=False),\n            \"task_class\": \"authorization\",\n            \"remaining_tasks_json\": json.dumps(state.get(\"pending_tasks\") or [], ensure_ascii=False),\n            \"remaining_state_json\": json.dumps(state, ensure_ascii=False),\n            \"scheduler_state_json\": json.dumps(state.get(\"scheduler_state\") or {}, ensure_ascii=False),\n            \"current_execution_context_json\": json.dumps(state.get(\"execution_context\") or {}, ensure_ascii=False),\n            \"max_retries\": int(state.get(\"max_retries\", 1) or 1),\n        }\n\n    active = scheduler.get(\"next_task\") or _no_task()\n    state[\"pending_tasks\"] = scheduler.get(\"remaining_tasks\") or []\n    state[\"scheduler_state\"] = scheduler.get(\"scheduler_state\") or state.get(\"scheduler_state\") or {}\n    state[\"last_selection_reason\"] = str(scheduler.get(\"selection_reason\") or \"\")\n    state[\"last_deferred_classes\"] = scheduler.get(\"deferred_classes\") or []\n    return {\n        \"active_task_json\": json.dumps(active, ensure_ascii=False),\n        \"task_class\": str(active.get(\"class\") or \"authorization\").lower(),\n        \"remaining_tasks_json\": json.dumps(state.get(\"pending_tasks\") or [], ensure_ascii=False),\n        \"scheduler_state_json\": json.dumps(state.get(\"scheduler_state\") or {}, ensure_ascii=False),\n        \"remaining_state_json\": json.dumps(state, ensure_ascii=False),\n        \"current_execution_context_json\": json.dumps(state.get(\"execution_context\") or {}, ensure_ascii=False),\n        \"max_retries\": int(state.get(\"max_retries\", 1) or 1),\n    }\n"
