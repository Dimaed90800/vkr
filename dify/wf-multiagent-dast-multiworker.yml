    - data:
        code: "import json\nfrom datetime import datetime, timezone\nfrom hashlib import sha1\n\nSTRONG_INJECTION_INDICATORS = {\n    'sql_error_signal',\n    'template_error_signal',\n    'command_error_signal',\n    'parser_error_signal',\n    'unescaped_reflection',\n    'significant_time_anomaly',\n}\n\nWEAK_GATED_CLASSES = {\n    'excessive_data_exposure',\n    'injection',\n    'property_level_authorization',\n    'mass_assignment',\n    'workflow_abuse',\n    'security_misconfiguration',\n    'improper_assets_management',\n}\n\nPARSER_VALIDATION_INDICATORS = {\n    'parser_validation_error',\n    'invalid_template_for_worker',\n}\n\n\ndef _emit(run_id: str, component: str, event_type: str, payload: dict):\n    record = {\n        'timestamp': datetime.now(timezone.utc).isoformat(),\n        'event_type': event_type,\n        'component': component,\n        'run_id': str(run_id or '').strip(),\n        **payload,\n    }\n    try:\n        print('[diag-event]', json.dumps(record, ensure_ascii=False))\n    except Exception:\n        pass\n\n\ndef _title_for(classification: str) -> str:\n    value = str(classification or '').strip().lower()\n    mapping = {\n        'bola': 'Broken Object Level Authorization',\n        'horizontal_privilege': 'Horizontal Privilege Escalation',\n        'vertical_privilege': 'Vertical Privilege Escalation',\n        'generic_access_control': 'Generic Access Control Weakness',\n        'property_level_authorization': 'Broken Object Property Level Authorization',\n        'mass_assignment': 'Mass Assignment',\n        'function_level_authorization': 'Broken Function Level Authorization',\n        'excessive_data_exposure': 'Excessive Data Exposure',\n        'unrestricted_resource_consumption': 'Unrestricted Resource Consumption',\n        'security_misconfiguration': 'Security Misconfiguration',\n        'improper_assets_management': 'Improper Assets Management',\n        'workflow_abuse': 'Workflow Abuse',\n        'injection': 'Injection Weakness',\n    }\n    return mapping.get(value, 'Security Weakness')\n\n\ndef _label_for(classification: str) -> str:\n    value = str(classification or '').strip().lower()\n    mapping = {\n        'bola': 'BOLA',\n        'horizontal_privilege': 'HORIZONTAL_PRIVILEGE_ESCALATION',\n        'vertical_privilege': 'VERTICAL_PRIVILEGE_ESCALATION',\n        'generic_access_control': 'GENERIC_ACCESS_CONTROL',\n        'property_level_authorization': 'PROPERTY_LEVEL_AUTHORIZATION',\n        'mass_assignment': 'MASS_ASSIGNMENT',\n        'function_level_authorization': 'FUNCTION_LEVEL_AUTHORIZATION',\n        'excessive_data_exposure': 'EXCESSIVE_DATA_EXPOSURE',\n        'unrestricted_resource_consumption': 'UNRESTRICTED_RESOURCE_CONSUMPTION',\n        'security_misconfiguration': 'SECURITY_MISCONFIGURATION',\n        'improper_assets_management': 'IMPROPER_ASSETS_MANAGEMENT',\n        'workflow_abuse': 'WORKFLOW_ABUSE',\n        'injection': 'INJECTION',\n    }\n    return mapping.get(value, 'SECURITY_WEAKNESS')\n\n\ndef _indicators(evidence: dict) -> set:\n    return {str(item or '').strip() for item in (evidence.get('indicators') or []) if str(item or '').strip()}\n\n\ndef _response_summary(evidence: dict) -> dict:\n    value = evidence.get('response_summary') or {}\n    return value if isinstance(value, dict) else {}\n\n\ndef _signal_strength(classification: str, evidence: dict) -> str:\n    summary = _response_summary(evidence)\n    indicators = _indicators(evidence)\n    evidence_strength = str(summary.get('evidence_strength') or '').strip().lower()\n\n    if classification == 'injection':\n        if STRONG_INJECTION_INDICATORS.intersection(indicators) or evidence_strength == 'strong':\n            return 'strong'\n        if evidence_strength == 'medium' or 'reflection_detected' in indicators or 'significant_behavior_change' in indicators:\n            return 'medium'\n        return 'weak'\n\n    if classification == 'excessive_data_exposure':\n        if str(summary.get('weak_signal_class') or '').strip().lower() in {'schema_disclosure', 'verbose_validation_leak'}:\n            return 'weak'\n        if evidence_strength == 'strong':\n            return 'strong'\n        if evidence_strength == 'medium':\n            return 'medium'\n        if 'cross_role_data_exposure' in indicators and (summary.get('sample_exposed_fields') or {}):\n            return 'strong'\n        if (summary.get('nested_sensitive_keys_found') or []) and (summary.get('sample_exposed_fields') or {}):\n            return 'strong'\n        if (summary.get('sensitive_keys_found') or []) and (summary.get('sample_exposed_fields') or {}):\n            return 'medium'\n        return 'weak'\n\n    if classification in {'property_level_authorization', 'mass_assignment'}:\n        persisted = summary.get('persisted_fields') or []\n        accepted = summary.get('accepted_fields') or []\n        reflected = summary.get('reflected_fields') or []\n        if persisted:\n            return 'strong'\n        if accepted and reflected:\n            return 'medium'\n        return 'weak'\n\n    if classification == 'workflow_abuse':\n        violated = summary.get('violated_invariant_summary') or {}\n        if any(bool(violated.get(key)) for key in ('invalid_transition_accepted', 'repeated_sensitive_action_allowed', 'cross_role_workflow_access')) and str(summary.get('evidence_strength') or '').strip().lower() == 'strong':\n            return 'strong'\n        if any(bool(violated.get(key)) for key in ('invalid_transition_accepted', 'repeated_sensitive_action_allowed', 'cross_role_workflow_access')):\n            return 'medium'\n        if bool((summary.get('state_delta_summary') or {}).get('state_changed')):\n            return 'medium'\n        return 'weak'\n\n    if classification == 'security_misconfiguration':\n        if evidence_strength == 'strong' or {'weak_cors', 'internal_url_leak', 'stack_trace_detected'}.intersection(indicators):\n            return 'strong'\n        if evidence_strength == 'medium' or 'debug_header_exposed' in indicators:\n            return 'medium'\n        return 'weak'\n\n    if classification == 'improper_assets_management':\n        if evidence_strength == 'strong':\n            return 'strong'\n        if evidence_strength == 'medium' or 'deprecated_exposed_path_detected' in indicators:\n            return 'medium'\n        return 'weak'\n\n    return 'strong'\n\n\ndef _deterministic_rework_hint(classification: str) -> str | None:\n    hints = {\n        'excessive_data_exposure': 'Retry with authenticated success-path response and inspect returned object fields.',\n        'injection': 'Retry with alternate payload family and verify sink/error/reflection signals.',\n        'property_level_authorization': 'Re-read the object to verify whether the sensitive field persisted.',\n        'mass_assignment': 'Re-read the object to verify whether the sensitive field persisted.',\n        'workflow_abuse': 'Prepare object state first, then retry invalid transition or repeated action.',\n        'security_misconfiguration': 'Retry against the same endpoint with bounded method, header, and CORS checks.',\n        'improper_assets_management': 'Retry alternate version paths and compare auth behavior or sensitive functionality exposure.',\n        'parser_validation_error': 'Retry after aligning the worker template with parse_worker_command for the assigned worker and allowed tool.',\n    }\n    return hints.get(classification)\n\n\ndef _is_noop_task(active_task: dict) -> bool:\n    return str(active_task.get('id') or '') == '__no_task__' or str(active_task.get('subtype') or '').strip().lower() == 'noop'\n\n\ndef _apply_threshold(payload: dict, active_task: dict, evidence: dict, classification: str):\n    if _is_noop_task(active_task):\n        payload['verdict'] = 'rejected'\n        payload['reason'] = 'No active runnable task was selected; this is a scheduler stop marker, not a vulnerability result.'\n        payload['rework_hint'] = None\n        payload['finding_candidate'] = None\n        return payload\n\n    indicators = _indicators(evidence)\n    if classification == 'parser_validation_error' or PARSER_VALIDATION_INDICATORS.intersection(indicators):\n        payload['verdict'] = 'retry_with_hint'\n        payload['reason'] = 'Execution stopped at parser validation because the worker template did not match parse_worker_command expectations.'\n        payload['rework_hint'] = payload.get('rework_hint') or _deterministic_rework_hint('parser_validation_error')\n        payload['finding_candidate'] = None\n        payload['severity'] = None\n        return payload\n\n    if classification not in WEAK_GATED_CLASSES:\n        return payload\n\n    strength = _signal_strength(classification, evidence)\n    verdict = str(payload.get('verdict') or 'rejected').strip().lower()\n    if verdict == 'confirmed' and strength == 'weak':\n        payload['verdict'] = 'rejected'\n        payload['reason'] = str(payload.get('reason') or f'{classification} evidence was too weak for confirmation.')\n        payload['rework_hint'] = None\n        payload['finding_candidate'] = None\n    elif strength == 'medium' and verdict in {'confirmed', 'rejected'}:\n        payload['verdict'] = 'rework'\n        payload['reason'] = str(payload.get('reason') or f'{classification} evidence was promising but insufficient for confirmation.')\n        payload['rework_hint'] = payload.get('rework_hint') or _deterministic_rework_hint(classification)\n        payload['finding_candidate'] = None\n    return payload\n\n\ndef main(text: str, active_task_json: str, evidence_json: str) -> dict:\n    try:\n        payload = json.loads(text or '{}')\n    except Exception:\n        payload = {}\n    try:\n        active_task = json.loads(active_task_json or '{}')\n    except Exception:\n        active_task = {}\n    try:\n        evidence = json.loads(evidence_json or '{}')\n    except Exception:\n        evidence = {}\n\n    classification = str(((evidence.get('response_summary') or {}).get('finding_type_hint')) or ((evidence.get('response_summary') or {}).get('auth_finding_type')) or evidence.get('classification_hint') or '').strip().lower()\n    initial_verdict = str(payload.get('verdict') or 'rejected')\n    signal_strength = _signal_strength(classification, evidence) if classification else 'strong'\n    payload = _apply_threshold(payload, active_task, evidence, classification)\n    finding_candidate = payload.get('finding_candidate')\n    if payload.get('verdict') == 'confirmed' and isinstance(finding_candidate, dict) and classification:\n        finding_candidate = dict(finding_candidate)\n        finding_candidate['vuln_type'] = _label_for(classification)\n        finding_candidate['title'] = _title_for(classification)\n        payload['finding_candidate'] = finding_candidate\n\n    run_id = str(evidence.get('run_id') or '').strip()\n    root_trace_id = str(evidence.get('root_trace_id') or run_id).strip()\n    trace_base = '|'.join([\n        run_id,\n        str(active_task.get('id') or ''),\n        str(active_task.get('endpoint') or ''),\n        str(active_task.get('method') or ''),\n        str(active_task.get('test_strategy') or ''),\n        str(active_task.get('retry_count') or 0),\n    ])\n    trace_id = sha1(trace_base.encode('utf-8')).hexdigest()[:16]\n    _emit(run_id, 'judge', 'judge_verdict_finalized', {\n        'status': 'success',\n        'summary': 'Judge verdict parsed and guardrails applied.',\n        'run_id': run_id,\n        'trace_id': trace_id,\n        'task_id': str(active_task.get('id') or ''),\n        'trace_context': {\n            'root_trace_id': root_trace_id,\n            'endpoint': active_task.get('endpoint'),\n            'method': active_task.get('method'),\n            'class': active_task.get('class'),\n            'subtype': active_task.get('subtype'),\n            'hypothesis_family': active_task.get('hypothesis_family'),\n            'resource_family': (active_task.get('context_hints') or {}).get('resource_family') if isinstance(active_task.get('context_hints'), dict) else None,\n            'strategy': active_task.get('test_strategy'),\n            'retry_count': int(active_task.get('retry_count') or 0),\n            'followup_generation': int(active_task.get('followup_generation') or 0),\n        },\n        'reason': {\n            'initial_verdict': initial_verdict,\n            'final_verdict': str(payload.get('verdict') or 'rejected'),\n            'classification': classification,\n            'signal_strength': signal_strength,\n            'guardrail_changed_verdict': str(initial_verdict).lower() != str(payload.get('verdict') or '').lower(),\n            'judge_reason': str(payload.get('reason') or ''),\n        },\n        'artifacts': {\n            'finding_type_hint': classification,\n            'evidence_strength': (_response_summary(evidence).get('evidence_strength')),\n            'indicators': list((evidence.get('indicators') or [])[:8]),\n            'rework_hint': payload.get('rework_hint'),\n        },\n    })\n\n    queue_payload = dict(payload)\n    if str(queue_payload.get('verdict') or '').strip().lower() == 'retry_with_hint':\n        queue_payload['verdict'] = 'rework'\n\n    return {\n        \"task_id\": str(payload.get(\"task_id\") or active_task.get(\"id\") or \"\"),\n        \"verdict\": str(payload.get(\"verdict\") or \"rejected\"),\n        \"queue_verdict\": str(queue_payload.get(\"verdict\") or \"rejected\"),\n        \"reason\": str(payload.get(\"reason\") or \"\"),\n        \"rework_hint\": payload.get(\"rework_hint\"),\n        \"rework_hint_json\": json.dumps(payload.get(\"rework_hint\"), ensure_ascii=False),\n        \"finding_candidate_json\": json.dumps(payload.get(\"finding_candidate\"), ensure_ascii=False),\n        \"verdict_json\": json.dumps(queue_payload, ensure_ascii=False),\n    }\n"
