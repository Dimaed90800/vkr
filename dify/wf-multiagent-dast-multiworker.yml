    - data:
        code: "import json\n\ndef _artifacts(evidence):\n    value = evidence.get('artifacts') or []\n    return value if isinstance(value, list) else []\n\ndef _artifact_value(artifacts, artifact_type):\n    for item in artifacts:\n        if not isinstance(item, dict):\n            continue\n        if str(item.get('type') or '') == artifact_type:\n            return item.get('value')\n    return None\n\ndef _has_auth_material(role):\n    if not isinstance(role, dict):\n        return False\n    return bool(role.get('token') or role.get('auth_headers') or role.get('cookies'))\n\n\ndef _merge_roles(existing_roles, prepared_roles):\n    merged = []\n    by_name = {}\n    for role in existing_roles or []:\n        if isinstance(role, dict):\n            name = str(role.get('name') or role.get('role') or '').strip()\n            if name:\n                by_name[name] = dict(role)\n    for role in prepared_roles or []:\n        if not isinstance(role, dict):\n            continue\n        name = str(role.get('name') or role.get('role') or '').strip()\n        if not name:\n            continue\n        current = dict(by_name.get(name) or {})\n        current.update(role)\n        by_name[name] = current\n    for key in sorted(by_name.keys()):\n        merged.append(by_name[key])\n    return merged\n\n\ndef _merge_auth_endpoints(existing_items, discovered_items):\n    merged = []\n    seen = set()\n    for item in [*(existing_items or []), *(discovered_items or [])]:\n        if not isinstance(item, dict):\n            continue\n        key = (str(item.get('type') or ''), str(item.get('path') or ''), str(item.get('method') or ''))\n        if key in seen or not key[1]:\n            continue\n        seen.add(key)\n        merged.append(item)\n    return merged[:12]\n\n\ndef _merge_traffic_requests(existing_requests, observed_requests):\n    merged = []\n    seen = set()\n    for item in [*(existing_requests or []), *(observed_requests or [])]:\n        if not isinstance(item, dict):\n            continue\n        key = (str(item.get('method') or ''), str(item.get('url') or ''))\n        if key in seen or not key[1]:\n            continue\n        seen.add(key)\n        merged.append(item)\n    return merged[:20]\n\n\ndef _merge_strings(existing, new_items):\n    merged = []\n    seen = set()\n    for item in [*(existing or []), *(new_items or [])]:\n        value = str(item or '').strip()\n        if not value or value in seen:\n            continue\n        seen.add(value)\n        merged.append(value)\n    return merged\n\n\ndef _surface_to_requests(surface):\n    if not isinstance(surface, dict):\n        return []\n    normalized_surface = surface.get('normalized_surface') or {}\n    endpoints = normalized_surface.get('endpoints') or []\n    requests = []\n    for endpoint in endpoints:\n        if not isinstance(endpoint, dict):\n            continue\n        examples = endpoint.get('observed_examples') or []\n        for example in examples:\n            if not isinstance(example, dict):\n                continue\n            url = str(example.get('url') or '').strip()\n            if not url:\n                continue\n            requests.append({\n                'method': str(example.get('method') or endpoint.get('method') or 'GET').upper(),\n                'url': url,\n                'headers': {},\n                'query_params': {},\n                'json_body': None,\n            })\n    return requests\n\n\ndef _is_object_auth_task(task):\n    params = task.get('params') or {}\n    if not isinstance(params, dict):\n        params = {}\n    return bool(params.get('path_params')) and ('{id}' in str(task.get('endpoint') or '') or params.get('object_param_name'))\n\n\ndef _is_auth_bootstrap_task(task):\n    subtype = str(task.get('subtype') or '').strip().lower()\n    endpoint = str(task.get('endpoint') or '').strip().lower()\n    if subtype == 'auth_bootstrap':\n        return True\n    return any(marker in endpoint for marker in ('login', 'signin', 'sign-in', 'signup', 'register'))\n\n\ndef _task_resource_family(task):\n    hints = task.get('context_hints') or {}\n    if isinstance(hints, dict) and hints.get('resource_family'):\n        return str(hints.get('resource_family') or '').strip().lower()\n    endpoint = str(task.get('endpoint') or '').lower()\n    for family, keywords in {\n        'vehicle': ('vehicle', 'vehicles', 'vin', 'location'),\n        'order': ('order', 'orders', 'checkout', 'return_order'),\n        'post': ('post', 'posts', 'community'),\n        'video': ('video', 'videos'),\n        'report': ('report', 'reports', 'mechanic_report', 'service_requests'),\n        'coupon': ('coupon', 'redeem'),\n    }.items():\n        if any(keyword in endpoint for keyword in keywords):\n            return family\n    return 'generic_resource'\n\n\ndef _task_accepts_family(task, family):\n    task_family = _task_resource_family(task)\n    if not family:\n        return False\n    if task_family == family:\n        return True\n    aliases = {\n        'mechanic': {'report'},\n        'report': {'mechanic'},\n    }\n    return family in aliases.get(task_family, set()) or task_family in aliases.get(family, set())\n\n\ndef _apply_object_context_to_task(task, object_id, family):\n    updated = json.loads(json.dumps(task or {}))\n    params = updated.get('params') or {}\n    if not isinstance(params, dict):\n        params = {}\n        updated['params'] = params\n    if object_id in (None, ''):\n        return updated\n    candidates = params.get('object_id_candidates') or []\n    if not isinstance(candidates, list):\n        candidates = []\n    normalized = [item for item in candidates if item not in (None, '')]\n    if object_id not in normalized:\n        normalized.insert(0, object_id)\n    params['object_id_candidates'] = normalized\n    params['selected_object_id'] = params.get('selected_object_id') or object_id\n    if _task_accepts_family(updated, family) or str(updated.get('class') or '').lower() == 'authorization':\n        params['requires_object_id_enrichment'] = False\n    capability_state = updated.get('capability_state') or {}\n    if not isinstance(capability_state, dict):\n        capability_state = {}\n    capability_state['has_object_candidates'] = True\n    if str(updated.get('class') or '').lower() == 'business_logic' and _task_accepts_family(updated, family):\n        capability_state['has_workflow_hints'] = True\n        updated['readiness'] = 'ready_to_test'\n        updated['allowed_tools'] = ['logic_test']\n        updated['preparation_options'] = []\n        updated['test_strategy'] = 'workflow_sequence_probe'\n    updated['capability_state'] = capability_state\n    return updated\n\n\ndef _auth_capabilities(roles, execution_context=None):\n    auth_roles = [item for item in (roles or []) if _has_auth_material(item)]\n    capabilities = ((execution_context or {}).get('capabilities') or {}) if isinstance(execution_context, dict) else {}\n    if not isinstance(capabilities, dict):\n        capabilities = {}\n    has_auth_profiles = bool(capabilities.get('has_auth_profiles')) or len(auth_roles) >= 1\n    has_multi_role_auth = bool(capabilities.get('has_multi_role_auth')) or len(auth_roles) >= 2\n    has_provisioned_identities = bool(capabilities.get('has_provisioned_identities')) or has_multi_role_auth\n    return auth_roles, {\n        'has_auth_profiles': has_auth_profiles,\n        'has_multi_role_auth': has_multi_role_auth,\n        'has_provisioned_identities': has_provisioned_identities,\n    }\n\n\ndef _enrich_pending_authorization_tasks(tasks, roles, execution_context=None):\n    auth_roles, auth_caps = _auth_capabilities(roles, execution_context)\n    if not auth_caps['has_auth_profiles']:\n        return tasks or []\n\n    role_names = [str(item.get('name') or item.get('role') or '').strip() for item in auth_roles if isinstance(item, dict)]\n    role_names = [item for item in role_names if item]\n    enriched = []\n    for task in tasks or []:\n        if not isinstance(task, dict) or str(task.get('class') or '').lower() != 'authorization':\n            enriched.append(task)\n            continue\n        updated = json.loads(json.dumps(task))\n        params = updated.get('params') or {}\n        if not isinstance(params, dict):\n            params = {}\n            updated['params'] = params\n        capability_state = updated.get('capability_state') or {}\n        if not isinstance(capability_state, dict):\n            capability_state = {}\n        capability_state['has_auth_profiles'] = auth_caps['has_auth_profiles']\n        capability_state['has_multi_role_auth'] = auth_caps['has_multi_role_auth']\n        capability_state['has_provisioned_identities'] = auth_caps['has_provisioned_identities']\n        updated['capability_state'] = capability_state\n        if len(role_names) >= 2:\n            auth_context = updated.get('auth_context') or {}\n            auth_context['owner_role'] = role_names[0]\n            auth_context['other_role'] = role_names[1]\n            updated['auth_context'] = auth_context\n\n        if _is_auth_bootstrap_task(updated):\n            enriched.append(updated)\n            continue\n\n        has_object_id = bool(params.get('selected_object_id') or params.get('object_id_candidates'))\n        requires_object_id = bool(params.get('requires_object_id_enrichment')) or ('has_object_candidates' in [str(value or '').strip() for value in (updated.get('required_capabilities') or [])])\n\n        if auth_caps['has_multi_role_auth'] and (not requires_object_id or has_object_id):\n            updated['readiness'] = 'ready_to_test'\n            updated['allowed_tools'] = ['auth_test_access']\n            updated['preparation_options'] = []\n            updated['test_strategy'] = 'cross_role_replay'\n        elif auth_caps['has_multi_role_auth'] and requires_object_id and not has_object_id:\n            updated['readiness'] = 'needs_preparation'\n            updated['allowed_tools'] = ['create_test_object']\n            updated['preparation_options'] = ['create_test_object']\n            updated['test_strategy'] = 'prepare_object_then_replay'\n        elif auth_caps['has_auth_profiles']:\n            updated['readiness'] = 'needs_preparation'\n            updated['allowed_tools'] = ['auto_provision']\n            updated['preparation_options'] = ['auto_provision']\n            updated['test_strategy'] = 'provision_then_replay'\n        enriched.append(updated)\n    return enriched\n\n\n\n\ndef _finding_key(finding):\n    if not isinstance(finding, dict):\n        return None\n    return (\n        str(finding.get(\"endpoint\") or \"\").strip(),\n        str(finding.get(\"method\") or \"\").strip().upper(),\n        str(finding.get(\"vuln_type\") or finding.get(\"title\") or \"\").strip().upper(),\n    )\n\n\ndef _append_unique_finding(findings, finding):\n    key = _finding_key(finding)\n    if key is None:\n        return findings\n    for item in findings or []:\n        if _finding_key(item) == key:\n            return findings\n    findings.append(finding)\n    return findings\n\ndef _has_executable_pending_tasks(tasks):\n    for item in tasks or []:\n        if not isinstance(item, dict):\n            continue\n        readiness = str(item.get('readiness') or '').strip()\n        allowed_tools = [str(tool or '').strip() for tool in (item.get('allowed_tools') or []) if str(tool or '').strip()]\n        if readiness in {'ready_to_test', 'needs_preparation'} and allowed_tools:\n            return True\n    return False\n\n\ndef _enrich_pending_tasks_with_object(tasks, prepared_object, harvested_ids, workflow_context=None):\n    object_id = None\n    family = ''\n    if isinstance(prepared_object, dict):\n        object_id = prepared_object.get('object_id')\n        family = str(prepared_object.get('resource_family') or prepared_object.get('object_type') or '').strip().lower()\n    if object_id in (None, ''):\n        values = [item for item in (harvested_ids or []) if item not in (None, '')]\n        object_id = values[0] if values else None\n    if not family and isinstance(workflow_context, dict):\n        family = str(workflow_context.get('resource_family') or '').strip().lower()\n    if object_id in (None, ''):\n        return tasks or []\n    enriched = []\n    for task in tasks or []:\n        if not isinstance(task, dict):\n            enriched.append(task)\n            continue\n        if _task_accepts_family(task, family) or str(task.get('class') or '').lower() == 'authorization':\n            enriched.append(_apply_object_context_to_task(task, object_id, family))\n        else:\n            enriched.append(task)\n    return enriched\n\n\ndef _apply_preparation(task, roles, prepared_object, captured_surface, discovered_auth_endpoints):\n    updated = json.loads(json.dumps(task or {}))\n    params = updated.get('params') or {}\n    if not isinstance(params, dict):\n        params = {}\n        updated['params'] = params\n    capability_state = updated.get('capability_state') or {}\n    if not isinstance(capability_state, dict):\n        capability_state = {}\n    role_names = [str(item.get('name') or item.get('role') or '').strip() for item in roles if isinstance(item, dict)]\n    role_names = [item for item in role_names if item]\n    auth_roles = [item for item in roles if _has_auth_material(item)]\n\n    if len(role_names) >= 2:\n        auth_context = updated.get('auth_context') or {}\n        auth_context['owner_role'] = role_names[0]\n        auth_context['other_role'] = role_names[1]\n        updated['auth_context'] = auth_context\n    capability_state['has_auth_profiles'] = len(auth_roles) >= 1\n    capability_state['has_multi_role_auth'] = len(auth_roles) >= 2\n    capability_state['has_login_endpoint'] = any(isinstance(item, dict) and str(item.get('type') or '').lower() == 'login' for item in (discovered_auth_endpoints or [])) or capability_state.get('has_login_endpoint', False)\n    capability_state['has_register_endpoint'] = any(isinstance(item, dict) and str(item.get('type') or '').lower() == 'register' for item in (discovered_auth_endpoints or [])) or capability_state.get('has_register_endpoint', False)\n\n    object_id = None\n    if isinstance(prepared_object, dict):\n        object_id = prepared_object.get('object_id')\n    if object_id not in (None, ''):\n        existing = params.get('object_id_candidates') or []\n        if not isinstance(existing, list):\n            existing = []\n        normalized = [item for item in existing if item not in (None, '')]\n        if object_id not in normalized:\n            normalized.insert(0, object_id)\n        params['object_id_candidates'] = normalized\n        params['selected_object_id'] = object_id\n        params['requires_object_id_enrichment'] = False\n        capability_state['has_object_candidates'] = True\n    else:\n        capability_state['has_object_candidates'] = bool(params.get('selected_object_id') or params.get('object_id_candidates'))\n\n    if isinstance(captured_surface, dict):\n        normalized_surface = captured_surface.get('normalized_surface') or {}\n        endpoints = normalized_surface.get('endpoints') or []\n        capability_state['has_traffic_surface'] = bool(endpoints)\n        capability_state['has_input_shape'] = bool(params.get('query_params') or params.get('body_fields')) or any(\n            isinstance(item, dict) and (item.get('query_params') or item.get('body_fields') or item.get('path_params'))\n            for item in endpoints\n        )\n        capability_state['has_workflow_hints'] = capability_state.get('has_workflow_hints') or len(endpoints) >= 2\n        if updated.get('class') == 'injection' and endpoints:\n            for endpoint in endpoints:\n                if isinstance(endpoint, dict) and str(endpoint.get('path') or '') == str(updated.get('endpoint') or ''):\n                    params['query_params'] = list(endpoint.get('query_params') or params.get('query_params') or [])\n                    params['body_fields'] = list(endpoint.get('body_fields') or params.get('body_fields') or [])\n                    break\n\n    updated['capability_state'] = capability_state\n    if updated.get('class') == 'authorization':\n        if capability_state.get('has_multi_role_auth') and (not _is_object_auth_task(updated) or capability_state.get('has_object_candidates')):\n            updated['readiness'] = 'ready_to_test'\n            updated['allowed_tools'] = ['auth_test_access']\n            updated['preparation_options'] = []\n            updated['test_strategy'] = 'cross_role_replay'\n        elif capability_state.get('has_login_endpoint') and capability_state.get('has_register_endpoint') and not capability_state.get('has_auth_profiles'):\n            updated['readiness'] = 'needs_preparation'\n            updated['allowed_tools'] = ['auto_provision']\n            updated['preparation_options'] = ['auto_provision']\n            updated['test_strategy'] = 'provision_then_replay'\n        elif capability_state.get('has_multi_role_auth') and _is_object_auth_task(updated):\n            updated['readiness'] = 'needs_preparation'\n            updated['allowed_tools'] = ['create_test_object']\n            updated['preparation_options'] = ['create_test_object']\n            updated['test_strategy'] = 'prepare_object_then_replay'\n        else:\n            updated['readiness'] = 'needs_preparation'\n            updated['allowed_tools'] = ['auth_probe_entrypoints']\n            updated['preparation_options'] = ['auth_probe_entrypoints']\n            updated['test_strategy'] = 'discover_auth_bootstrap_then_provision'\n    elif updated.get('class') == 'injection':\n        if capability_state.get('has_input_shape'):\n            updated['readiness'] = 'ready_to_test'\n            updated['allowed_tools'] = ['injection_test', 'reflection_probe', 'path_fuzz_probe']\n            updated['preparation_options'] = []\n            updated['test_strategy'] = 'direct_input_probe'\n        else:\n            updated['readiness'] = 'needs_preparation'\n            updated['allowed_tools'] = ['input_shape_probe']\n            updated['preparation_options'] = ['input_shape_probe', 'capture_authenticated_traffic']\n            updated['test_strategy'] = 'shape_probe_then_test'\n    elif updated.get('class') == 'business_logic':\n        if capability_state.get('has_workflow_hints') or capability_state.get('has_object_candidates'):\n            updated['readiness'] = 'ready_to_test'\n            updated['allowed_tools'] = ['logic_test']\n            updated['preparation_options'] = []\n            updated['test_strategy'] = 'workflow_sequence_probe'\n        else:\n            updated['readiness'] = 'needs_preparation'\n            updated['allowed_tools'] = ['workflow_probe']\n            updated['preparation_options'] = ['workflow_probe', 'capture_authenticated_traffic']\n            updated['test_strategy'] = 'workflow_probe_then_test'\n    return updated\n\n\ndef _upsert_task(tasks, task):\n    task_id = str(task.get('id') or '')\n    result = []\n    replaced = False\n    for item in tasks or []:\n        if isinstance(item, dict) and str(item.get('id') or '') == task_id:\n            result.append(task)\n            replaced = True\n        else:\n            result.append(item)\n    if not replaced:\n        result.insert(0, task)\n    return result\n\n\ndef main(remaining_state_json: str, active_task_json: str, verdict_json: str, evidence_json: str, queue_body: str = \"\") -> dict:\n    try:\n        state = json.loads(remaining_state_json or '{}')\n    except Exception:\n        state = {}\n    try:\n        task = json.loads(active_task_json or '{}')\n    except Exception:\n        task = {}\n    try:\n        verdict = json.loads(verdict_json or '{}')\n    except Exception:\n        verdict = {}\n    try:\n        evidence = json.loads(evidence_json or '{}')\n    except Exception:\n        evidence = {}\n    try:\n        queue_update = json.loads(queue_body or '{}')\n    except Exception:\n        queue_update = {}\n\n    task_id = str(task.get(\"id\") or \"\")\n    if task_id == \"__no_task__\":\n        state[\"stop_reason\"] = state.get(\"stop_reason\") or \"no_tasks\"\n        return {\n            \"state_json\": json.dumps(state, ensure_ascii=False),\n            \"should_exit_loop\": True,\n        }\n\n    state.setdefault(\"pending_tasks\", [])\n    state.setdefault(\"confirmed_findings\", [])\n    state.setdefault(\"rejected_findings\", [])\n    state.setdefault(\"evidence_records\", [])\n    state.setdefault(\"completed_tasks\", [])\n    state.setdefault(\"execution_context\", {})\n    state[\"pending_tasks\"] = queue_update.get(\"pending_tasks\") or state.get(\"pending_tasks\") or []\n    state[\"scheduler_state\"] = queue_update.get(\"scheduler_state\") or state.get(\"scheduler_state\") or {}\n    state[\"last_queue_update_reason\"] = str(queue_update.get(\"queue_update_reason\") or \"\")\n    backend_execution_context = queue_update.get(\"updated_execution_context\")\n    backend_enrichment_present = isinstance(backend_execution_context, dict) and bool(backend_execution_context)\n    if backend_enrichment_present:\n        state[\"execution_context\"] = backend_execution_context\n\n    state[\"budget_used\"] = int(state.get(\"budget_used\", 0) or 0) + 1\n    state[\"evidence_records\"].append(evidence)\n\n    artifacts = _artifacts(evidence)\n    prepared_roles = _artifact_value(artifacts, 'provisioned_identities') or []\n    prepared_object = _artifact_value(artifacts, 'prepared_object') or None\n    harvested_object_ids = _artifact_value(artifacts, 'harvested_object_ids') or []\n    harvested_links = _artifact_value(artifacts, 'harvested_links') or []\n    workflow_context = _artifact_value(artifacts, 'workflow_context') or None\n    captured_surface = _artifact_value(artifacts, 'captured_traffic_surface') or None\n    discovered_auth_endpoints = _artifact_value(artifacts, 'discovered_auth_endpoints') or []\n    continuation = False\n\n    if prepared_roles:\n        ctx = state.get('execution_context') or {}\n        merged_roles = _merge_roles(ctx.get('roles') or [], prepared_roles)\n        ctx['roles'] = merged_roles\n        capabilities = ctx.get('capabilities') or {}\n        if not isinstance(capabilities, dict):\n            capabilities = {}\n        capabilities['has_auth_profiles'] = any(_has_auth_material(item) for item in merged_roles)\n        capabilities['has_multi_role_auth'] = sum(1 for item in merged_roles if _has_auth_material(item)) >= 2\n        capabilities['has_provisioned_identities'] = capabilities['has_multi_role_auth']\n        ctx['capabilities'] = capabilities\n        state['execution_context'] = ctx\n        continuation = True\n\n    if discovered_auth_endpoints:\n        ctx = state.get('execution_context') or {}\n        merged_auth_endpoints = _merge_auth_endpoints(ctx.get('discovered_auth_endpoints') or [], discovered_auth_endpoints)\n        ctx['discovered_auth_endpoints'] = merged_auth_endpoints\n        capabilities = ctx.get('capabilities') or {}\n        if not isinstance(capabilities, dict):\n            capabilities = {}\n        capabilities['has_login_endpoint'] = any(str(item.get('type') or '').lower() == 'login' for item in merged_auth_endpoints if isinstance(item, dict))\n        capabilities['has_register_endpoint'] = any(str(item.get('type') or '').lower() == 'register' for item in merged_auth_endpoints if isinstance(item, dict))\n        capabilities['has_auth_entrypoint_candidates'] = capabilities.get('has_auth_entrypoint_candidates', False) or bool(merged_auth_endpoints)\n        ctx['capabilities'] = capabilities\n        state['execution_context'] = ctx\n        continuation = True\n\n    if isinstance(prepared_object, dict) and prepared_object.get('object_id') not in (None, ''):\n        ctx = state.get('execution_context') or {}\n        capabilities = ctx.get('capabilities') or {}\n        if not isinstance(capabilities, dict):\n            capabilities = {}\n        capabilities['has_object_candidates'] = True\n        capabilities['has_prepared_object'] = True\n        ctx['capabilities'] = capabilities\n        ctx['harvested_object_ids'] = _merge_strings(ctx.get('harvested_object_ids') or [], harvested_object_ids or [prepared_object.get('object_id')])\n        prepared_objects = ctx.get('prepared_objects') or {}\n        if not isinstance(prepared_objects, dict):\n            prepared_objects = {}\n        family = str(prepared_object.get('resource_family') or prepared_object.get('object_type') or 'resource').strip().lower()\n        prepared_objects[family] = prepared_object\n        ctx['prepared_objects'] = prepared_objects\n        if harvested_links:\n            ctx['harvested_links'] = _merge_strings(ctx.get('harvested_links') or [], harvested_links)\n        state['execution_context'] = ctx\n        continuation = True\n\n    if isinstance(workflow_context, dict) and workflow_context.get('object_id') not in (None, ''):\n        ctx = state.get('execution_context') or {}\n        ctx['workflow_context'] = workflow_context\n        ctx['harvested_object_ids'] = _merge_strings(ctx.get('harvested_object_ids') or [], [workflow_context.get('object_id')])\n        capabilities = ctx.get('capabilities') or {}\n        if not isinstance(capabilities, dict):\n            capabilities = {}\n        capabilities['has_workflow_hints'] = True\n        capabilities['has_object_candidates'] = True\n        ctx['capabilities'] = capabilities\n        state['execution_context'] = ctx\n        continuation = True\n\n    if isinstance(captured_surface, dict):\n        ctx = state.get('execution_context') or {}\n        existing_requests = ctx.get('traffic_requests') or []\n        ctx['traffic_requests'] = _merge_traffic_requests(existing_requests, _surface_to_requests(captured_surface))\n        capabilities = ctx.get('capabilities') or {}\n        if not isinstance(capabilities, dict):\n            capabilities = {}\n        endpoints = ((captured_surface.get('normalized_surface') or {}).get('endpoints') or []) if isinstance(captured_surface, dict) else []\n        capabilities['has_traffic_surface'] = bool(endpoints)\n        capabilities['has_browser_capture'] = capabilities.get('has_browser_capture') or False\n        capabilities['has_input_shape'] = capabilities.get('has_input_shape') or any(\n            isinstance(item, dict) and (item.get('query_params') or item.get('body_fields') or item.get('path_params'))\n            for item in endpoints\n        )\n        capabilities['has_workflow_hints'] = capabilities.get('has_workflow_hints') or len(endpoints) >= 2\n        ctx['capabilities'] = capabilities\n        state['execution_context'] = ctx\n        continuation = True\n\n    roles = (state.get('execution_context') or {}).get('roles') or []\n    if roles or backend_enrichment_present:\n        state['pending_tasks'] = _enrich_pending_authorization_tasks(state.get('pending_tasks') or [], roles, state.get('execution_context') or {})\n    state['pending_tasks'] = _enrich_pending_tasks_with_object(state.get('pending_tasks') or [], prepared_object, harvested_object_ids, workflow_context)\n\n    if continuation:\n        if not backend_enrichment_present:\n            updated_task = _apply_preparation(task, roles, prepared_object, captured_surface, (state.get('execution_context') or {}).get('discovered_auth_endpoints') or discovered_auth_endpoints)\n            if not (prepared_roles and _is_auth_bootstrap_task(updated_task)):\n                state['pending_tasks'] = _upsert_task(state.get('pending_tasks') or [], updated_task)\n            state['pending_tasks'] = _enrich_pending_authorization_tasks(state.get('pending_tasks') or [], roles, state.get('execution_context') or {})\n            state['pending_tasks'] = _enrich_pending_tasks_with_object(state.get('pending_tasks') or [], prepared_object, harvested_object_ids, workflow_context)\n        if not backend_enrichment_present:\n            state['last_queue_update_reason'] = 'preparation_continued'\n    else:\n        state[\"completed_tasks\"].append(task_id)\n        verdict_name = str(verdict.get(\"verdict\") or \"rejected\")\n        if verdict_name == \"confirmed\" and verdict.get(\"finding_candidate\"):\n            state[\"confirmed_findings\"] = _append_unique_finding(state.get(\"confirmed_findings\") or [], verdict[\"finding_candidate\"])\n        elif verdict_name == \"rework\" and queue_update.get(\"requeued_task_id\"):\n            pass\n        elif verdict_name == \"rework\" and not queue_update.get(\"requeued_task_id\"):\n            state[\"rejected_findings\"].append({\n                \"task_id\": task_id,\n                \"reason\": str(queue_update.get(\"queue_update_reason\") or \"retry_limit_exceeded\"),\n            })\n        else:\n            state[\"rejected_findings\"].append({\n                \"task_id\": task_id,\n                \"reason\": str(verdict.get(\"reason\") or \"\"),\n            })\n\n    executable_pending_tasks = _has_executable_pending_tasks(state.get('pending_tasks') or [])\n    if executable_pending_tasks:\n        state[\"stop_reason\"] = \"\"\n    if queue_update.get(\"should_stop\") and not state.get(\"pending_tasks\"):\n        state[\"stop_reason\"] = state.get(\"stop_reason\") or \"no_tasks\"\n    should_exit = len(state.get(\"pending_tasks\") or []) == 0 or (bool(state.get(\"stop_reason\")) and not executable_pending_tasks)\n    return {\n        \"state_json\": json.dumps(state, ensure_ascii=False),\n        \"should_exit_loop\": should_exit,\n    }\n"
