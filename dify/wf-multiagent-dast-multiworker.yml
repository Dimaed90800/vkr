    - data:
        code: |
          import json

          SOURCE_CONFIDENCE = {
              'traffic': 0.95,
              'browser_traffic': 0.95,
              'openapi': 0.9,
              'discovery': 0.75,
              'js_analysis': 0.65,
              'passive_discovery': 0.55,
          }

          def _merge_strings(left, right):
              values = []
              seen = set()
              for item in [*(left or []), *(right or [])]:
                  value = str(item or '').strip()
                  if not value or value in seen:
                      continue
                  seen.add(value)
                  values.append(value)
              return values

          def _default_confidence(sources):
              normalized = {str(item or '').strip().lower() for item in (sources or []) if str(item or '').strip()}
              if not normalized:
                  return 0.5
              base = max(SOURCE_CONFIDENCE.get(item, 0.5) for item in normalized)
              bonus = min(0.04 * max(len(normalized) - 1, 0), 0.12)
              return min(base + bonus, 0.99)

          def main(merged_surface_json: str) -> dict:
              try:
                  surface = json.loads(merged_surface_json or '{}')
              except Exception:
                  surface = {}

              enriched = []
              for endpoint in surface.get('endpoints') or []:
                  if not isinstance(endpoint, dict):
                      continue
                  item = dict(endpoint)
                  auth = item.get('auth_signals') or {}
                  if bool(auth.get('has_auth_header')) or bool(auth.get('has_cookie_auth')):
                      item['auth_required'] = True
                      item['security_schemes'] = _merge_strings(item.get('security_schemes') or [], ['observedAuth'])
                  item['source_confidence'] = max(float(item.get('source_confidence') or 0), _default_confidence(item.get('sources') or []))
                  enriched.append(item)

              final_surface = {'endpoints': sorted(enriched, key=lambda item: (str(item.get('path') or ''), str(item.get('method') or 'GET')))}
              return {
                  'enriched_surface_json': json.dumps(final_surface, ensure_ascii=False),
                  'enriched_surface_total': len(final_surface['endpoints']),
              }
