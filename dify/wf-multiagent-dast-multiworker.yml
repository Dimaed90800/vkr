        code: "import json\n\n\ndef _fresh_scheduler_state(ctx: dict | None = None) -> dict:\n    ctx = ctx or {}\n    return {\n        \"run_id\": ctx.get(\"run_id\"),\n        \"root_trace_id\": ctx.get(\"root_trace_id\") or ctx.get(\"run_id\"),\n        \"class_budget_used\": {},\n        \"class_tasks_completed\": {},\n        \"class_retries_used\": {},\n        \"consecutive_class_count\": 0,\n        \"last_executed_class\": None,\n        \"completed_task_fingerprints\": [],\n        \"confirmed_finding_fingerprints\": [],\n        \"exploration_budget_used\": 0,\n        \"deepening_budget_used\": 0,\n        \"preparation_budget_used\": 0,\n        \"root_followup_counts\": {},\n        \"endpoint_family_attempts\": {},\n        \"strategy_retry_counts\": {},\n    }\n\n\ndef _has_runtime_progress(value: dict) -> bool:\n    if not isinstance(value, dict):\n        return False\n    return any([\n        bool(value.get(\"class_budget_used\") or {}),\n        bool(value.get(\"class_tasks_completed\") or {}),\n        bool(value.get(\"class_retries_used\") or {}),\n        int(value.get(\"consecutive_class_count\") or 0) > 0,\n        value.get(\"last_executed_class\") not in (None, \"\"),\n        bool(value.get(\"completed_task_fingerprints\") or []),\n        bool(value.get(\"confirmed_finding_fingerprints\") or []),\n    ])\n\n\ndef _sanitize_scheduler_state(planner: dict, ctx: dict) -> dict:\n    candidate = planner.get(\"scheduler_state\") or {}\n    if not isinstance(candidate, dict):\n        return _fresh_scheduler_state(ctx)\n    if _has_runtime_progress(candidate):\n        return _fresh_scheduler_state(ctx)\n    clean = _fresh_scheduler_state(ctx)\n    clean.update({\n        \"run_id\": candidate.get(\"run_id\") or clean.get(\"run_id\"),\n        \"root_trace_id\": candidate.get(\"root_trace_id\") or clean.get(\"root_trace_id\"),\n        \"class_budget_used\": candidate.get(\"class_budget_used\") or {},\n        \"class_tasks_completed\": candidate.get(\"class_tasks_completed\") or {},\n        \"class_retries_used\": candidate.get(\"class_retries_used\") or {},\n        \"consecutive_class_count\": int(candidate.get(\"consecutive_class_count\") or 0),\n        \"last_executed_class\": candidate.get(\"last_executed_class\"),\n        \"completed_task_fingerprints\": candidate.get(\"completed_task_fingerprints\") or [],\n        \"confirmed_finding_fingerprints\": candidate.get(\"confirmed_finding_fingerprints\") or [],\n        \"exploration_budget_used\": int(candidate.get(\"exploration_budget_used\") or 0),\n        \"deepening_budget_used\": int(candidate.get(\"deepening_budget_used\") or 0),\n        \"preparation_budget_used\": int(candidate.get(\"preparation_budget_used\") or 0),\n        \"root_followup_counts\": candidate.get(\"root_followup_counts\") or {},\n        \"endpoint_family_attempts\": candidate.get(\"endpoint_family_attempts\") or {},\n        \"strategy_retry_counts\": candidate.get(\"strategy_retry_counts\") or {},\n    })\n    return clean\n\n\ndef main(pending_tasks_json: str, execution_context_json: str, planner_body: str = \"\") -> dict:\n    try:\n        tasks = json.loads(pending_tasks_json or '[]')\n    except Exception:\n        tasks = []\n    try:\n        ctx = json.loads(execution_context_json or '{}')\n    except Exception:\n        ctx = {}\n    try:\n        planner = json.loads(planner_body or '{}')\n    except Exception:\n        planner = {}\n\n    state = {\n        \"pending_tasks\": tasks,\n        \"scheduler_state\": _sanitize_scheduler_state(planner, ctx),\n        \"execution_context\": ctx,\n        \"confirmed_findings\": [],\n        \"rejected_findings\": [],\n        \"evidence_records\": [],\n        \"completed_tasks\": [],\n        \"budget_used\": 0,\n        \"max_requests\": ctx.get(\"max_requests\", 100),\n        \"max_duration_sec\": ctx.get(\"max_duration_sec\", 900),\n        \"start_timestamp\": ctx.get(\"start_timestamp\"),\n        \"max_retries\": ctx.get(\"max_retries_per_task\", 1),\n        \"stop_reason\": \"\",\n        \"last_selection_reason\": \"\",\n        \"last_deferred_classes\": [],\n    }\n    return {\"seed_state_json\": json.dumps(state, ensure_ascii=False)}\n"
