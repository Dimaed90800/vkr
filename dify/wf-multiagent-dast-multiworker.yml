    - data:
        code: |
          import json
          import uuid
          from datetime import datetime, timezone
          from urllib.parse import urlparse

          def _safe_int(value: str, default: int) -> int:
              try:
                  return int(str(value or '').strip())
              except Exception:
                  return default

          def _safe_bool(value: str, default: bool) -> bool:
              normalized = str(value or '').strip().lower()
              if not normalized:
                  return default
              if normalized in {'1', 'true', 'yes', 'y', 'on'}:
                  return True
              if normalized in {'0', 'false', 'no', 'n', 'off'}:
                  return False
              return default

          def _safe_json_list(value: str, default=None):
              if default is None:
                  default = []
              raw = str(value or '').strip()
              if not raw:
                  return list(default)
              try:
                  parsed = json.loads(raw)
              except Exception:
                  return list(default)
              return parsed if isinstance(parsed, list) else list(default)

          def _default_allowed_hosts(target_url: str) -> list:
              parsed = urlparse(str(target_url or '').strip())
              host = str(parsed.netloc or '').strip()
              return [host] if host else []

          def main(
              toolbox_url: str,
              target_url: str,
              openapi_url: str = "",
              openapi_spec_text: str = "",
              roles_json: str = "",
              allowed_hosts_json: str = "",
              traffic_requests_json: str = "",
              enable_discovery: str = "",
              discovery_mode: str = "",
              zap_base_url: str = "",
              discovery_seeds_json: str = "",
              use_authenticated_discovery: str = "",
              discovery_max_depth: str = "",
              discovery_max_children: str = "",
              discovery_max_duration_sec: str = "",
              use_ajax_spider: str = "",
              max_requests: str = "",
              max_duration_sec: str = "",
              max_retries_per_task: str = "",
              user_prompt: str = "",
          ) -> dict:
              normalized_toolbox_url = str(toolbox_url or "").rstrip("/")
              normalized_target_url = str(target_url or "").rstrip("/")
              roles = _safe_json_list(roles_json, [])
              allowed_hosts = _safe_json_list(allowed_hosts_json, _default_allowed_hosts(normalized_target_url))
              if not allowed_hosts:
                  allowed_hosts = _default_allowed_hosts(normalized_target_url)
              traffic_requests = _safe_json_list(traffic_requests_json, [])
              discovery_seeds = _safe_json_list(discovery_seeds_json, [])

              discovery_enabled = _safe_bool(enable_discovery, True)
              discovery_mode_value = str(discovery_mode or 'zap').strip() or 'zap'
              zap_base_url_value = str(zap_base_url or 'http://zap:8080').strip() or 'http://zap:8080'
              use_authenticated_discovery_value = _safe_bool(use_authenticated_discovery, False)
              discovery_max_depth_value = _safe_int(discovery_max_depth, 2)
              discovery_max_children_value = _safe_int(discovery_max_children, 50)
              discovery_max_duration_sec_value = _safe_int(discovery_max_duration_sec, 30)
              use_ajax_spider_value = _safe_bool(use_ajax_spider, False)
              max_requests_value = _safe_int(max_requests, 20)
              max_duration_sec_value = _safe_int(max_duration_sec, 300)
              max_retries_value = _safe_int(max_retries_per_task, 1)
              user_prompt_value = str(user_prompt or "").strip()
              run_id = f"run-{uuid.uuid4().hex[:12]}"

              execution_context = {
                  "toolbox_url": normalized_toolbox_url,
                  "target_url": normalized_target_url,
                  "run_id": run_id,
                  "root_trace_id": run_id,
                  "openapi_url": str(openapi_url or "").strip(),
                  "openapi_spec_text": str(openapi_spec_text or ""),
                  "roles": roles,
                  "discovered_auth_endpoints": [],
                  "allowed_hosts": allowed_hosts,
                  "traffic_requests": traffic_requests,
                  "enable_discovery": discovery_enabled,
                  "discovery_mode": discovery_mode_value,
                  "zap_base_url": zap_base_url_value,
                  "discovery_seeds": discovery_seeds,
                  "use_authenticated_discovery": use_authenticated_discovery_value,
                  "discovery_max_depth": discovery_max_depth_value,
                  "discovery_max_children": discovery_max_children_value,
                  "discovery_max_duration_sec": discovery_max_duration_sec_value,
                  "use_ajax_spider": use_ajax_spider_value,
                  "max_requests": max_requests_value,
                  "max_duration_sec": max_duration_sec_value,
                  "max_retries_per_task": max_retries_value,
                  "start_timestamp": datetime.now(timezone.utc).isoformat(),
                  "user_prompt": user_prompt_value,
              }

              return {
                  "toolbox_url": normalized_toolbox_url,
