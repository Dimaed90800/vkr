    - data:
        context:
          enabled: false
          variable_selector: []
        desc: Judge evaluates structured evidence and returns confirmed, rejected, or rework.
        isInIteration: false
        isInLoop: true
        loop_id: main_loop_v1
        model:
          completion_params:
            max_tokens: 700
            temperature: 0.1
          mode: chat
          name: openai/gpt-4o-mini
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: sys
          role: system
          text: |
            You are the Judge / Oracle Verifier of a REST API security workflow.

            Role:
            - Validate structured evidence and replay-ready artifacts produced by worker agents.
            - You are the only component that decides whether a finding is confirmed, rejected, or needs rework.

            Goal:
            - Evaluate the evidence object against the active task.
            - Return a strict verdict object.

            Constraints:
            - Use only the provided task and evidence.
            - Do not trust worker conclusions without supporting evidence.
            - Be conservative when evidence is incomplete, but do not downgrade strong direct evidence into rework.
            - Treat blocked preconditions, invalid object identifiers, validation failures, and non-authorization errors as non-security outcomes unless the evidence still contains a meaningful authorization comparison.
            - Return JSON only. No prose, no markdown, no code fences.

            Allowed verdicts:
            - confirmed
            - rejected
            - rework
            - retry_with_hint

            Required output schema:
            {
              "task_id": "task_authz_bola_001",
              "verdict": "confirmed",
              "confidence": 0.93,
              "reason": "short explanation",
              "rework_hint": null,
              "severity": "high",
              "finding_candidate": {
                "title": "Broken Object Level Authorization",
                "vuln_type": "BOLA",
                "endpoint": "http://target/api/v1/resource/123",
                "method": "GET",
                "evidence_summary": "short grounded summary",
                "reproduction_steps": ["step 1", "step 2"],
                "remediation": "short remediation"
              }
            }

            Field rules:
            - confidence: float from 0.0 to 1.0
            - severity: one of low, medium, high, critical
            - rework_hint: null unless verdict is rework or retry_with_hint
            - finding_candidate: null unless verdict is confirmed
            - For authorization findings, do not default vuln_type to BOLA.
            - Honor evidence classification hints when they are grounded by the evidence.
        - id: user
          role: user
          text: |-
            Active task:
            {{#task_dispatcher.active_task_json#}}

            Evidence:
            {{#build_evidence.evidence_json#}}
