    - data:
        code: "import json\nimport re\n\nMAX_TASKS = 10\nMAX_HINTS = 10\nMAX_STR = 240\n\n\ndef _loads(value, default):\n    try:\n        parsed = json.loads(value or 'null')\n    except Exception:\n        return default\n    return parsed if parsed is not None else default\n\n\ndef _clip(value, limit=MAX_STR):\n    text = str(value or '').strip()\n    if len(text) <= limit:\n        return text\n    return text[: limit - 3] + '...'\n\n\ndef _has_auth_material(role):\n    if not isinstance(role, dict):\n        return False\n    return bool(role.get('token') or role.get('auth_headers') or role.get('cookies'))\n\n\ndef _endpoint_flags(endpoint):\n    path = str((endpoint or {}).get('path') or '').lower()\n    path_params = (endpoint or {}).get('path_params') or []\n    query_params = [str(item or '').lower() for item in ((endpoint or {}).get('query_params') or [])]\n    object_like = bool(path_params) or any(item == 'id' or item.endswith('_id') for item in query_params) or '{' in path\n    privileged = any(token in path for token in ('/admin', '/management', '/moderation', '/internal', '/staff', '/reports', '/config'))\n    versioned = bool(re.search(r'/v\\d+(?:\\.\\d+)?(?:/|$)', path))\n    return object_like, privileged, versioned\n\n\ndef _top_candidate_tasks(planner):\n    tasks = planner.get('router_candidate_queue') or planner.get('final_task_queue') or planner.get('generated_tasks') or []\n    if not isinstance(tasks, list):\n        tasks = []\n    trimmed = []\n    for task in tasks[:MAX_TASKS]:\n        if not isinstance(task, dict):\n            continue\n        trimmed.append({\n            'id': _clip(task.get('id')),\n            'class': _clip(task.get('class')),\n            'subtype': _clip(task.get('subtype')),\n            'endpoint': _clip(task.get('endpoint')),\n            'method': _clip(task.get('method'), 16),\n            'priority': int(task.get('priority') or 0),\n            'readiness': _clip(task.get('readiness'), 48),\n            'allowed_tools': [str(item or '') for item in (task.get('allowed_tools') or [])[:4]],\n            'hypothesis_family': _clip(task.get('hypothesis_family')),\n            'recommended_next_step': _clip(task.get('recommended_next_step'), 48),\n        })\n    return trimmed, len(tasks)\n\n\ndef _bootstrap_endpoints(tasks, endpoints):\n    values = []\n    seen = set()\n    for task in tasks or []:\n        if not isinstance(task, dict):\n            continue\n        endpoint = _clip(task.get('endpoint'))\n        subtype = str(task.get('subtype') or '').lower()\n        if endpoint and (subtype == 'auth_bootstrap' or any(token in endpoint.lower() for token in ('login', 'signup', 'register', 'signin', 'password', 'otp', 'token'))):\n            if endpoint not in seen:\n                seen.add(endpoint)\n                values.append(endpoint)\n        if len(values) >= MAX_HINTS:\n            return values\n    for endpoint in endpoints or []:\n        if not isinstance(endpoint, dict):\n            continue\n        path = _clip(endpoint.get('path'))\n        if path and any(token in path.lower() for token in ('login', 'signup', 'register', 'signin', 'password', 'otp', 'token')):\n            if path not in seen:\n                seen.add(path)\n                values.append(path)\n        if len(values) >= MAX_HINTS:\n            break\n    return values\n\n\ndef _versioned_paths(endpoints):\n    values = []\n    seen = set()\n    for endpoint in endpoints or []:\n        if not isinstance(endpoint, dict):\n            continue\n        path = _clip(endpoint.get('path'))\n        if not path or path in seen:\n            continue\n        _, _, versioned = _endpoint_flags(endpoint)\n        if versioned:\n            seen.add(path)\n            values.append(path)\n        if len(values) >= MAX_HINTS:\n            break\n    return values\n\n\ndef _high_conf_sources(endpoints):\n    values = []\n    seen = set()\n    for endpoint in endpoints or []:\n        if not isinstance(endpoint, dict):\n            continue\n        if float(endpoint.get('source_confidence') or 0.0) < 0.8:\n            continue\n        for source in (endpoint.get('sources') or []):\n            value = str(source or '').strip()\n            if value and value not in seen:\n                seen.add(value)\n                values.append(value)\n            if len(values) >= MAX_HINTS:\n                return values\n    return values\n\n\ndef main(execution_context_json: str, normalized_surface_json: str, planner_body: str) -> dict:\n    execution_context = _loads(execution_context_json, {})\n    surface = _loads(normalized_surface_json, {'endpoints': []})\n    planner = _loads(planner_body, {})\n\n    planner_surface = planner.get('normalized_surface') or {}\n    if isinstance(planner_surface, dict) and planner_surface.get('endpoints'):\n        surface = planner_surface\n    endpoints = surface.get('endpoints') or []\n    if not isinstance(endpoints, list):\n        endpoints = []\n\n    total_endpoints = 0\n    auth_required_endpoints = 0\n    object_like_endpoints = 0\n    privileged_endpoints = 0\n    for endpoint in endpoints:\n        if not isinstance(endpoint, dict):\n            continue\n        total_endpoints += 1\n        if bool(endpoint.get('auth_required')):\n            auth_required_endpoints += 1\n        object_like, privileged, _ = _endpoint_flags(endpoint)\n        if object_like:\n            object_like_endpoints += 1\n        if privileged:\n            privileged_endpoints += 1\n\n    top_tasks, source_task_count = _top_candidate_tasks(planner)\n    roles = execution_context.get('roles') or []\n    roles_summary = []\n    for role in roles[:MAX_HINTS]:\n        if not isinstance(role, dict):\n            continue\n        roles_summary.append({\n            'name': _clip(role.get('name') or role.get('role'), 64),\n            'has_auth_material': _has_auth_material(role),\n        })\n\n    summary = {\n        'target_url': _clip(execution_context.get('target_url'), 500),\n        'user_prompt': _clip(execution_context.get('user_prompt'), 500),\n        'capabilities': execution_context.get('capabilities') if isinstance(execution_context.get('capabilities'), dict) else {},\n        'roles_summary': roles_summary,\n        'surface_counts': {\n            'total_endpoints': total_endpoints,\n            'auth_required_endpoints': auth_required_endpoints,\n            'object_like_endpoints': object_like_endpoints,\n            'privileged_endpoints': privileged_endpoints,\n        },\n        'planner_summary': _clip(planner.get('planner_summary'), 500),\n        'planner_stats': {\n            'generated_total': int(((planner.get('stats') or {}).get('generated_total') or 0)),\n            'returned_total': int(((planner.get('stats') or {}).get('returned_total') or 0)),\n            'router_candidate_total': int(((planner.get('stats') or {}).get('router_candidate_total') or 0)),\n        },\n        'planner_metadata': {\n            'filtered_duplicates': int(((planner.get('metadata') or {}).get('filtered_duplicates') or 0)),\n            'filtered_inactive': int(((planner.get('metadata') or {}).get('filtered_inactive') or 0)),\n            'filtered_requires_enrichment': int(((planner.get('metadata') or {}).get('filtered_requires_enrichment') or 0)),\n            'capabilities': ((planner.get('metadata') or {}).get('capabilities') if isinstance((planner.get('metadata') or {}).get('capabilities'), dict) else {}),\n        },\n        'top_candidate_tasks': top_tasks,\n        'top_recon_hints': {\n            'bootstrap_endpoints': _bootstrap_endpoints(planner.get('router_candidate_queue') or planner.get('final_task_queue') or planner.get('generated_tasks') or [], endpoints)[:MAX_HINTS],\n            'versioned_paths': _versioned_paths(endpoints)[:MAX_HINTS],\n            'high_confidence_sources': _high_conf_sources(endpoints)[:MAX_HINTS],\n        },\n        'summary_debug': {\n            'source_task_count': source_task_count,\n            'source_endpoint_count': total_endpoints,\n        },\n    }\n    return {\n        'router_context_summary_json': json.dumps(summary, ensure_ascii=False)\n    }\n"
