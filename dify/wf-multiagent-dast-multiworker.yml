        code: "import json\n\ndef _merge_strings(left, right):\n    values = []\n    seen = set()\n    for item in [*(left or []), *(right or [])]:\n        value = str(item or '').strip()\n        if not value or value in seen:\n            continue\n        seen.add(value)\n        values.append(value)\n    return values\n\ndef main(merged_surface_json: str) -> dict:\n    try:\n        surface = json.loads(merged_surface_json or '{}')\n    except Exception:\n        surface = {}\n\n    enriched = []\n    for endpoint in surface.get('endpoints') or []:\n        if not isinstance(endpoint, dict):\n            continue\n        item = dict(endpoint)\n        auth = item.get('auth_signals') or {}\n        if bool(auth.get('has_auth_header')) or bool(auth.get('has_cookie_auth')):\n            item['auth_required'] = True\n            item['security_schemes'] = _merge_strings(item.get('security_schemes') or [], ['observedAuth'])\n        if not item.get('source_confidence'):\n            sources = {str(source or '').strip().lower() for source in item.get('sources') or []}\n            if 'traffic' in sources:\n                item['source_confidence'] = 0.95\n            elif 'openapi' in sources:\n                item['source_confidence'] = 0.9\n            elif 'discovery' in sources:\n                item['source_confidence'] = 0.75\n            else:\n                item['source_confidence'] = 0.5\n        enriched.append(item)\n\n    final_surface = {'endpoints': sorted(enriched, key=lambda item: (str(item.get('path') or ''), str(item.get('method') or 'GET')))}\n    return {\n        'enriched_surface_json': json.dumps(final_surface, ensure_ascii=False),\n        'enriched_surface_total': len(final_surface['endpoints']),\n    }\n"
