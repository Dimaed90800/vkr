    - data:
        code: |
          import json

          def _empty_payload() -> dict:
              return {
                  'authorization': {
                      'candidate_targets': [],
                      'likely_subtypes': [],
                      'missing_prerequisites': [],
                      'candidate_bootstrap_endpoints': {'register': [], 'login': [], 'profile': [], 'create_resource': []},
                      'preparation_suggestions': [],
                      'priority_hint': 0.0,
                      'confidence': 0.0,
                  },
                  'injection': {
                      'candidate_targets': [],
                      'likely_subtypes': [],
                      'missing_prerequisites': [],
                      'candidate_bootstrap_endpoints': {'shape_probe': [], 'reflection_probe': [], 'path_probe': []},
                      'preparation_suggestions': [],
                      'priority_hint': 0.0,
                      'confidence': 0.0,
                  },
                  'business_logic': {
                      'candidate_targets': [],
                      'likely_subtypes': [],
                      'missing_prerequisites': [],
                      'candidate_bootstrap_endpoints': {'workflow_roots': [], 'create': [], 'transition': []},
                      'preparation_suggestions': [],
                      'priority_hint': 0.0,
                      'confidence': 0.0,
                  },
                  'global_notes': [],
                  'global_priority_order': [],
              }

          def _normalize_list(value):
              return [str(item or '').strip() for item in (value or []) if str(item or '').strip()]

          def _normalize_float(value):
              try:
                  numeric = float(value)
              except Exception:
                  return 0.0
              return max(0.0, min(1.0, numeric))

          def _normalize_section(section_name, payload):
              section = payload.get(section_name) or {}
              if not isinstance(section, dict):
                  section = {}
              result = _empty_payload()[section_name]
              result['candidate_targets'] = _normalize_list(section.get('candidate_targets'))
              result['likely_subtypes'] = _normalize_list(section.get('likely_subtypes'))
              result['missing_prerequisites'] = _normalize_list(section.get('missing_prerequisites'))
              result['preparation_suggestions'] = _normalize_list(section.get('preparation_suggestions'))
              result['priority_hint'] = _normalize_float(section.get('priority_hint'))
              result['confidence'] = _normalize_float(section.get('confidence'))
              candidate_bootstrap = section.get('candidate_bootstrap_endpoints') or {}
              if not isinstance(candidate_bootstrap, dict):
                  candidate_bootstrap = {}
              for key in result['candidate_bootstrap_endpoints'].keys():
                  result['candidate_bootstrap_endpoints'][key] = _normalize_list(candidate_bootstrap.get(key))
              return result

          def main(text: str) -> dict:
              try:
                  payload = json.loads(text or '{}')
              except Exception:
                  payload = {}
              normalized = _empty_payload()
              normalized['authorization'] = _normalize_section('authorization', payload)
              normalized['injection'] = _normalize_section('injection', payload)
              normalized['business_logic'] = _normalize_section('business_logic', payload)
              normalized['global_notes'] = _normalize_list(payload.get('global_notes'))
              normalized['global_priority_order'] = _normalize_list(payload.get('global_priority_order'))
              return {
                  'synthesized_security_context_json': json.dumps(normalized, ensure_ascii=False)
              }
