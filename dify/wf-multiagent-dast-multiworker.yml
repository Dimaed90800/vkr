    - data:
        code: "import json\n\nSOURCE_CONFIDENCE = {\n    'traffic': 0.95,\n    'browser_traffic': 0.95,\n    'openapi': 0.9,\n    'discovery': 0.75,\n    'js_analysis': 0.65,\n    'passive_discovery': 0.55,\n}\n\ndef _merge_strings(left, right):\n    values = []\n    seen = set()\n    for item in [*(left or []), *(right or [])]:\n        value = str(item or '').strip()\n        if not value or value in seen:\n            continue\n        seen.add(value)\n        values.append(value)\n    return values\n\ndef _default_confidence(sources):\n    normalized = {str(item or '').strip().lower() for item in (sources or []) if str(item or '').strip()}\n    if not normalized:\n        return 0.5\n    base = max(SOURCE_CONFIDENCE.get(item, 0.5) for item in normalized)\n    bonus = min(0.04 * max(len(normalized) - 1, 0), 0.12)\n    return min(base + bonus, 0.99)\n\ndef main(merged_surface_json: str) -> dict:\n    try:\n        surface = json.loads(merged_surface_json or '{}')\n    except Exception:\n        surface = {}\n\n    enriched = []\n    for endpoint in surface.get('endpoints') or []:\n        if not isinstance(endpoint, dict):\n            continue\n        item = dict(endpoint)\n        auth = item.get('auth_signals') or {}\n        if bool(auth.get('has_auth_header')) or bool(auth.get('has_cookie_auth')):\n            item['auth_required'] = True\n            item['security_schemes'] = _merge_strings(item.get('security_schemes') or [], ['observedAuth'])\n        item['source_confidence'] = max(float(item.get('source_confidence') or 0), _default_confidence(item.get('sources') or []))\n        enriched.append(item)\n\n    final_surface = {'endpoints': sorted(enriched, key=lambda item: (str(item.get('path') or ''), str(item.get('method') or 'GET')))}\n    return {\n        'enriched_surface_json': json.dumps(final_surface, ensure_ascii=False),\n        'enriched_surface_total': len(final_surface['endpoints']),\n    }\n"
