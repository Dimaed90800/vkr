    - data:
        code: "import json\n\ndef _strip_code_fences(text):\n    value = str(text or \"\").strip()\n    if value.startswith(\"```\"):\n        lines = value.splitlines()\n        if lines and lines[0].startswith(\"```\"):\n            lines = lines[1:]\n        if lines and lines[-1].strip() == \"```\":\n            lines = lines[:-1]\n        value = \"\\n\".join(lines).strip()\n    return value\n\ndef _is_guessed_object_id(value):\n    normalized = str(value or '').strip().lower()\n    return normalized in {'1', '123', 'test', 'sample', 'example', 'demo', 'foo', 'bar'}\n\ndef _extract_placeholders(endpoint):\n    placeholders = []\n    current = \"\"\n    in_placeholder = False\n    for char in str(endpoint or \"\"):\n        if char == \"{\":\n            current = \"\"\n            in_placeholder = True\n        elif char == \"}\":\n            if current:\n                placeholders.append(current)\n            in_placeholder = False\n        elif in_placeholder:\n            current += char\n    return placeholders\n\ndef _materialize_endpoint(endpoint, object_id):\n    endpoint_value = str(endpoint or \"\")\n    if object_id in (None, \"\"):\n        return endpoint_value\n    for placeholder in _extract_placeholders(endpoint_value):\n        endpoint_value = endpoint_value.replace(\"{\" + placeholder + \"}\", str(object_id))\n    return endpoint_value\n\ndef main(task_class: str, auth_text: str = \"\", injection_text: str = \"\", business_text: str = \"\", active_task_json: str = \"\") -> dict:\n    chosen = auth_text\n    if str(task_class or \"\").lower() == \"injection\":\n        chosen = injection_text\n    elif str(task_class or \"\").lower() == \"business_logic\":\n        chosen = business_text\n\n    try:\n        payload = json.loads(_strip_code_fences(chosen) or '{}')\n    except Exception:\n        payload = {}\n\n    try:\n        active_task = json.loads(active_task_json or '{}')\n    except Exception:\n        active_task = {}\n\n    arguments = payload.get('arguments') or {}\n    if not isinstance(arguments, dict):\n        arguments = {}\n\n    params = active_task.get(\"params\") or {}\n    if not isinstance(params, dict):\n        params = {}\n\n    selected_object_id = params.get(\"selected_object_id\")\n    candidate_ids = params.get(\"object_id_candidates\") or []\n    if not isinstance(candidate_ids, list):\n        candidate_ids = []\n    if not selected_object_id and candidate_ids:\n        selected_object_id = candidate_ids[0]\n\n    selected_class = str(task_class or 'authorization').lower()\n    default_tool = 'auth_test_access'\n    default_endpoint = '/v1/auth/test-access'\n    if selected_class == 'injection':\n        default_tool = 'injection_test'\n        default_endpoint = '/v1/injection/test'\n    elif selected_class == 'business_logic':\n        default_tool = 'logic_test'\n        default_endpoint = '/v1/logic/test'\n\n    tool_name = str(payload.get('tool_name') or default_tool)\n    if selected_class == 'authorization':\n        chosen_object_id = arguments.get(\"object_id\") or selected_object_id\n        if _is_guessed_object_id(chosen_object_id) and selected_object_id:\n            chosen_object_id = selected_object_id\n        if chosen_object_id:\n            arguments[\"object_id\"] = chosen_object_id\n\n        task_endpoint = str(active_task.get(\"endpoint\") or \"\")\n        worker_endpoint = str(arguments.get(\"endpoint\") or task_endpoint)\n        if _extract_placeholders(task_endpoint):\n            worker_endpoint = task_endpoint\n        arguments[\"endpoint\"] = _materialize_endpoint(worker_endpoint, chosen_object_id)\n\n    return {\n        \"tool_name\": tool_name,\n        \"tool_endpoint\": default_endpoint,\n        \"tool_arguments_json\": json.dumps(arguments, ensure_ascii=False),\n        \"worker_hypothesis\": str(payload.get('worker_hypothesis') or active_task.get('hypothesis') or ''),\n        \"reasoning_summary\": str(payload.get('reasoning_summary') or ''),\n    }\n"
