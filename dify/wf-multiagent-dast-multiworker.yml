    - data:
        code: "import json\nimport uuid\nfrom datetime import datetime, timezone\nfrom urllib.parse import urlparse\n\ndef _safe_int(value: str, default: int) -> int:\n    try:\n        return int(str(value or '').strip())\n    except Exception:\n        return default\n\ndef _safe_bool(value: str, default: bool) -> bool:\n    normalized = str(value or '').strip().lower()\n    if not normalized:\n        return default\n    if normalized in {'1', 'true', 'yes', 'y', 'on'}:\n        return True\n    if normalized in {'0', 'false', 'no', 'n', 'off'}:\n        return False\n    return default\n\ndef _safe_json_list(value: str, default=None):\n    if default is None:\n        default = []\n    raw = str(value or '').strip()\n    if not raw:\n        return list(default)\n    try:\n        parsed = json.loads(raw)\n    except Exception:\n        return list(default)\n    return parsed if isinstance(parsed, list) else list(default)\n\ndef _default_allowed_hosts(target_url: str) -> list:\n    parsed = urlparse(str(target_url or '').strip())\n    host = str(parsed.netloc or '').strip()\n    return [host] if host else []\n\ndef main(\n    toolbox_url: str,\n    target_url: str,\n    openapi_url: str = \"\",\n    openapi_spec_text: str = \"\",\n    roles_json: str = \"\",\n    allowed_hosts_json: str = \"\",\n    traffic_requests_json: str = \"\",\n    enable_discovery: str = \"\",\n    discovery_mode: str = \"\",\n    zap_base_url: str = \"\",\n    discovery_seeds_json: str = \"\",\n    use_authenticated_discovery: str = \"\",\n    discovery_max_depth: str = \"\",\n    discovery_max_children: str = \"\",\n    discovery_max_duration_sec: str = \"\",\n    use_ajax_spider: str = \"\",\n    max_requests: str = \"\",\n    max_duration_sec: str = \"\",\n    max_retries_per_task: str = \"\",\n    user_prompt: str = \"\",\n) -> dict:\n    normalized_toolbox_url = str(toolbox_url or \"\").rstrip(\"/\")\n    normalized_target_url = str(target_url or \"\").rstrip(\"/\")\n    roles = _safe_json_list(roles_json, [])\n    allowed_hosts = _safe_json_list(allowed_hosts_json, _default_allowed_hosts(normalized_target_url))\n    if not allowed_hosts:\n        allowed_hosts = _default_allowed_hosts(normalized_target_url)\n    traffic_requests = _safe_json_list(traffic_requests_json, [])\n    discovery_seeds = _safe_json_list(discovery_seeds_json, [])\n\n    discovery_enabled = _safe_bool(enable_discovery, True)\n    discovery_mode_value = str(discovery_mode or 'zap').strip() or 'zap'\n    zap_base_url_value = str(zap_base_url or 'http://zap:8080').strip() or 'http://zap:8080'\n    use_authenticated_discovery_value = _safe_bool(use_authenticated_discovery, False)\n    discovery_max_depth_value = _safe_int(discovery_max_depth, 2)\n    discovery_max_children_value = _safe_int(discovery_max_children, 50)\n    discovery_max_duration_sec_value = _safe_int(discovery_max_duration_sec, 30)\n    use_ajax_spider_value = _safe_bool(use_ajax_spider, False)\n    max_requests_value = _safe_int(max_requests, 20)\n    max_duration_sec_value = _safe_int(max_duration_sec, 300)\n    max_retries_value = _safe_int(max_retries_per_task, 1)\n    user_prompt_value = str(user_prompt or \"\").strip()\n    run_id = f\"run-{uuid.uuid4().hex[:12]}\"\n\n    execution_context = {\n        \"toolbox_url\": normalized_toolbox_url,\n        \"target_url\": normalized_target_url,\n        \"run_id\": run_id,\n        \"root_trace_id\": run_id,\n        \"openapi_url\": str(openapi_url or \"\").strip(),\n        \"openapi_spec_text\": str(openapi_spec_text or \"\"),\n        \"roles\": roles,\n        \"discovered_auth_endpoints\": [],\n        \"allowed_hosts\": allowed_hosts,\n        \"traffic_requests\": traffic_requests,\n        \"enable_discovery\": discovery_enabled,\n        \"discovery_mode\": discovery_mode_value,\n        \"zap_base_url\": zap_base_url_value,\n        \"discovery_seeds\": discovery_seeds,\n        \"use_authenticated_discovery\": use_authenticated_discovery_value,\n        \"discovery_max_depth\": discovery_max_depth_value,\n        \"discovery_max_children\": discovery_max_children_value,\n        \"discovery_max_duration_sec\": discovery_max_duration_sec_value,\n        \"use_ajax_spider\": use_ajax_spider_value,\n        \"max_requests\": max_requests_value,\n        \"max_duration_sec\": max_duration_sec_value,\n        \"max_retries_per_task\": max_retries_value,\n        \"start_timestamp\": datetime.now(timezone.utc).isoformat(),\n        \"user_prompt\": user_prompt_value,\n    }\n\n    return {\n        \"toolbox_url\": normalized_toolbox_url,\n        \"target_url\": normalized_target_url,\n        \"openapi_url\": execution_context[\"openapi_url\"],\n        \"openapi_spec_text\": execution_context[\"openapi_spec_text\"],\n        \"roles_json\": json.dumps(roles, ensure_ascii=False),\n        \"allowed_hosts_json\": json.dumps(allowed_hosts, ensure_ascii=False),\n        \"traffic_requests_json\": json.dumps(traffic_requests, ensure_ascii=False),\n        \"enable_discovery\": discovery_enabled,\n        \"discovery_mode\": discovery_mode_value,\n        \"zap_base_url\": zap_base_url_value,\n        \"discovery_seeds_json\": json.dumps(discovery_seeds, ensure_ascii=False),\n        \"use_authenticated_discovery\": use_authenticated_discovery_value,\n        \"discovery_max_depth\": discovery_max_depth_value,\n        \"discovery_max_children\": discovery_max_children_value,\n        \"discovery_max_duration_sec\": discovery_max_duration_sec_value,\n        \"use_ajax_spider\": use_ajax_spider_value,\n        \"max_requests\": max_requests_value,\n        \"max_duration_sec\": max_duration_sec_value,\n        \"max_retries_per_task\": max_retries_value,\n        \"execution_context_json\": json.dumps(execution_context, ensure_ascii=False),\n    }\n"
