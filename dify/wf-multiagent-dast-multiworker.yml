    - data:
        code: "import json\n\nMAX_ENDPOINTS = 20\nMAX_GENERATED_TASKS = 20\n\n\ndef _clip(value, limit: int = 200) -> str:\n    text = str(value or '').strip()\n    if len(text) <= limit:\n        return text\n    return text[: limit - 3] + '...'\n\n\ndef _compact_endpoint(endpoint: dict) -> dict:\n    return {\n        'path': _clip(endpoint.get('path'), 180),\n        'method': _clip(endpoint.get('method'), 16),\n        'auth_required': bool(endpoint.get('auth_required')),\n        'path_params': list(endpoint.get('path_params') or [])[:6],\n        'query_params': list(endpoint.get('query_params') or [])[:8],\n        'body_fields': list(endpoint.get('body_fields') or [])[:10],\n        'tags': list(endpoint.get('tags') or [])[:5],\n        'source_confidence': float(endpoint.get('source_confidence') or 0.0),\n    }\n\n\ndef _compact_task(task: dict) -> dict:\n    return {\n        'id': _clip(task.get('id'), 96),\n        'class': _clip(task.get('class'), 48),\n        'subtype': _clip(task.get('subtype'), 48),\n        'endpoint': _clip(task.get('endpoint'), 180),\n        'method': _clip(task.get('method'), 16),\n        'priority': int(task.get('priority') or 0),\n        'readiness': _clip(task.get('readiness'), 32),\n        'hypothesis_family': _clip(task.get('hypothesis_family'), 64),\n    }\n\n\ndef main(body: str) -> dict:\n    try:\n        payload = json.loads(body or '{}')\n    except Exception:\n        payload = {}\n\n    normalized_surface = payload.get('normalized_surface') or {'endpoints': []}\n    generated_tasks = payload.get('generated_tasks') or []\n    endpoints = normalized_surface.get('endpoints') or []\n    if not isinstance(endpoints, list):\n        endpoints = []\n    if not isinstance(generated_tasks, list):\n        generated_tasks = []\n\n    recon_summary = {\n        'target_url': _clip(payload.get('target_url'), 300),\n        'planner_mode': _clip((payload.get('raw_metadata') or {}).get('planner_mode'), 32),\n        'surface_counts': {\n            'total_endpoints': len(endpoints),\n            'auth_required_endpoints': sum(1 for item in endpoints if isinstance(item, dict) and item.get('auth_required')),\n        },\n        'top_endpoints': [_compact_endpoint(item) for item in endpoints[:MAX_ENDPOINTS] if isinstance(item, dict)],\n        'generated_tasks_total': len(generated_tasks),\n        'top_generated_tasks': [_compact_task(item) for item in generated_tasks[:MAX_GENERATED_TASKS] if isinstance(item, dict)],\n    }\n\n    return {\n        'recon_body_json': json.dumps(recon_summary, ensure_ascii=False),\n        'normalized_surface_json': json.dumps(normalized_surface, ensure_ascii=False),\n        'generated_tasks_json': json.dumps(generated_tasks, ensure_ascii=False),\n    }\n"
