        code: |
          import json


          def _fresh_scheduler_state(ctx: dict | None = None) -> dict:
              ctx = ctx or {}
              return {
                  "run_id": ctx.get("run_id"),
                  "root_trace_id": ctx.get("root_trace_id") or ctx.get("run_id"),
                  "class_budget_used": {},
                  "class_tasks_completed": {},
                  "class_retries_used": {},
                  "consecutive_class_count": 0,
                  "last_executed_class": None,
                  "completed_task_fingerprints": [],
                  "confirmed_finding_fingerprints": [],
                  "exploration_budget_used": 0,
                  "deepening_budget_used": 0,
                  "preparation_budget_used": 0,
                  "root_followup_counts": {},
                  "endpoint_family_attempts": {},
                  "strategy_retry_counts": {},
              }


          def _has_runtime_progress(value: dict) -> bool:
              if not isinstance(value, dict):
                  return False
              return any([
                  bool(value.get("class_budget_used") or {}),
                  bool(value.get("class_tasks_completed") or {}),
                  bool(value.get("class_retries_used") or {}),
                  int(value.get("consecutive_class_count") or 0) > 0,
                  value.get("last_executed_class") not in (None, ""),
                  bool(value.get("completed_task_fingerprints") or []),
                  bool(value.get("confirmed_finding_fingerprints") or []),
              ])


          def _sanitize_scheduler_state(planner: dict, ctx: dict) -> dict:
              candidate = planner.get("scheduler_state") or {}
              if not isinstance(candidate, dict):
                  return _fresh_scheduler_state(ctx)
              if _has_runtime_progress(candidate):
                  return _fresh_scheduler_state(ctx)
              clean = _fresh_scheduler_state(ctx)
              clean.update({
                  "run_id": candidate.get("run_id") or clean.get("run_id"),
                  "root_trace_id": candidate.get("root_trace_id") or clean.get("root_trace_id"),
                  "class_budget_used": candidate.get("class_budget_used") or {},
                  "class_tasks_completed": candidate.get("class_tasks_completed") or {},
                  "class_retries_used": candidate.get("class_retries_used") or {},
                  "consecutive_class_count": int(candidate.get("consecutive_class_count") or 0),
                  "last_executed_class": candidate.get("last_executed_class"),
                  "completed_task_fingerprints": candidate.get("completed_task_fingerprints") or [],
                  "confirmed_finding_fingerprints": candidate.get("confirmed_finding_fingerprints") or [],
                  "exploration_budget_used": int(candidate.get("exploration_budget_used") or 0),
                  "deepening_budget_used": int(candidate.get("deepening_budget_used") or 0),
                  "preparation_budget_used": int(candidate.get("preparation_budget_used") or 0),
                  "root_followup_counts": candidate.get("root_followup_counts") or {},
                  "endpoint_family_attempts": candidate.get("endpoint_family_attempts") or {},
                  "strategy_retry_counts": candidate.get("strategy_retry_counts") or {},
              })
              return clean


          def main(pending_tasks_json: str, execution_context_json: str, planner_body: str = "") -> dict:
              try:
                  tasks = json.loads(pending_tasks_json or '[]')
              except Exception:
                  tasks = []
              try:
                  ctx = json.loads(execution_context_json or '{}')
              except Exception:
                  ctx = {}
              try:
                  planner = json.loads(planner_body or '{}')
              except Exception:
                  planner = {}

              state = {
                  "pending_tasks": tasks,
                  "scheduler_state": _sanitize_scheduler_state(planner, ctx),
                  "execution_context": ctx,
                  "confirmed_findings": [],
                  "rejected_findings": [],
                  "evidence_records": [],
                  "completed_tasks": [],
                  "budget_used": 0,
                  "max_requests": ctx.get("max_requests", 100),
                  "max_duration_sec": ctx.get("max_duration_sec", 900),
                  "start_timestamp": ctx.get("start_timestamp"),
                  "max_retries": ctx.get("max_retries_per_task", 1),
                  "stop_reason": "",
                  "last_selection_reason": "",
                  "last_deferred_classes": [],
              }
              return {"seed_state_json": json.dumps(state, ensure_ascii=False)}
