    - data:
        code: |
          import json
          from datetime import datetime, timezone
          from hashlib import sha1

          STRONG_INJECTION_INDICATORS = {
              'sql_error_signal',
              'template_error_signal',
              'command_error_signal',
              'parser_error_signal',
              'unescaped_reflection',
              'significant_time_anomaly',
          }

          WEAK_GATED_CLASSES = {
              'excessive_data_exposure',
              'injection',
              'property_level_authorization',
              'mass_assignment',
              'workflow_abuse',
              'security_misconfiguration',
              'improper_assets_management',
          }

          PARSER_VALIDATION_INDICATORS = {
              'parser_validation_error',
              'invalid_template_for_worker',
          }


          def _emit(run_id: str, component: str, event_type: str, payload: dict):
              record = {
                  'timestamp': datetime.now(timezone.utc).isoformat(),
                  'event_type': event_type,
                  'component': component,
                  'run_id': str(run_id or '').strip(),
                  **payload,
              }
              try:
                  print('[diag-event]', json.dumps(record, ensure_ascii=False))
              except Exception:
                  pass


          def _title_for(classification: str) -> str:
              value = str(classification or '').strip().lower()
              mapping = {
                  'bola': 'Broken Object Level Authorization',
                  'horizontal_privilege': 'Horizontal Privilege Escalation',
                  'vertical_privilege': 'Vertical Privilege Escalation',
                  'generic_access_control': 'Generic Access Control Weakness',
                  'property_level_authorization': 'Broken Object Property Level Authorization',
                  'mass_assignment': 'Mass Assignment',
                  'function_level_authorization': 'Broken Function Level Authorization',
                  'excessive_data_exposure': 'Excessive Data Exposure',
                  'unrestricted_resource_consumption': 'Unrestricted Resource Consumption',
                  'security_misconfiguration': 'Security Misconfiguration',
                  'improper_assets_management': 'Improper Assets Management',
                  'workflow_abuse': 'Workflow Abuse',
                  'injection': 'Injection Weakness',
              }
              return mapping.get(value, 'Security Weakness')


          def _label_for(classification: str) -> str:
              value = str(classification or '').strip().lower()
              mapping = {
                  'bola': 'BOLA',
                  'horizontal_privilege': 'HORIZONTAL_PRIVILEGE_ESCALATION',
                  'vertical_privilege': 'VERTICAL_PRIVILEGE_ESCALATION',
                  'generic_access_control': 'GENERIC_ACCESS_CONTROL',
                  'property_level_authorization': 'PROPERTY_LEVEL_AUTHORIZATION',
                  'mass_assignment': 'MASS_ASSIGNMENT',
                  'function_level_authorization': 'FUNCTION_LEVEL_AUTHORIZATION',
                  'excessive_data_exposure': 'EXCESSIVE_DATA_EXPOSURE',
                  'unrestricted_resource_consumption': 'UNRESTRICTED_RESOURCE_CONSUMPTION',
                  'security_misconfiguration': 'SECURITY_MISCONFIGURATION',
                  'improper_assets_management': 'IMPROPER_ASSETS_MANAGEMENT',
                  'workflow_abuse': 'WORKFLOW_ABUSE',
                  'injection': 'INJECTION',
              }
              return mapping.get(value, 'SECURITY_WEAKNESS')


          def _indicators(evidence: dict) -> set:
              return {str(item or '').strip() for item in (evidence.get('indicators') or []) if str(item or '').strip()}


          def _response_summary(evidence: dict) -> dict:
              value = evidence.get('response_summary') or {}
              return value if isinstance(value, dict) else {}


          def _signal_strength(classification: str, evidence: dict) -> str:
              summary = _response_summary(evidence)
              indicators = _indicators(evidence)
              evidence_strength = str(summary.get('evidence_strength') or '').strip().lower()

              if classification == 'injection':
                  if STRONG_INJECTION_INDICATORS.intersection(indicators) or evidence_strength == 'strong':
                      return 'strong'
                  if evidence_strength == 'medium' or 'reflection_detected' in indicators or 'significant_behavior_change' in indicators:
                      return 'medium'
                  return 'weak'

              if classification == 'excessive_data_exposure':
                  if str(summary.get('weak_signal_class') or '').strip().lower() in {'schema_disclosure', 'verbose_validation_leak'}:
                      return 'weak'
                  if evidence_strength == 'strong':
                      return 'strong'
                  if evidence_strength == 'medium':
                      return 'medium'
                  if 'cross_role_data_exposure' in indicators and (summary.get('sample_exposed_fields') or {}):
                      return 'strong'
                  if (summary.get('nested_sensitive_keys_found') or []) and (summary.get('sample_exposed_fields') or {}):
                      return 'strong'
                  if (summary.get('sensitive_keys_found') or []) and (summary.get('sample_exposed_fields') or {}):
                      return 'medium'
                  return 'weak'

              if classification in {'property_level_authorization', 'mass_assignment'}:
                  persisted = summary.get('persisted_fields') or []
                  accepted = summary.get('accepted_fields') or []
                  reflected = summary.get('reflected_fields') or []
                  if persisted:
                      return 'strong'
                  if accepted and reflected:
                      return 'medium'
                  return 'weak'

              if classification == 'workflow_abuse':
                  violated = summary.get('violated_invariant_summary') or {}
                  if any(bool(violated.get(key)) for key in ('invalid_transition_accepted', 'repeated_sensitive_action_allowed', 'cross_role_workflow_access')) and str(summary.get('evidence_strength') or '').strip().lower() == 'strong':
                      return 'strong'
                  if any(bool(violated.get(key)) for key in ('invalid_transition_accepted', 'repeated_sensitive_action_allowed', 'cross_role_workflow_access')):
                      return 'medium'
                  if bool((summary.get('state_delta_summary') or {}).get('state_changed')):
                      return 'medium'
                  return 'weak'

              if classification == 'security_misconfiguration':
                  if evidence_strength == 'strong' or {'weak_cors', 'internal_url_leak', 'stack_trace_detected'}.intersection(indicators):
                      return 'strong'
                  if evidence_strength == 'medium' or 'debug_header_exposed' in indicators:
                      return 'medium'
                  return 'weak'

              if classification == 'improper_assets_management':
                  if evidence_strength == 'strong':
                      return 'strong'
                  if evidence_strength == 'medium' or 'deprecated_exposed_path_detected' in indicators:
                      return 'medium'
                  return 'weak'

              return 'strong'


          def _deterministic_rework_hint(classification: str) -> str | None:
              hints = {
                  'excessive_data_exposure': 'Retry with authenticated success-path response and inspect returned object fields.',
                  'injection': 'Retry with alternate payload family and verify sink/error/reflection signals.',
                  'property_level_authorization': 'Re-read the object to verify whether the sensitive field persisted.',
                  'mass_assignment': 'Re-read the object to verify whether the sensitive field persisted.',
                  'workflow_abuse': 'Prepare object state first, then retry invalid transition or repeated action.',
                  'security_misconfiguration': 'Retry against the same endpoint with bounded method, header, and CORS checks.',
                  'improper_assets_management': 'Retry alternate version paths and compare auth behavior or sensitive functionality exposure.',
                  'parser_validation_error': 'Retry after aligning the worker template with parse_worker_command for the assigned worker and allowed tool.',
              }
              return hints.get(classification)


          def _is_noop_task(active_task: dict) -> bool:
              return str(active_task.get('id') or '') == '__no_task__' or str(active_task.get('subtype') or '').strip().lower() == 'noop'


          def _apply_threshold(payload: dict, active_task: dict, evidence: dict, classification: str):
              if _is_noop_task(active_task):
                  payload['verdict'] = 'rejected'
                  payload['reason'] = 'No active runnable task was selected; this is a scheduler stop marker, not a vulnerability result.'
                  payload['rework_hint'] = None
                  payload['finding_candidate'] = None
                  return payload

              indicators = _indicators(evidence)
              if classification == 'parser_validation_error' or PARSER_VALIDATION_INDICATORS.intersection(indicators):
                  payload['verdict'] = 'retry_with_hint'
                  payload['reason'] = 'Execution stopped at parser validation because the worker template did not match parse_worker_command expectations.'
                  payload['rework_hint'] = payload.get('rework_hint') or _deterministic_rework_hint('parser_validation_error')
                  payload['finding_candidate'] = None
                  payload['severity'] = None
                  return payload

              if classification not in WEAK_GATED_CLASSES:
                  return payload

              strength = _signal_strength(classification, evidence)
              verdict = str(payload.get('verdict') or 'rejected').strip().lower()
              if verdict == 'confirmed' and strength == 'weak':
                  payload['verdict'] = 'rejected'
                  payload['reason'] = str(payload.get('reason') or f'{classification} evidence was too weak for confirmation.')
                  payload['rework_hint'] = None
                  payload['finding_candidate'] = None
              elif strength == 'medium' and verdict in {'confirmed', 'rejected'}:
                  payload['verdict'] = 'rework'
                  payload['reason'] = str(payload.get('reason') or f'{classification} evidence was promising but insufficient for confirmation.')
                  payload['rework_hint'] = payload.get('rework_hint') or _deterministic_rework_hint(classification)
                  payload['finding_candidate'] = None
              return payload


          def main(text: str, active_task_json: str, evidence_json: str) -> dict:
              try:
                  payload = json.loads(text or '{}')
              except Exception:
                  payload = {}
              try:
                  active_task = json.loads(active_task_json or '{}')
              except Exception:
                  active_task = {}
              try:
                  evidence = json.loads(evidence_json or '{}')
              except Exception:
                  evidence = {}

              classification = str(((evidence.get('response_summary') or {}).get('finding_type_hint')) or ((evidence.get('response_summary') or {}).get('auth_finding_type')) or evidence.get('classification_hint') or '').strip().lower()
              initial_verdict = str(payload.get('verdict') or 'rejected')
              signal_strength = _signal_strength(classification, evidence) if classification else 'strong'
              payload = _apply_threshold(payload, active_task, evidence, classification)
              finding_candidate = payload.get('finding_candidate')
              if payload.get('verdict') == 'confirmed' and isinstance(finding_candidate, dict) and classification:
                  finding_candidate = dict(finding_candidate)
                  finding_candidate['vuln_type'] = _label_for(classification)
                  finding_candidate['title'] = _title_for(classification)
                  payload['finding_candidate'] = finding_candidate

              run_id = str(evidence.get('run_id') or '').strip()
              root_trace_id = str(evidence.get('root_trace_id') or run_id).strip()
              trace_base = '|'.join([
                  run_id,
                  str(active_task.get('id') or ''),
                  str(active_task.get('endpoint') or ''),
                  str(active_task.get('method') or ''),
                  str(active_task.get('test_strategy') or ''),
                  str(active_task.get('retry_count') or 0),
              ])
              trace_id = sha1(trace_base.encode('utf-8')).hexdigest()[:16]
              _emit(run_id, 'judge', 'judge_verdict_finalized', {
                  'status': 'success',
                  'summary': 'Judge verdict parsed and guardrails applied.',
                  'run_id': run_id,
                  'trace_id': trace_id,
                  'task_id': str(active_task.get('id') or ''),
                  'trace_context': {
                      'root_trace_id': root_trace_id,
                      'endpoint': active_task.get('endpoint'),
                      'method': active_task.get('method'),
                      'class': active_task.get('class'),
                      'subtype': active_task.get('subtype'),
                      'hypothesis_family': active_task.get('hypothesis_family'),
                      'resource_family': (active_task.get('context_hints') or {}).get('resource_family') if isinstance(active_task.get('context_hints'), dict) else None,
                      'strategy': active_task.get('test_strategy'),
                      'retry_count': int(active_task.get('retry_count') or 0),
                      'followup_generation': int(active_task.get('followup_generation') or 0),
                  },
                  'reason': {
                      'initial_verdict': initial_verdict,
                      'final_verdict': str(payload.get('verdict') or 'rejected'),
                      'classification': classification,
                      'signal_strength': signal_strength,
                      'guardrail_changed_verdict': str(initial_verdict).lower() != str(payload.get('verdict') or '').lower(),
                      'judge_reason': str(payload.get('reason') or ''),
                  },
                  'artifacts': {
                      'finding_type_hint': classification,
                      'evidence_strength': (_response_summary(evidence).get('evidence_strength')),
                      'indicators': list((evidence.get('indicators') or [])[:8]),
                      'rework_hint': payload.get('rework_hint'),
                  },
              })

              queue_payload = dict(payload)
              if str(queue_payload.get('verdict') or '').strip().lower() == 'retry_with_hint':
                  queue_payload['verdict'] = 'rework'

              return {
                  "task_id": str(payload.get("task_id") or active_task.get("id") or ""),
                  "verdict": str(payload.get("verdict") or "rejected"),
                  "queue_verdict": str(queue_payload.get("verdict") or "rejected"),
                  "reason": str(payload.get("reason") or ""),
                  "rework_hint": payload.get("rework_hint"),
                  "rework_hint_json": json.dumps(payload.get("rework_hint"), ensure_ascii=False),
                  "finding_candidate_json": json.dumps(payload.get("finding_candidate"), ensure_ascii=False),
                  "verdict_json": json.dumps(queue_payload, ensure_ascii=False),
              }
        code_language: python3
