      targetPosition: left
      type: custom
      width: 260
    - data:
        code: |
          import json

          def main(body: str, backend_base_url: str) -> dict:
              payload = json.loads(body)
              session = payload.get("session", {}) or {}
              next_endpoints = payload.get("next_endpoints", {}) or {}
              base = str(backend_base_url or "").strip().rstrip("/")
              session_id = session.get("id")
              return {
                  "session_id": session_id,
                  "backend_base_url": base,
                  "prepare_auth_url": f"{base}/agentic/session/{session_id}/prepare-auth",
                  "prepare_probe_url": f"{base}/agentic/session/{session_id}/prepare-probe-seeds",
                  "bola_worker_tasks_url": f"{base}/agentic/session/{session_id}/worker-tasks/bola",
                  "bopla_worker_tasks_url": f"{base}/agentic/session/{session_id}/worker-tasks/bopla",
                  "worker_result_url": f"{base}/agentic/session/{session_id}/worker-result",
                  "judge_package_base_url": f"{base}/agentic/session/{session_id}/judge-package",
                  "judge_verdict_url": f"{base}/agentic/session/{session_id}/judge-verdict",
                  "report_package_url": f"{base}{next_endpoints.get('report_package', '')}",
                  "loop_state_url": f"{base}{next_endpoints.get('loop_state', f'/agentic/session/{session_id}/loop-state')}",
                  "tool_execute_url": f"{base}{next_endpoints.get('tool_execute', '/agentic/tools/execute')}",
                }
        code_language: python3
        dependencies: []
        desc: 'Build absolute backend URLs from session bootstrap.'
        outputs:
          session_id: {children: null, type: number}
          backend_base_url: {children: null, type: string}
          prepare_auth_url: {children: null, type: string}
          prepare_probe_url: {children: null, type: string}
