app:
  description: Minimal Phase 8 backend bridge smoke workflow with synthetic corpus
    setup. Backend owns campaign state, observations, evidence, decisions, and findings.
  icon: 🔗
  icon_background: '#E8F3FF'
  icon_type: emoji
  mode: workflow
  name: wf-backend-bridge-smoke
  use_icon_as_answer_icon: false
