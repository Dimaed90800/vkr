    - data:
        code: "import json\nfrom urllib.parse import urlparse\n\ndef _json_list(value,\
          \ default):\n    raw = str(value or '').strip()\n    if not raw:\n     \
          \   return default\n    try:\n        parsed = json.loads(raw)\n    except\
          \ Exception:\n        return default\n    return parsed if isinstance(parsed,\
          \ list) else default\n\ndef _default_allowed_hosts(target_url):\n    parsed\
          \ = urlparse(str(target_url or '').strip())\n    host = parsed.hostname\
          \ or parsed.netloc or ''\n    return [host] if host else []\n\ndef _default_openapi_spec():\n\
          \    return {\n        'openapi': '3.0.3',\n        'info': {'title': 'Vehicle\
          \ Smoke API', 'version': '1.0.0'},\n        'paths': {\n            '/api/v1/vehicles':\
          \ {\n                'get': {\n                    'operationId': 'listVehicles',\n\
          \                    'responses': {'200': {'description': 'Vehicle collection'}}\n\
          \                }\n            },\n            '/api/v1/vehicles/{vehicleId}':\
          \ {\n                'get': {\n                    'operationId': 'getVehicle',\n\
          \                    'parameters': [\n                        {'name': 'vehicleId',\
          \ 'in': 'path', 'required': True, 'schema': {'type': 'string'}}\n      \
          \              ],\n                    'responses': {'200': {'description':\
          \ 'Vehicle'}}\n                }\n            }\n        }\n    }\n\ndef\
          \ main(toolbox_url: str, target_url: str, openapi_url: str = '', openapi_spec_text:\
          \ str = '', allowed_hosts_json: str = '', roles_json: str = '', operation_id:\
          \ str = '', task_id: str = '') -> dict:\n    toolbox = str(toolbox_url or\
          \ '').rstrip('/')\n    target = str(target_url or '').rstrip('/')\n    allowed_hosts\
          \ = _json_list(allowed_hosts_json, _default_allowed_hosts(target))\n   \
          \ if not allowed_hosts:\n        allowed_hosts = _default_allowed_hosts(target)\n\
          \    roles = _json_list(roles_json, [{'name': 'owner'}, {'name': 'attacker'}])\n\
          \    op_id = str(operation_id or '').strip() or 'op_GET_/api/v1/vehicles/{vehicleId}'\n\
          \    task = str(task_id or '').strip() or 'task_bola_bridge_smoke_001'\n\
          \    spec = str(openapi_spec_text or '').strip()\n    if not spec:\n   \
          \     spec = json.dumps(_default_openapi_spec(), ensure_ascii=False)\n\n\
          \    # Important for Dify HTTP JSON body templating:\n    # openapi_spec_text\
          \ must be sent to backend as a JSON string value.\n    # This field is a\
          \ ready-to-inline JSON string literal, including quotes and escaping.\n\
          \    spec_json_literal = json.dumps(spec, ensure_ascii=False)\n\n    return\
          \ {\n        'toolbox_url': toolbox,\n        'target_url': target,\n  \
          \      'openapi_url': str(openapi_url or '').strip(),\n        'openapi_spec_text':\
          \ spec,\n        'openapi_spec_text_json': spec_json_literal,\n        'allowed_hosts_json':\
          \ json.dumps(allowed_hosts, ensure_ascii=False),\n        'roles_json':\
          \ json.dumps(roles, ensure_ascii=False),\n        'operation_id': op_id,\n\
          \        'task_id': task,\n    }\n"
