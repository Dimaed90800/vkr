                  return 'report context snapshot unavailable'
              return text[:180]

          def main(state_json: str) -> dict:
              status = 'snapshot_ready'
              error = ''
              snapshot = {}
              raw = str(state_json or '').strip()
              if raw:
                  try:
                      parsed = json.loads(raw)
                      if isinstance(parsed, dict):
                          snapshot = parsed
                      else:
                          status = 'snapshot_unavailable'
                          error = 'final loop state is not a json object'
                  except Exception:
                      status = 'snapshot_unavailable'
                      error = 'invalid final loop state json'
              else:
                  status = 'snapshot_unavailable'
                  error = 'missing final loop state json'
              body = {'runtime_state_snapshot': snapshot}
              return {
                  'report_context_body_json': json.dumps(body, ensure_ascii=False),
                  'report_context_body_status': status,
                  'report_context_body_error': _safe_error(error),
              }
