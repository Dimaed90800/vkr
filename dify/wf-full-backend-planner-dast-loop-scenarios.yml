            В разделе "## 6. Детали API9" обязательно включи подраздел с заголовком «Извлечение поверхности из JavaScript» (в скобках или отдельной строкой допустимо: JS surface extraction).
            Для каждого элемента массива js_extraction_results выведи только безопасные поля: js_url_sanitized, source_js_ref, result, absolute_paths_count, route_fragments_count, route_fragments_matched_count, endpoints_emitted_count, reason_codes.
            Если js_extraction_results отсутствует или пустой, в подразделе кратко укажи, что записей нет (или «не доступно» только если массив отсутствует вообще).
            Интерпретация: если js_route_fragments_matched_count > 0 и при этом undocumented_endpoint_signal_count == 0, добавь пояснение на русском:
            "JS-бандл содержит относительные маршруты; часть маршрутов сопоставлена с OpenAPI graph, поэтому они не считаются undocumented endpoints. Новых undocumented endpoint signals по JS extraction не выявлено."
            Если во входном JSON (runtime_state_snapshot, ready_candidates_sample, blocked_candidates_sample или аналогичные поля) llm_candidate_advisor_used отсутствует или false, не утверждай, что использовался LLM candidate advisor.
            Если llm_candidate_advisor_used=true, описывай это только как вспомогательное ранжирование кандидатов по безопасному OpenAPI summary, не как подтверждение уязвимости и не как замену вердикта Judge.
            Markdown only.
        - id: user
          role: user
          text: |
            Сформируй Markdown-отчёт по безопасности REST API на русском языке по ReportContext JSON ниже.
            Вывод должен быть compact: только confirmed_findings + ключевые diagnostic counters + пути к сохранённым артефактам.
            Добавь секцию "Пути к артефактам" и укажи:
            - logs/dast_runs/<campaign_id>/reports/report_full.md
            - logs/dast_runs/<campaign_id>/reports/report_confirmed_findings.md
            - logs/dast_runs/<campaign_id>/reports/report_context_sanitized.json
            Используй секции строго в этом порядке:

            # Отчёт по безопасности REST API
            ## 1. Область проверки
            ## 2. Краткое резюме
            ## 2a. Auth Flow Diagnostics
            Если во входном JSON есть auth_flow_diagnostics, всегда заполни секцию ## 2a сразу после ## 2: выведи auth_flow_detected, signup_candidate_count, login_candidate_count, token_response_candidate_count, profile_candidate_count; при наличии в JSON — auth_flow_candidates_sample или auth_flow_candidates и missing_prerequisites (или auth_limitations).
            При наличии в JSON выведи также: test_account_materialization_status, auth_profiles_created_count, signup_success_count, login_success_count, owner_auth_profile_id, attacker_auth_profile_id, auth_type, token_response_detected, materialization_errors, auth_profiles (только безопасные поля, без секретов).
            test_account_materializer — signup/login только через backend bounded worker; test_account_materialization_result — диагностика, не уязвимость; не выводи raw token, password, cookie, Authorization, raw request/response body; предпочитай auth_profile_id, не печатай token_ref без явного безопасного санитизированного профиля.
            Если auth_profiles_created_count >= 2, укажи, что можно планировать authenticated follow-up checks.
            auth_flow_signal — диагностика, не уязвимость; auth_flow_detector не выполняет login/signup; token_response_candidate_count — безопасный счётчик, не значение токена; не выводи raw tokens, passwords, cookies, Authorization, Set-Cookie.
            Если auth_flow_diagnostics отсутствует во входном JSON, секцию ## 2a пропусти (не выдумывай данные).
            ## 3. Покрытие OWASP API Top 10
            В секции 3 для API1 (owasp_coverage.API1_BROKEN_OBJECT_LEVEL_AUTHORIZATION): если объект API1 присутствует во входном JSON, обязательно выведи status и confirmed_findings_count; при наличии подтверждённых findings класса bola включи их в секцию 4 «Подтверждённые уязвимости», а не только в диагностику API3.
            В секции 3 для API7 (owasp_coverage.API7_SERVER_SIDE_REQUEST_FORGERY): если объект API7 присутствует во входном JSON, запрещено писать, что API7 целиком «не доступно»; выведи status и confirmed_findings_count из JSON.
            Если confirmed_findings_count > 0, используй формулировку близкую по смыслу: «SSRF подтверждён на основании controlled callback proof» и не пиши, что подтверждённых SSRF-уязвимостей нет.
            Если confirmed_findings_count = 0 и ssrf_candidate_signal_count > 0, добавь «диагностические SSRF-кандидаты обнаружены; подтверждение требует controlled callback proof».
            ## 4. Подтверждённые уязвимости
            Для каждой уязвимости в секции 4 используй:
            ### 4.N <Название>
            #### Что найдено
            #### Как обнаружено
            #### Как воспроизвести / подтвердить
            #### Потенциальное влияние
            #### Рекомендации по устранению
            ## 5. Детали API8 Security Misconfiguration
            ## 6. Детали API9 Improper Inventory Management
            В секции 6 обязательно: счётчики schema_mismatch_count, undocumented_endpoint_signal_count, undocumented_endpoint_findings_count, js_endpoint_extraction_count, js_route_fragments_count, js_route_fragments_matched_count, js_endpoints_emitted_count (если есть в JSON); подраздел «Извлечение поверхности из JavaScript» с элементами js_extraction_results (безопасные поля по system prompt); не называй js_endpoint_extractor источником уязвимостей или findings.
            ## 7. Детали API7 Server-Side Request Forgery
            В секции 7: если объект owasp_coverage.API7_SERVER_SIDE_REQUEST_FORGERY есть во входном JSON, обязательно выведи status, confirmed_findings_count, ssrf_candidate_signal_count, ssrf_candidate_operations_count, ssrf_candidate_fields_count, элементы ssrf_candidates, а также ssrf_probe_result_count, ssrf_callback_received_count, ssrf_no_callback_count, ssrf_confirmable_count и элементы ssrf_probe_results.
            Для ssrf_candidates выводи только поля operation_id, method, path, field_name, field_path, schema_type, schema_format, confidence, reason_codes.
            Для ssrf_probe_results выводи только поля operation_id, method, path, field_name, field_path, auth_mode, auth_profile_id, role_hint, correlation_id, target_status_code, callback_received, callback_received_effective, late_callback_reconciled, callback_store_received, callback_method, result, evidence_strength, request_composer, request_draft_validated, payload_synthesis_result, filled_required_fields_count, missing_required_fields_count, reason_codes.
            Если confirmed_ssrf_evidence присутствует и не пустой, обязательно выведи компактный блок «Confirmed SSRF Evidence» до длинных таблиц и включи только поля finding_id, evidence_id, operation_id, method, endpoint, field_path, callback_received_effective, late_callback_reconciled, callback_store_received, evidence_strength, judge_verdict, reason_codes.
            Запрещено сводить весь API7 к «не доступно», если объект API7 присутствует; «не доступно» только для отдельного отсутствующего подполя.
            Если confirmed_findings_count > 0, не пиши, что подтверждённых SSRF-уязвимостей нет.
            Подтверждённая SSRF-уязвимость допустима только при callback_received=true или callback_received_effective=true (controlled callback proof); при callback_received=false и callback_received_effective=false это диагностический результат, не confirmed vulnerability.
            Не называй ssrf_candidate_signal подтверждённой SSRF-уязвимостью; ssrf_candidate_signal не является confirmed vulnerability.
            Не утверждай exploitability SSRF без runtime/callback proof.
            ## 8. Диагностика API3 BOPLA / Mass Assignment
            В секции 8 при наличии диагностических счётчиков API3 не своди статус к «не доступно»; при отсутствии подтверждённых уязвимостей используй формулировку вроде «диагностическая проверка выполнена, подтверждённых уязвимостей нет».
            В секции 8, если во входном JSON (owasp_coverage.API3_BROKEN_OBJECT_PROPERTY_LEVEL_AUTHORIZATION) присутствуют поля response_field_inventory_count, data_exposure_signal_count, sensitive_property_exposure_findings_count, sensitive_field_categories, sensitive_fields_sample, data_exposure_results, data_exposure_probe_result_count, data_exposure_non_200_count, data_exposure_non_json_count, data_exposure_no_fields_count, data_exposure_fields_extracted_count, data_exposure_probe_results, обязательно выведи их фактические значения (или «не доступно» только если поле отсутствует в JSON).
            В секции 8 при наличии во входном JSON (API3 или auth_flow_diagnostics) полей authenticated_response_field_inventory_count, authenticated_data_exposure_signal_count, authenticated_data_exposure_probe_result_count, authenticated_data_exposure_results, auth_profiles_used_count, operations_with_authenticated_inventory, data_exposure_authenticated_non_200_count, data_exposure_authenticated_fields_extracted_count — обязательно выведи их фактические значения (или «не доступно» только если поле отсутствует в JSON).
            В секции 8 при наличии во входном JSON полей resource_instance_inventory_count, resource_instances_count, object_refs_count, operations_with_resource_instances, resource_types, resource_instance_results — обязательно выведи их фактические значения (или «не доступно» только если поле отсутствует в JSON).
            В секции 8 при наличии во входном JSON полей resource_seed_result_count, resource_seed_success_count, resource_seed_object_refs_created_count, resource_seed_results — обязательно выведи их фактические значения (или «не доступно» только если поле отсутствует в JSON).
            В секции 8 при наличии во входном JSON полей bola_object_pair_inventory_count, bola_object_pairs_count, bola_pair_resource_types, bola_replay_ready_count, bola_object_pairs — обязательно выведи их фактические значения (или «не доступно» только если поле отсутствует в JSON).
            В секции 8 при наличии во входном JSON полей bola_replay_result_count, bola_replay_granted_count, bola_replay_denied_count, bola_replay_results — обязательно выведи их фактические значения (или «не доступно» только если поле отсутствует в JSON).
            auth_profile_id — безопасная ссылка; token_ref не выводи без явного безопасного санитизированного поля; не выводи raw token, password, cookie, Authorization, raw request/response body.
            Если auth_profiles_created_count >= 2 и authenticated_response_field_inventory_count > 0 — добавь интерпретацию успешного authenticated API3 inventory из system prompt.
            Если authenticated_data_exposure_probe_result_count > 0 и authenticated_response_field_inventory_count == 0 — добавь интерпретацию неуспешного authenticated inventory из system prompt.
            Если неаутентифицированные probes дали 401/403 и authenticated извлёк поля — добавь интерпретацию «аутентификация разблокировала API3 field inventory» из system prompt.
            В секции 8 обязательно включи подраздел с заголовком «Диагностика data_exposure_validator»: счётчики probe и перечисление элементов data_exposure_probe_results только по полям operation_id, method, path, status_code, content_type, result, field_count, sensitive_field_count, sensitive_categories, reason_codes.
            В секции 8 обязательно включи подраздел с заголовком «Извлечение ресурсных идентификаторов»: resource_instance_inventory_count, resource_instances_count, object_refs_count, operations_with_resource_instances, resource_types и элементы resource_instance_results только по полям object_ref_id, resource_type, object_id_field, object_id_ref, source_operation_id, source_path, source_auth_profile_id, source_role_hint, confidence, reason_codes.
            В секции 8 обязательно включи подраздел с заголовком «Safe Resource Seeding»: resource_seed_result_count, resource_seed_success_count, resource_seed_object_refs_created_count и элементы resource_seed_results только по полям resource_seed_candidate_source, seed_status, owner_auth_profile_id, resource_type, seed_operation_id, seed_method, seed_path, followup_operation_id, followup_method, followup_path, object_refs_created_count, object_refs, http_calls_count, validation_mode, reason_codes, audit_flags, object_ref_id, object_id_ref, object_id_field, confidence.
            В секции 8 обязательно включи подраздел с заголовком «BOLA Object Pair Builder»: bola_object_pair_inventory_count, bola_object_pairs_count, bola_pair_resource_types, bola_replay_ready_count и элементы bola_object_pairs только по полям object_pair_id, resource_type, object_ref_id, object_id_ref, owner_auth_profile_id, attacker_auth_profile_id, target_operation_id, target_path_template, target_method, path_param_name, confidence, reason_codes.
            В секции 8 обязательно включи подраздел с заголовком «BOLA Replay Diagnostics»: bola_replay_result_count, bola_replay_granted_count, bola_replay_denied_count и элементы bola_replay_results только по полям object_pair_id, bola_replay_candidate_source, resource_type, target_operation_id, target_path_template, target_method, path_param_name, owner_auth_profile_id, attacker_auth_profile_id, status_code, result, access_granted, evidence_strength, response_fingerprint_match, validation_mode, reason_codes, audit_flags.
            Если data_exposure_probe_result_count > 0 и response_field_inventory_count == 0, добавь пояснение: data_exposure_validator был выполнен, но не создал response_field_inventory; причина в data_exposure_probe_results; это не подтверждённые уязвимости.
            Если data_exposure_non_200_count > 0, добавь пояснение про non-200, авторизацию, seed context и параметры (как в system prompt).
            resource_instance_inventory не является уязвимостью. object_id_ref — безопасная ссылка, а не raw object id. Не выводи raw object id values, raw token, password, cookie, Authorization, raw request/response body.
            resource_seed_result не является уязвимостью. object_id_ref/object_ref_id — безопасные ссылки. Не выводи raw object id values, raw payloads, raw responses, raw token, password, cookie, Authorization.
            bola_object_pair_inventory не является уязвимостью. object_pair_id — безопасная ссылка для replay planning. object_id_ref/object_ref_id — безопасные ссылки. Не выводи raw object id values, raw payloads, raw responses, raw token, password, cookie, Authorization, raw request/response body, raw headers.
            bola_replay_result не является автоматически confirmed vulnerability. Это runtime replay evidence и требует Judge/верификации. Не выводи raw object id, raw URL с подставленным id, raw payloads, raw responses, raw headers, token, password, cookie, Authorization.
            Если resource_instances_count > 0, укажи, что можно планировать BOLA/object-pair follow-up.
            Если resource_seed_success_count > 0, укажи: «Safe resource seeding created object references for BOLA/object-pair follow-up.»
            Если resource_seed_result_count > 0 и resource_seed_success_count == 0, укажи: «Resource seeding was attempted but did not create object references; use reason_codes as blockers.»
            Если bola_replay_ready_count > 0, укажи: «BOLA replay can be planned using prepared object pairs.»
            Если bola_object_pairs_count == 0, укажи: «BOLA replay remains blocked because no object pairs were prepared.»
            Если bola_replay_results присутствуют: если access_granted=true и evidence_strength в medium/high — укажи, что сформировано BOLA evidence и его следует передать на Judge/верификацию; если access_granted=false — укажи, что replay был denied/не эксплуатируем в bounded проверке.
            Не называй data_exposure_probe_result, response_field_inventory или data_exposure_signal подтверждённой уязвимостью.
            Только элементы confirmed_findings — подтверждённые уязвимости.
            ## 9. Ожидающие проверки
            ## 10. Заблокированные и пропущенные проверки
            ## 11. Сводка выполнения worker-ов
            ## 12. Ошибки инструментов
            ## 13. Ограничения
            В секции 13 при наличии llm_candidate_advisor_used=false или поля нет — не пиши, что LLM advisor подтверждал уязвимости; при true укажи только роль ранжирования кандидатов (не подтверждение уязвимости, не Judge).
            ## 14. Общие рекомендации

