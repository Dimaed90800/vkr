app:
  description: Phase 15C full backend planner DAST loop with ScenarioPlan snapshot before
    iterations. POST /v1/scenarios/plan once, merge into planner request, bounded loop unchanged.
  icon: F
  icon_background: '#E8F3FF'
  icon_type: emoji
  mode: workflow
  name: wf-full-backend-planner-dast-loop-scenarios
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.6.0
