    - data:
        code: |
          import json

          EXPECTED_SCHEMA = "report-context/v1"

          def _safe_error(value: str) -> str:
              text = str(value or '').strip()
              if not text:
                  return ''
              lowered = text.lower()
              forbidden = (
                  'authorization',
                  'cookie',
                  'set-cookie',
                  'request_body',
                  'response_body',
                  'raw_http',
                  'headers',
                  'token=',
                  'bearer ',
              )
              if any(marker in lowered for marker in forbidden):
                  return 'report context unavailable'
              return text[:180]

          def _to_int(value, default=0):
              try:
                  return int(value)
              except Exception:
                  return default

          def main(body: str, status_code: str = '') -> dict:
              status_int = _to_int(status_code, 0)
              if status_int and not (200 <= status_int < 300):
                  return {
                      'report_context_json': '{}',
                      'report_generation_status': 'context_unavailable',
                      'report_context_error': _safe_error(f'report context http status {status_int}'),
                      'can_generate_markdown': 'false',
                  }
              try:
                  payload = json.loads(str(body or '').strip() or '{}')
              except Exception:
                  return {
                      'report_context_json': '{}',
                      'report_generation_status': 'context_unavailable',
                      'report_context_error': 'invalid report context json',
                      'can_generate_markdown': 'false',
                  }
              if not isinstance(payload, dict):
                  return {
                      'report_context_json': '{}',
                      'report_generation_status': 'context_unavailable',
                      'report_context_error': 'invalid report context json',
                      'can_generate_markdown': 'false',
                  }
              if str(payload.get('schema_version') or '') != EXPECTED_SCHEMA:
                  return {
                      'report_context_json': '{}',
                      'report_generation_status': 'context_unavailable',
                      'report_context_error': 'unexpected report context schema',
                      'can_generate_markdown': 'false',
                  }
              return {
                  'report_context_json': json.dumps(payload, ensure_ascii=False),
                  'report_generation_status': 'context_ready',
                  'report_context_error': '',
                  'can_generate_markdown': 'true',
              }
