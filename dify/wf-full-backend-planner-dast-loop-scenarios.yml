    - data:
        code: |
          import json

          KIND_PRIORITY = [
              "bola_replay_probe",
              "security_header_validator",
              "cors_validator",
              "cookie_flag_validator",
              "schemathesis_negative_test",
              "injection_test",
              "data_exposure_validator",
              "resource_instance_extractor",
              "resource_seed_worker",
              "bola_object_pair_builder",
              "auth_flow_detector",
              "test_account_materializer",
              "ssrf_candidate_detector",
              "ssrf_probe",
              "property_mutation_test",
              "zap_discovery_passive",
              "js_endpoint_extractor",
              "undocumented_endpoint_validator",
          ]

          def _safe_parse(raw: str):
              try:
                  parsed = json.loads(str(raw or '').strip())
              except Exception:
                  return None
              return parsed

          def _extract_json_text(raw: str) -> str:
              text = str(raw or '').strip()
              if not text:
                  return ''
              if text.startswith('{') and text.endswith('}'):
                  return text
              start = text.find('```json')
              if start != -1:
                  tail = text[start + 7:]
                  end = tail.find('```')
                  if end != -1:
                      candidate = tail[:end].strip()
                      if candidate:
                          return candidate
              start = text.find('```')
              if start != -1:
                  tail = text[start + 3:]
                  end = tail.find('```')
                  if end != -1:
                      candidate = tail[:end].strip()
                      if candidate.startswith('{') and candidate.endswith('}'):
                          return candidate
              l = text.find('{')
              r = text.rfind('}')
              if l != -1 and r != -1 and r > l:
                  return text[l:r+1].strip()
              return ''

          def _unwrap_llm_payload(raw: str):
              extracted = _extract_json_text(raw)
              parsed = _safe_parse(extracted)
              if isinstance(parsed, dict):
                  for key in ("text", "result", "answer", "output", "structured_output"):
                      nested = parsed.get(key)
                      if isinstance(nested, dict):
                          return nested
                      if isinstance(nested, str):
                          nested_parsed = _safe_parse(_extract_json_text(nested))
                          if isinstance(nested_parsed, dict):
                              return nested_parsed
                  return parsed
              return None

          def _safe_candidate_summary(candidate: dict) -> dict:
              summary = candidate.get('summary') if isinstance(candidate.get('summary'), dict) else {}
              command = candidate.get('command') if isinstance(candidate.get('command'), dict) else {}
              inputs = command.get('inputs') if isinstance(command.get('inputs'), dict) else {}
              return {
                  'candidate_id': str(candidate.get('candidate_id') or ''),
                  'dedup_key': str(candidate.get('dedup_key') or ''),
                  'kind': str(candidate.get('kind') or ''),
                  'operation_id': str(summary.get('operation_id') or summary.get('target_operation_id') or command.get('operation_id') or inputs.get('operation_id') or ''),
                  'method': str(summary.get('method') or summary.get('target_method') or inputs.get('method') or '').upper(),
                  'path': str(summary.get('path') or summary.get('target_path_template') or summary.get('path_template') or inputs.get('path') or inputs.get('path_template') or ''),
                  'path_template': str(summary.get('path_template') or summary.get('target_path_template') or summary.get('path') or inputs.get('path_template') or inputs.get('path') or ''),
                  'field_name': str(summary.get('field_name') or inputs.get('field_name') or ''),
                  'field_path': str(summary.get('field_path') or inputs.get('field_path') or ''),
                  'object_pair_id': str(summary.get('object_pair_id') or inputs.get('object_pair_id') or ''),
                  'resource_type': str(summary.get('resource_type') or ''),
                  'auth_mode': str(summary.get('auth_mode') or inputs.get('auth_mode') or ''),
                  'auth_profile_id': str(summary.get('auth_profile_id') or inputs.get('auth_profile_id') or ''),
                  'confidence': str(summary.get('confidence') or ''),
                  'previous_result': str(summary.get('previous_result') or ''),
                  'attempted_count_for_candidate': int(summary.get('attempted_count_for_candidate') or 0),
                  'ssrf_score': float(summary.get('ssrf_score') or candidate.get('priority') or 0),
                  'ssrf_score_reasons': (
                      summary.get('ssrf_score_reasons')
                      if isinstance(summary.get('ssrf_score_reasons'), list) else []
                  ),
                  'utility_score': float(summary.get('utility_score') or summary.get('ssrf_score') or candidate.get('priority') or 0),
                  'reason_codes': summary.get('reason_codes') if isinstance(summary.get('reason_codes'), list) else [],
                  'missing_inputs': candidate.get('missing_inputs') if isinstance(candidate.get('missing_inputs'), list) else [],
                  'validation_mode': str(summary.get('validation_mode') or inputs.get('validation_mode') or ''),
              }

          def _fallback_by_kind(ready_candidates: list, selected_kind: str):
              if not selected_kind:
                  return None
              selected_kind = str(selected_kind or '').strip()
              rows = [row for row in ready_candidates if str(row.get('kind') or '') == selected_kind]
              return rows[0] if rows else None

          def _fallback_by_priority(ready_candidates: list):
              if not ready_candidates:
                  return None
              index = {name: idx for idx, name in enumerate(KIND_PRIORITY)}
              return sorted(
                  ready_candidates,
                  key=lambda row: (index.get(str(row.get('kind') or ''), 999), str(row.get('candidate_id') or '')),
              )[0]

          def main(llm_text: str, ready_candidates_full_json: str, fallback_candidate_id: str = '', fallback_candidate_kind: str = '', fallback_command_json: str = '') -> dict:
              ready_candidates = _safe_parse(ready_candidates_full_json)
              if not isinstance(ready_candidates, list):
                  ready_candidates = []
              ready_candidates = [row for row in ready_candidates if isinstance(row, dict)]
              by_id = {
                  str(row.get('candidate_id') or ''): row
                  for row in ready_candidates
                  if str(row.get('candidate_id') or '').strip()
              }
              llm_output_seen = bool(str(llm_text or '').strip())
              payload = _unwrap_llm_payload(llm_text)
              selected_candidate_id = ''
              selected_kind = ''
              selection_reason = ''
              fallback_reason = ''
              selected = None

              if isinstance(payload, dict):
                  selected_candidate_id = str(payload.get('selected_candidate_id') or '').strip()
                  selected_kind = str(payload.get('selected_kind') or '').strip()
                  selection_reason = str(payload.get('selection_reason') or '').strip()[:300]
                  if selected_candidate_id and selected_candidate_id in by_id:
                      selected = by_id[selected_candidate_id]
                  elif selected_kind:
                      selected = _fallback_by_kind(ready_candidates, selected_kind)
                      if selected is not None:
                          fallback_reason = 'selected_kind'
                  else:
                      fallback_reason = 'invalid_llm_output'
              else:
                  fallback_reason = 'invalid_llm_output'

              if selected is None and fallback_candidate_id and fallback_candidate_id in by_id:
                  selected = by_id[fallback_candidate_id]
                  if not fallback_reason:
                      fallback_reason = 'deterministic_candidate'
              if selected is None:
                  selected = _fallback_by_priority(ready_candidates)
                  if not fallback_reason:
                      fallback_reason = 'kind_priority'

              command = selected.get('command') if isinstance(selected, dict) and isinstance(selected.get('command'), dict) else {}
              resolved_kind = str(selected.get('kind') or fallback_candidate_kind or '')
              return {
                  'candidate_id': str(selected.get('candidate_id') or fallback_candidate_id or ''),
                  'candidate_kind': resolved_kind,
                  'command_json': json.dumps(command, ensure_ascii=False) if command else (str(fallback_command_json or '{}') or '{}'),
                  'selected_candidate_summary_json': json.dumps(_safe_candidate_summary(selected or {}), ensure_ascii=False),
                  'selection_outcome': 'selected_ready' if not fallback_reason else f'llm_{fallback_reason}',
                  'llm_planner_used': llm_output_seen,
                  'llm_planner_fallback': fallback_reason,
                  'llm_selected_candidate_id': selected_candidate_id,
                  'llm_selected_kind': selected_kind,
                  'llm_selection_reason': selection_reason,
              }
