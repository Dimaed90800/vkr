    - data:
        code: |
          import copy
          import json

          DEFAULT_PLANNER_REQUEST = {
              "include_blocked": True,
              "max_candidates": 50,
              "zap": {"enabled": True, "target_url": "", "zap_base_url": "http://zap:8080", "seed_urls": [], "use_spider": True, "use_ajax_spider": False, "max_duration_sec": 30, "max_discovered_urls": 100, "max_alerts": 100},
              "bola": {"enabled": True, "object_pairs": []},
          }

          def _load_json(raw, default):
              try:
                  v = json.loads(str(raw or "").strip() or "{}")
              except Exception:
                  return default
              return v if isinstance(v, dict) else default

          def _bool_flag(value: str, default: bool) -> bool:
              s = str(value or "").strip().lower()
              if s in ("false", "0", "no"):
                  return False
              if s in ("true", "1", "yes"):
                  return True
              return default

          def main(
              init_state_json: str,
              scenario_http_body: str,
              normalize_planner_request_json: str,
              include_scenario_compiler_flag: str = "true",
          ) -> dict:
              state = _load_json(init_state_json, {})
              base_raw = str(state.get("planner_request_base_json") or "").strip()
              if base_raw:
                  base = _load_json(base_raw, copy.deepcopy(DEFAULT_PLANNER_REQUEST))
              else:
                  base = _load_json(normalize_planner_request_json, copy.deepcopy(DEFAULT_PLANNER_REQUEST))
              want_compiler = _bool_flag(include_scenario_compiler_flag, True)
              warnings_extra = []
              sp_payload = None
              try:
                  sp_payload = json.loads(str(scenario_http_body or "").strip() or "{}")
              except Exception:
                  sp_payload = None
              if not isinstance(sp_payload, dict):
                  sp_payload = None
              scenarios_in = []
              if isinstance(sp_payload, dict):
                  scenarios_in = sp_payload.get("scenarios") if isinstance(sp_payload.get("scenarios"), list) else []
              valid = (
                  isinstance(sp_payload, dict)
                  and isinstance(scenarios_in, list)
                  and ("campaign_id" in sp_payload or "schema_version" in sp_payload)
              )
              if not valid:
                  effective = copy.deepcopy(base)
                  effective["include_scenario_compiler"] = False
                  effective.pop("scenario_plan", None)
                  state["scenario_plan_unavailable"] = True
                  warnings_extra.append("scenario_plan_unavailable")
              else:
                  kept = []
                  rejected_n = 0
                  for row in scenarios_in:
                      if not isinstance(row, dict):
                          continue
                      st = str(row.get("status") or "").strip().lower()
                      if st in ("accepted", "blocked"):
                          kept.append(row)
                      elif st == "rejected":
                          rejected_n += 1
                  src = str(sp_payload.get("source") or "").strip()
                  if not src:
                      src = str(sp_payload.get("schema_version") or "").strip()
                  effective = copy.deepcopy(base)
                  effective["scenario_plan"] = {"source": src, "scenarios": kept}
                  effective["include_scenario_compiler"] = bool(want_compiler)
                  state["scenario_plan_source"] = src
                  state["scenario_plan_graph_empty"] = bool(sp_payload.get("graph_empty"))
                  state["scenarios_total"] = len(scenarios_in)
                  state["accepted_scenarios_count"] = sum(1 for r in kept if str(r.get("status") or "").lower() == "accepted")
                  state["blocked_scenarios_count"] = sum(1 for r in kept if str(r.get("status") or "").lower() == "blocked")
                  state["rejected_scenarios_count"] = rejected_n
                  types_map = {}
                  for r in kept:
                      t = str(r.get("scenario_type") or "").strip() or "unknown"
                      types_map[t] = types_map.get(t, 0) + 1
                  state["scenario_types"] = sorted([f"{k}:{v}" for k, v in types_map.items()])
                  wlist = list(sp_payload.get("warnings") or [])
                  if isinstance(wlist, list):
                      state["scenario_plan_warnings_sample"] = [str(x) for x in wlist[:5]]
                  else:
                      state["scenario_plan_warnings_sample"] = []
              if warnings_extra:
                  ws = list(state.get("scenario_plan_warnings_sample") or [])
                  for w in warnings_extra:
                      if w not in ws:
                          ws.append(w)
                  state["scenario_plan_warnings_sample"] = ws[:8]
              if not valid:
                  state["planner_request_effective_json"] = json.dumps(
                      {**copy.deepcopy(base), "include_scenario_compiler": False},
                      ensure_ascii=False,
                  )
              else:
                  state["planner_request_effective_json"] = json.dumps(effective, ensure_ascii=False)
              return {"state_json": json.dumps(state, ensure_ascii=False)}
        code_language: python3
