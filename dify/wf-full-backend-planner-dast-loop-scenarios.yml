          def _pick(*values):
              for value in values:
                  if isinstance(value, bool):
                      return value
                  if str(value or '').strip():
                      return value
              return ''

          def main(
              current_state_json: str,
              stop_max_iterations_state_json: str = '',
              stop_max_iterations_exit: bool = False,
              stop_no_ready_candidate_state_json: str = '',
              stop_no_ready_candidate_exit: bool = False,
              stop_tool_failed_state_json: str = '',
