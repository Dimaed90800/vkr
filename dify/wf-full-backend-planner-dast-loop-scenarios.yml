    - data:
        code: |
          import json
          from urllib.parse import urlparse

          DEFAULT_PLANNER_REQUEST = {
              "include_blocked": True,
              "max_candidates": 50,
              "enable_llm_candidate_advisor": False,
              "enable_cors_baseline": True,
              "enable_cookie_baseline": True,
              "zap": {
                  "enabled": True,
                  "target_url": "",
                  "zap_base_url": "http://zap:8080",
                  "seed_urls": [],
                  "use_spider": True,
                  "use_ajax_spider": False,
                  "max_duration_sec": 30,
                  "max_discovered_urls": 100,
                  "max_alerts": 100,
              },
              "bola": {
                  "enabled": True,
                  "object_pairs": [],
              },
          }
          DEFAULT_PROFILE = "safe"
          PROFILE_MAX_ITERATIONS = {
              "safe": 35,
              "balanced": 55,
              "aggressive": 70,
          }

          def _json_list(value, default):
              raw = str(value or '').strip()
              if not raw:
                  return list(default)
              try:
                  parsed = json.loads(raw)
              except Exception:
                  return list(default)
              return parsed if isinstance(parsed, list) else list(default)

          def _json_object(value, default):
              raw = str(value or '').strip()
              if not raw:
                  return dict(default)
              try:
                  parsed = json.loads(raw)
              except Exception:
                  return dict(default)
              return parsed if isinstance(parsed, dict) else dict(default)

          def _deep_merge(defaults, overrides):
              merged = dict(defaults)
              for key, value in (overrides or {}).items():
                  if isinstance(merged.get(key), dict) and isinstance(value, dict):
                      merged[key] = _deep_merge(merged[key], value)
                  else:
                      merged[key] = value
              return merged

          def _default_allowed_hosts(target_url):
              parsed = urlparse(str(target_url or '').strip())
              host = parsed.netloc or parsed.hostname or ''
              return [host] if host else []

          def _normalize_profile(value, default=DEFAULT_PROFILE):
              raw = str(value or '').strip().lower()
              if raw in PROFILE_MAX_ITERATIONS:
                  return raw
              return default

          def _max_iterations(value, profile):
              raw = str(value or '').strip()
              if raw:
                  try:
                      parsed = int(raw)
                  except Exception:
                      parsed = None
                  if parsed is not None:
                      if parsed < 1:
                          return 1
                      if parsed > 80:
                          return 80
                      return parsed
              return PROFILE_MAX_ITERATIONS.get(profile, PROFILE_MAX_ITERATIONS[DEFAULT_PROFILE])

          def _scenario_int(value, default, lo, hi):
              raw = str(value or '').strip()
              if not raw:
                  parsed = default
              else:
                  try:
                      parsed = int(raw)
                  except Exception:
                      parsed = default
              if parsed < lo:
                  return lo
              if parsed > hi:
                  return hi
              return parsed

          def _bool_str(value, default='true'):
              raw = str(value or '').strip().lower()
              if raw in ('false', '0', 'no'):
                  return 'false'
              if raw in ('true', '1', 'yes'):
                  return 'true'
              if not raw:
                  return default
              return 'true' if default == 'true' else 'false'

          def main(
              toolbox_url,
              target_url,
              openapi_spec_text='',
              openapi_url='',
              allowed_hosts_json='',
              roles_json='',
              planner_request_json='',
              task_id='',
              judge_model='',
              max_iterations='',
              profile='',
              include_scenario_compiler='true',
              scenario_max_operations='120',
              scenario_max_scenarios='30',
              scenario_llm_enabled='false',
              scenario_llm_model='',
              scenario_prompt_version='scenario-planner/v1',
          ) -> dict:
              target = str(target_url or '').rstrip('/')
              openapi_text = str(openapi_spec_text or '')
              openapi_url_str = str(openapi_url or '').strip()
              allowed_hosts = _json_list(allowed_hosts_json, _default_allowed_hosts(target))
              roles = _json_list(roles_json, [])
              planner_request = _deep_merge(DEFAULT_PLANNER_REQUEST, _json_object(planner_request_json, {}))
              model_name = str(judge_model or 'bridge-full-backend-planner-dast-llm').strip()
              profile_name = _normalize_profile(profile, DEFAULT_PROFILE)
              max_iters = _max_iterations(max_iterations, profile_name)
              scen_ops = _scenario_int(scenario_max_operations, 120, 1, 500)
              scen_max = _scenario_int(scenario_max_scenarios, 30, 1, 100)
              scen_llm = _bool_str(scenario_llm_enabled, 'false')
              scen_model = str(scenario_llm_model or '').strip()
              scen_prompt = str(scenario_prompt_version or 'scenario-planner/v1').strip() or 'scenario-planner/v1'
              inc_scen = _bool_str(include_scenario_compiler, 'true')
              return {
                  'toolbox_url': str(toolbox_url or '').rstrip('/'),
                  'target_url': target,
                  'openapi_url': openapi_url_str,
                  'openapi_spec_text': openapi_text,
                  'openapi_spec_text_json': json.dumps(openapi_text, ensure_ascii=False),
                  'openapi_url_json': json.dumps(openapi_url_str, ensure_ascii=False),
                  'has_openapi_spec': 'true' if (openapi_text.strip() or openapi_url_str) else 'false',
                  'allowed_hosts_json': json.dumps(allowed_hosts, ensure_ascii=False),
                  'roles_json': json.dumps(roles, ensure_ascii=False),
                  'planner_request_json': json.dumps(planner_request, ensure_ascii=False),
                  'task_id': str(task_id or 'task_full_backend_planner_dast_loop').strip(),
                  'judge_model': model_name,
                  'max_iterations': str(max_iters),
                  'profile': profile_name,
                  'include_scenario_compiler': inc_scen,
                  'scenario_max_operations': str(scen_ops),
                  'scenario_max_scenarios': str(scen_max),
                  'scenario_llm_enabled': scen_llm,
                  'scenario_llm_model': scen_model,
                  'scenario_prompt_version': scen_prompt,
              }
        code_language: python3
