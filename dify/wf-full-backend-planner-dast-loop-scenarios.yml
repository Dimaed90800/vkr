    - data:
        code: |
          import json

          def _load_map(raw: str) -> dict:
              try:
                  value = json.loads(str(raw or '{}'))
              except Exception:
                  value = {}
              return value if isinstance(value, dict) else {}

          def _merge_counts(state: dict, delta_json: str) -> dict:
              delta = _load_map(delta_json)
              counts = state.get("skipped_by_kind_cap_count")
              if not isinstance(counts, dict):
                  counts = {}
              merged = {str(k): int(v) for k, v in counts.items() if str(k)}
              for kind, value in delta.items():
                  kind_name = str(kind or '').strip()
                  if not kind_name:
                      continue
                  try:
                      add = int(value)
                  except Exception:
                      add = 0
                  if add > 0:
                      merged[kind_name] = int(merged.get(kind_name, 0) or 0) + add
              state["skipped_by_kind_cap_count"] = merged
              return delta

          def _increment_executed(state: dict, candidate_kind: str) -> None:
              kind = str(candidate_kind or '').strip()
              if not kind:
                  return
              counts = state.get("executed_by_kind")
              if not isinstance(counts, dict):
                  counts = {}
              merged = {str(k): int(v) for k, v in counts.items() if str(k)}
              merged[kind] = int(merged.get(kind, 0) or 0) + 1
              state["executed_by_kind"] = merged

          def main(state_json: str, candidate_kind: str, tool_run_id: str, tool_result_status: str, observations_count: str, selection_outcome: str, skipped_by_kind_cap_delta_json: str) -> dict:
              try:
                  state = json.loads(state_json or '{}')
              except Exception:
                  state = {}
              skipped_delta = _merge_counts(state, skipped_by_kind_cap_delta_json)
              selection = str(selection_outcome or '').strip() or "selected_ready"
              next_index = int(state.get("iterations_run") or 0) + 1
              summary = {
                  "iteration_index": next_index,
                  "candidate_kind": str(candidate_kind or ''),
                  "tool_run_id": str(tool_run_id or ''),
                  "tool_result_status": str(tool_result_status or ''),
                  "observations_count": int(str(observations_count or '0') or 0),
                  "first_observation_type": "",
                  "verification_plan_id": "",
                  "evidence_id": "",
                  "judge_verdict": "",
                  "finding_id": "",
                  "outcome": "no_observations",
                  "selection_outcome": selection,
                  "skipped_by_kind_cap_delta": skipped_delta,
              }
              state["iterations_run"] = next_index
              _increment_executed(state, candidate_kind)
              state["last_candidate_kind"] = str(candidate_kind or '')
              state["last_tool_run_status"] = str(tool_result_status or '')
              state["last_observation_type"] = ""
              state["last_verification_plan_id"] = ""
              state["last_selection_outcome"] = selection
              state["iteration_summaries"] = (state.get("iteration_summaries") or []) + [summary]
              return {
                  "state_json": json.dumps(state, ensure_ascii=False),
                  "should_exit_loop": False,
              }
