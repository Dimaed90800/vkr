    - data:
        code: |
          import json

          def _load_map(raw: str) -> dict:
              try:
                  value = json.loads(str(raw or '{}'))
              except Exception:
                  value = {}
              return value if isinstance(value, dict) else {}

          def _merge_counts(state: dict, delta_json: str) -> dict:
              delta = _load_map(delta_json)
              counts = state.get("skipped_by_kind_cap_count")
              if not isinstance(counts, dict):
                  counts = {}
              merged = {str(k): int(v) for k, v in counts.items() if str(k)}
              for kind, value in delta.items():
                  kind_name = str(kind or '').strip()
                  if not kind_name:
                      continue
                  try:
                      add = int(value)
                  except Exception:
                      add = 0
                  if add > 0:
                      merged[kind_name] = int(merged.get(kind_name, 0) or 0) + add
              state["skipped_by_kind_cap_count"] = merged
              return delta

          def main(state_json: str, ready_count: str, blocked_count: str, skipped_existing_count: str, blocked_missing_inputs_summary: str, selection_outcome: str, skipped_by_kind_cap_delta_json: str) -> dict:
              try:
                  state = json.loads(state_json or '{}')
              except Exception:
                  state = {}
              skipped_delta = _merge_counts(state, skipped_by_kind_cap_delta_json)
              outcome = str(selection_outcome or '').strip() or "no_ready_candidate"
              summary = {
                  "iteration_index": int(state.get("iterations_run") or 0) + 1,
                  "candidate_kind": "",
                  "tool_run_id": "",
                  "tool_result_status": "",
                  "observations_count": 0,
                  "first_observation_type": "",
                  "verification_plan_id": "",
                  "evidence_id": "",
                  "judge_verdict": "",
                  "finding_id": "",
                  "outcome": outcome,
                  "selection_outcome": outcome,
                  "ready_count": str(ready_count or ''),
                  "blocked_count": str(blocked_count or ''),
                  "skipped_existing_count": str(skipped_existing_count or ''),
                  "blocked_missing_inputs_summary": str(blocked_missing_inputs_summary or ''),
                  "skipped_by_kind_cap_delta": skipped_delta,
              }
              state["iteration_summaries"] = (state.get("iteration_summaries") or []) + [summary]
              state["last_selection_outcome"] = outcome
              state["stopped_reason"] = "caps_exhausted" if outcome == "caps_exhausted" else "no_ready_candidate"
              return {
                  "state_json": json.dumps(state, ensure_ascii=False),
                  "should_exit_loop": True,
              }
