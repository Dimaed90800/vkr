              return value if isinstance(value, dict) else {}

          def _merge_counts(state: dict, delta_json: str) -> dict:
              delta = _load_map(delta_json)
              counts = state.get("skipped_by_kind_cap_count")
              if not isinstance(counts, dict):
                  counts = {}
              merged = {str(k): int(v) for k, v in counts.items() if str(k)}
              for kind, value in delta.items():
                  kind_name = str(kind or '').strip()
                  if not kind_name:
                      continue
                  try:
                      add = int(value)
                  except Exception:
                      add = 0
                  if add > 0:
                      merged[kind_name] = int(merged.get(kind_name, 0) or 0) + add
              state["skipped_by_kind_cap_count"] = merged
              return delta

          def _increment_executed(state: dict, candidate_kind: str) -> None:
              kind = str(candidate_kind or '').strip()
              if not kind:
                  return
              counts = state.get("executed_by_kind")
              if not isinstance(counts, dict):
                  counts = {}
              merged = {str(k): int(v) for k, v in counts.items() if str(k)}
              merged[kind] = int(merged.get(kind, 0) or 0) + 1
              state["executed_by_kind"] = merged

          def _safe_int(value, default=0) -> int:
              try:
                  return int(value)
              except Exception:
                  return default

          def _load_obj(raw: str) -> dict:
              try:
                  value = json.loads(str(raw or '{}'))
              except Exception:
                  value = {}
              return value if isinstance(value, dict) else {}

          def _bool_value(value) -> bool:
              if isinstance(value, bool):
                  return value
              return str(value or '').strip().lower() in {'true', '1', 'yes', 'on'}

