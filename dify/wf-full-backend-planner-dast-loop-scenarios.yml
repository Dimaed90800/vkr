    - data:
        code: |
          import json

          def _int_value(value, default=0):
              try:
                  return int(value)
              except Exception:
                  return default

          def main(seed_state_json: str, loop_state_json: str = '', current_state_json: str = '') -> dict:
              value = str(loop_state_json or '').strip()
              if not value:
                  value = str(current_state_json or '').strip()
              if not value:
                  value = str(seed_state_json or '')
              try:
                  state = json.loads(value or '{}')
              except Exception:
                  state = {}
              if not isinstance(state, dict):
                  state = {}
              stopped_reason = str(state.get("stopped_reason") or "").strip()
              iterations_run = _int_value(state.get("iterations_run"), 0)
              max_iterations = _int_value(state.get("max_iterations"), 0)
              if not stopped_reason and max_iterations > 0 and iterations_run >= max_iterations:
                  state["stopped_reason"] = "max_iterations_reached"
              return {"state_json": json.dumps(state, ensure_ascii=False)}
        code_language: python3
        dependencies: []
        desc: Resolve last compact loop state after bounded planner loop completion.
        outputs:
          state_json:
