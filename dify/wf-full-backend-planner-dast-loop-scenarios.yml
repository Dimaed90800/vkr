    - data:
        code: |
          import json
          import re

          ALLOWED = {
              'confirmed',
              'rejected',
              'rework',
              'duplicate',
              'out_of_scope',
              'inconclusive',
          }
          SEVERITIES = {'info', 'low', 'medium', 'high', 'critical'}
          REQUIRED = [
              'schema_version',
              'verdict',
              'confidence',
              'severity',
              'reason',
              'finding_candidate',
              'duplicate_of_finding_id',
              'judge_source',
              'judge_model',
          ]

          def fallback(judge_model: str) -> dict:
              return {
                  'schema_version': 'judge-verdict/v1',
                  'verdict': 'inconclusive',
                  'confidence': 0.0,
                  'severity': 'info',
                  'reason': 'LLM judge returned invalid JSON; backend apply receives safe inconclusive fallback.',
                  'finding_candidate': {
                      'title': '',
                      'severity': '',
                      'vulnerability_class': '',
                      'summary': '',
                      'extras': {'fallback_reason': 'invalid_llm_json'},
                  },
                  'duplicate_of_finding_id': '',
                  'judge_source': 'dify',
                  'judge_model': judge_model,
              }

          def clean_text(text: str) -> str:
              value = (text or '').strip()
              fence = re.match(r'^```(?:json)?\s*(.*?)\s*```$', value, re.DOTALL)
              if fence:
                  value = fence.group(1).strip()
              return value

          def _is_valid_confidence(value) -> bool:
              try:
                  parsed = float(value)
              except (TypeError, ValueError):
                  return False
              return 0.0 <= parsed <= 1.0

          def _truncate(value: str, max_len: int) -> str:
              text = str(value or '')
              if len(text) <= max_len:
                  return text
              return text[:max_len]

          def main(llm_text: str, judge_model: str) -> dict:
              model_name = str(judge_model or 'bridge-full-backend-planner-dast-llm').strip()
              try:
                  payload = json.loads(clean_text(llm_text))
                  if not isinstance(payload, dict):
                      raise ValueError('payload_not_object')
                  for field in REQUIRED:
                      if field not in payload:
                          raise ValueError(f'missing_{field}')
                  if payload.get('verdict') not in ALLOWED:
                      raise ValueError('invalid_verdict')
                  if str(payload.get('severity') or '') not in SEVERITIES:
                      raise ValueError('invalid_severity')
                  if not _is_valid_confidence(payload.get('confidence')):
                      raise ValueError('invalid_confidence')
                  if not isinstance(payload.get('reason'), str):
                      raise ValueError('invalid_reason')
                  if not isinstance(payload.get('duplicate_of_finding_id'), str):
                      raise ValueError('invalid_duplicate_of_finding_id')
                  if not isinstance(payload.get('finding_candidate'), dict):
                      raise ValueError('finding_candidate_not_object')
                  candidate = payload.get('finding_candidate') or {}
                  if not isinstance(candidate.get('title', ''), str):
                      raise ValueError('invalid_candidate_title')
                  candidate_severity = candidate.get('severity', '')
                  if not isinstance(candidate_severity, str):
                      raise ValueError('invalid_candidate_severity_type')
                  if candidate_severity and candidate_severity not in SEVERITIES:
                      raise ValueError('invalid_candidate_severity')
                  if not isinstance(candidate.get('vulnerability_class', ''), str):
                      raise ValueError('invalid_candidate_vulnerability_class')
                  if not isinstance(candidate.get('summary', ''), str):
                      raise ValueError('invalid_candidate_summary')
                  if not isinstance(candidate.get('extras', {}), dict):
                      raise ValueError('invalid_candidate_extras')
              except Exception:
                  payload = fallback(model_name)

              payload['schema_version'] = 'judge-verdict/v1'
              payload['judge_source'] = 'dify'
              payload['judge_model'] = model_name
              payload['severity'] = str(payload.get('severity') or 'info')
              payload['confidence'] = float(payload.get('confidence') or 0.0)
              payload['reason'] = _truncate(payload.get('reason') or '', 600)
              if not isinstance(payload.get('finding_candidate'), dict):
                  payload['finding_candidate'] = fallback(model_name)['finding_candidate']
              payload['finding_candidate']['title'] = _truncate(payload['finding_candidate'].get('title') or '', 240)
              payload['finding_candidate']['summary'] = _truncate(payload['finding_candidate'].get('summary') or '', 1000)
              payload.setdefault('duplicate_of_finding_id', '')
              return {'judge_verdict_json': json.dumps(payload, ensure_ascii=False)}
