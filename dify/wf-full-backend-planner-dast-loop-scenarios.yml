    - data:
        code: |
          import json

          def _load_json(raw: str, default):
              try:
                  value = json.loads(str(raw or ''))
              except Exception:
                  value = default
              return value if isinstance(value, type(default)) else default

          def _safe_int(value, default=0) -> int:
              try:
                  return int(value)
              except Exception:
                  return default

          def main(state_json: str, ready_candidates_sample_json: str, blocked_candidates_sample_json: str, ready_candidates_by_kind_count_json: str = '', blocked_candidates_by_kind_count_json: str = '') -> dict:
              state = _load_json(state_json, {})
              ready_sample = _load_json(ready_candidates_sample_json, [])
              blocked_sample = _load_json(blocked_candidates_sample_json, [])
              ready_by_kind = _load_json(ready_candidates_by_kind_count_json, {})
              blocked_by_kind = _load_json(blocked_candidates_by_kind_count_json, {})

              attempts = []
              for row in (state.get('iteration_summaries') or [])[-12:]:
                  if not isinstance(row, dict):
                      continue
                  attempts.append({
                      'kind': str(row.get('candidate_kind') or ''),
                      'operation_id': str(row.get('operation_id') or ''),
                      'field_path': str(row.get('field_path') or ''),
                      'object_pair_id': str(row.get('object_pair_id') or ''),
                      'auth_mode': str(row.get('auth_mode') or ''),
                      'result': str(row.get('result') or row.get('outcome') or row.get('tool_result_status') or ''),
                      'status_code': _safe_int(row.get('status_code'), 0),
                      'callback_received': bool(row.get('callback_received')),
                      'access_granted': bool(row.get('access_granted')),
                      'owner_baseline_valid': bool(row.get('owner_baseline_valid')),
                      'evidence_strength': str(row.get('evidence_strength') or ''),
                      'created_finding': bool(str(row.get('finding_id') or '').strip()),
                      'dedup_key': str(row.get('dedup_key') or ''),
                  })

              last_observation_summary = state.get('last_observation_summary')
              if not isinstance(last_observation_summary, dict):
                  last_observation_summary = {
                      'type': str(state.get('last_observation_type') or ''),
                  }

              worker_execution_summary = {
                  'executed_by_kind': state.get('executed_by_kind') if isinstance(state.get('executed_by_kind'), dict) else {},
                  'tool_failures_count': _safe_int(state.get('tool_failures_count'), 0),
                  'confirmed_findings_count': _safe_int(state.get('confirmed_findings_count'), 0),
                  'pending_verification_count': _safe_int(state.get('pending_verification_count'), 0),
              }

              auth_flow_diagnostics = {
                  'auth_profiles_missing': not bool(state.get('executed_by_kind', {}).get('test_account_materializer')),
                  'auth_flow_detector_ready_count': _safe_int(ready_by_kind.get('auth_flow_detector'), 0),
                  'test_account_materializer_ready_count': _safe_int(ready_by_kind.get('test_account_materializer'), 0),
                  'auth_flow_detector_attempts': _safe_int(state.get('executed_by_kind', {}).get('auth_flow_detector'), 0),
                  'test_account_materializer_attempts': _safe_int(state.get('executed_by_kind', {}).get('test_account_materializer'), 0),
              }

              ssrf_attempts = [row for row in attempts if str(row.get('kind') or '') == 'ssrf_probe']
              bola_attempts = [row for row in attempts if str(row.get('kind') or '') == 'bola_replay_probe']
              api8_ready = sum(
                  1 for row in ready_sample
                  if str(row.get('kind') or '') in {'security_header_validator', 'cors_validator', 'cookie_flag_validator'}
              )
              owasp_coverage = {
                  'API1_BROKEN_OBJECT_LEVEL_AUTHORIZATION': {
                      'ready_candidates': _safe_int(ready_by_kind.get('bola_replay_probe'), 0),
                      'attempts': len(bola_attempts),
                      'access_granted_count': sum(1 for row in bola_attempts if bool(row.get('access_granted'))),
                      'invalid_object_pair_count': sum(1 for row in bola_attempts if str(row.get('result') or '') == 'invalid_object_pair'),
                  },
                  'API7_SERVER_SIDE_REQUEST_FORGERY': {
                      'ready_candidates': _safe_int(ready_by_kind.get('ssrf_probe'), 0),
                      'attempts': len(ssrf_attempts),
                      'failed_candidates': [
                          str(row.get('dedup_key') or '')
                          for row in ssrf_attempts
                          if str(row.get('result') or '') and not bool(row.get('callback_received'))
                      ][:8],
                      'callback_received_count': sum(1 for row in ssrf_attempts if bool(row.get('callback_received'))),
                  },
                  'API8_SECURITY_MISCONFIGURATION': {
                      'ready_candidates': api8_ready,
                      'blocked_candidates': sum(
                          _safe_int(blocked_by_kind.get(name), 0)
                          for name in ('security_header_validator', 'cors_validator', 'cookie_flag_validator')
                      ),
                  },
              }

              return {
                  'ready_candidates_sample': json.dumps(ready_sample, ensure_ascii=False),
                  'blocked_candidates_sample': json.dumps(blocked_sample, ensure_ascii=False),
                  'compact_attempt_summary': json.dumps(attempts, ensure_ascii=False),
                  'auth_flow_diagnostics': json.dumps(auth_flow_diagnostics, ensure_ascii=False),
                  'owasp_coverage': json.dumps(owasp_coverage, ensure_ascii=False),
                  'worker_execution_summary': json.dumps(worker_execution_summary, ensure_ascii=False),
                  'last_observation_summary': json.dumps(last_observation_summary, ensure_ascii=False),
              }
