    - data:
        code: |
          import json

          def main(body: str) -> dict:
              try:
                  payload = json.loads(body or '{}')
              except Exception:
                  payload = {}
              pack = payload.get('evidence_pack') or payload.get('evidence') or {}

              def safe_path(value):
                  raw = str(value or '')
                  return raw.split('?', 1)[0]

              def request_ref(exchange):
                  if not isinstance(exchange, dict):
                      return None
                  ref = exchange.get('request_ref') or {}
                  if not isinstance(ref, dict):
                      return None
                  return {
                      'request_id': ref.get('request_id') or '',
                      'role': ref.get('role') or '',
                      'method': ref.get('method') or '',
                      'path_template': ref.get('path_template') or '',
                      'status_code': ref.get('status_code') or 0,
                      'classification': ref.get('classification') or '',
                      'operation_id': ref.get('operation_id') or '',
                  }

              derived = pack.get('derived_signals') or []
              strong_schema_signals = []
              schema_contract_interpretation = []
              if isinstance(derived, list):
                  for item in derived:
                      if not isinstance(item, str):
                          continue
                      if item.startswith('signal:') and item.split(':', 1)[1] in (
                          '5xx',
                          'schema_violation',
                          'unexpected_2xx',
                      ):
                          strong_schema_signals.append(item)
                      if item.startswith('signal_interpretation:') or item.startswith('impact_summary:'):
                          schema_contract_interpretation.append(item)
              tool_ids = pack.get('tool_run_ids') or []
              if not isinstance(tool_ids, list):
                  tool_ids = []

              inj_strong = []
              inj_param = {}
              inj_delta = {}
              vuln_cls = str(pack.get('vulnerability_class') or '')
              if vuln_cls == 'potential_injection':
                  if isinstance(derived, list):
                      for item in derived:
                          if not isinstance(item, str):
                              continue
                          if item.startswith('strong_signal:'):
                              inj_strong.append(item)
                          if item.startswith('parameter_name:'):
                              inj_param['parameter_name'] = item.split(':', 1)[1]
                          if item.startswith('parameter_location:'):
                              inj_param['parameter_location'] = item.split(':', 1)[1]
                          if item.startswith('payload_family:'):
                              inj_param['payload_family'] = item.split(':', 1)[1]
                          if item.startswith('payload_label:'):
                              inj_param['payload_label'] = item.split(':', 1)[1]
                          if item.startswith('baseline_status:'):
                              inj_delta['baseline_status'] = item.split(':', 1)[1]
                          if item.startswith('attack_status:'):
                              inj_delta['attack_status'] = item.split(':', 1)[1]

              summary = {
                  'campaign_id': pack.get('campaign_id'),
                  'evidence_id': pack.get('evidence_id'),
                  'task_id': pack.get('task_id'),
                  'observation_id': pack.get('observation_id'),
                  'tool_run_ids': tool_ids[:5],
                  'strong_schema_signals': strong_schema_signals[:10],
                  'schema_contract_interpretation': schema_contract_interpretation[:12],
                  'verification_plan_id': pack.get('verification_plan_id'),
                  'owasp_category': pack.get('owasp_category'),
                  'vulnerability_class': pack.get('vulnerability_class'),
                  'operation_id': pack.get('operation_id'),
                  'endpoint': safe_path(pack.get('endpoint') or ''),
                  'method': pack.get('method'),
                  'status': pack.get('status'),
                  'judge_ready': pack.get('judge_ready'),
                  'missing_evidence': pack.get('missing_evidence') or [],
                  'confidence': pack.get('confidence') or 0.0,
                  'hypothesis': pack.get('hypothesis') or '',
                  'derived_signals': pack.get('derived_signals') or [],
                  'has_baseline': bool(pack.get('baseline')),
                  'has_attack': bool(pack.get('attack')),
                  'has_ownership_proof': bool(pack.get('ownership_proof')),
                  'has_diff': bool(pack.get('diff')),
                  'controls_count': len(pack.get('controls') or []),
                  'replay_steps_count': len(pack.get('replay_steps') or []),
                  'artifact_refs_count': len(pack.get('artifact_refs') or []),
                  'baseline_ref': request_ref(pack.get('baseline') or {}),
                  'attack_ref': request_ref(pack.get('attack') or {}),
                  'replay_step_refs': [
                      {
                          'order': int(step.get('order') or 0),
                          'role': str(step.get('role') or ''),
                          'method': str(step.get('method') or ''),
                          'path_template': safe_path(step.get('path_template') or ''),
                          'path': safe_path(step.get('path') or ''),
                          'description': str(step.get('description') or ''),
                          'request_id': str(step.get('request_id') or ''),
                      }
                      for step in (pack.get('replay_steps') or [])
                      if isinstance(step, dict)
                  ][:5],
                  'injection_strong_signals': inj_strong[:12],
                  'injection_parameter_context': inj_param,
                  'baseline_attack_delta': inj_delta,
              }
              return {
                  'evidence_id': str(pack.get('evidence_id') or ''),
                  'judge_input_json': json.dumps(summary, ensure_ascii=False),
              }
        code_language: python3
