              record_pending_verification_state_json: str = '',
              record_pending_verification_exit: bool = False,
              record_finding_created_state_json: str = '',
              record_finding_created_exit: bool = False,
          ) -> dict:
              state_json = _pick(
                  stop_max_iterations_state_json,
                  stop_no_ready_candidate_state_json,
                  stop_tool_failed_state_json,
                  record_no_observations_state_json,
                  record_pending_verification_state_json,
                  record_finding_created_state_json,
                  current_state_json,
              )
              should_exit_loop = any([
                  bool(stop_max_iterations_exit),
                  bool(stop_no_ready_candidate_exit),
                  bool(stop_tool_failed_exit),
                  bool(record_no_observations_exit),
                  bool(record_pending_verification_exit),
                  bool(record_finding_created_exit),
              ])
              return {
                  "state_json": str(state_json or current_state_json or ''),
                  "should_exit_loop": bool(should_exit_loop),
              }
