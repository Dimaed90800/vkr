    - data:
        code: |
          def _safe_error(value: str) -> str:
              text = str(value or '').strip()
              if not text:
                  return ''
              lowered = text.lower()
              forbidden = (
                  'authorization',
                  'cookie',
                  'set-cookie',
                  'request_body',
                  'response_body',
                  'raw_http',
                  'headers',
                  'token=',
                  'bearer ',
              )
              if any(marker in lowered for marker in forbidden):
                  return 'report context unavailable'
              return text[:180]

          def main(
              fallback_report: str,
              report_generation_status: str = '',
              report_context_error: str = '',
              markdown_report: str = '',
          ) -> dict:
              md = str(markdown_report or '').strip()
              fallback = str(fallback_report or '')
              status = str(report_generation_status or '').strip() or 'llm_failed'
              safe_error = _safe_error(report_context_error)
              if md:
                  return {
                      'final_report': md,
                      'report_generation_status': 'markdown_generated',
                      'report_context_error': '',
                  }
              note = "Markdown report generation unavailable; returning compact fallback."
              lines = [fallback.rstrip(), "", note]
              if safe_error:
                  lines.append(f"report_context_error: {safe_error}")
              return {
                  'final_report': "\n".join(lines).strip() + "\n",
                  'report_generation_status': status or 'llm_failed',
                  'report_context_error': safe_error,
              }
        code_language: python3
        dependencies: []
        desc: Prefer markdown report; otherwise return compact fallback report.
        outputs:
          final_report:
            children: null
            type: string
          report_context_error:
            children: null
            type: string
          report_generation_status:
            children: null
            type: string
