    - data:
        code: |
          import json

          def main(body: str) -> dict:
              out = {
                  'has_observation': False,
                  'selected_observation_json': '{}',
                  'selected_observation_id': '',
                  'selected_observation_type': '',
                  'verification_plan_id': '',
                  'evidence_capable': False,
                  'bola_replay_result_count': 0,
                  'strong_bola_replay_count': 0,
                  'ssrf_probe_result_count': 0,
                  'strong_ssrf_probe_count': 0,
                  # Backward compatibility keys used downstream in current workflow.
                  'first_observation_id': '',
                  'first_observation_type': '',
                  'observations_count': 0,
                  'cross_role_access_count': 0,
                  'zap_alerts_count': 0,
                  'discovered_endpoints_count': 0,
              }
              try:
                  payload = json.loads(body or '{}')
              except Exception:
                  payload = {}
              observations = payload.get('observations')
              if not isinstance(observations, list):
                  tool_result = payload.get('tool_result') if isinstance(payload, dict) else {}
                  observations = tool_result.get('observations') if isinstance(tool_result, dict) else []
              if not isinstance(observations, list):
                  observations = []
              observations = [obs for obs in observations if isinstance(obs, dict)]
              strong_bola = [
                  obs for obs in observations
                  if obs.get('type') == 'bola_replay_result'
                  and bool(((obs.get('details') or {}).get('access_granted')) is True)
                  and bool(((obs.get('details') or {}).get('owner_baseline_valid')) is True)
                  and str(((obs.get('details') or {}).get('evidence_strength') or '')).lower() in {'medium', 'high'}
              ]
              strong_ssrf = [
                  obs for obs in observations
                  if obs.get('type') == 'ssrf_probe_result'
                  and bool(((obs.get('details') or {}).get('callback_received')) is True)
                  and str(((obs.get('details') or {}).get('evidence_strength') or '')).lower() in {'medium', 'high'}
              ]
              cross = [obs for obs in observations if obs.get('type') == 'cross_role_access_signal']
              validated_headers = [obs for obs in observations if obs.get('type') == 'validated_security_header_issue']
              schema = [obs for obs in observations if obs.get('type') == 'schema_mismatch']
              injection = [obs for obs in observations if obs.get('type') == 'injection_signal']
              alerts = [obs for obs in observations if obs.get('type') == 'zap_alert']
              discovered = [obs for obs in observations if obs.get('type') == 'discovered_endpoint']
              selected = strong_bola[0] if strong_bola else (
                  strong_ssrf[0] if strong_ssrf else (
                      cross[0] if cross else (
                          validated_headers[0] if validated_headers else (
                              schema[0] if schema else (
                                  injection[0] if injection else (
                                      alerts[0] if alerts else (
                                          discovered[0] if discovered else {}
                                      )
                                  )
                              )
                          )
                      )
                  )
              )
              selected_observation_id = str(selected.get('observation_id') or selected.get('id') or '')
              selected_observation_type = str(selected.get('type') or '')
              selected_details = selected.get('details') if isinstance(selected.get('details'), dict) else {}
              verification_plan_id = str(
                  selected.get('verification_plan_id')
                  or selected_details.get('verification_plan_id')
                  or ''
              )
              evidence_capable = selected_observation_type in {
                  'bola_replay_result',
                  'ssrf_probe_result',
                  'cross_role_access_signal',
                  'validated_security_header_issue',
                  'schema_mismatch',
                  'injection_signal',
              }
              out.update({
                  'has_observation': bool(selected_observation_id),
                  'selected_observation_json': json.dumps(selected if isinstance(selected, dict) else {}, ensure_ascii=False),
                  'selected_observation_id': selected_observation_id,
                  'selected_observation_type': selected_observation_type,
                  'verification_plan_id': verification_plan_id,
                  'evidence_capable': bool(evidence_capable),
                  'bola_replay_result_count': len([obs for obs in observations if obs.get('type') == 'bola_replay_result']),
                  'strong_bola_replay_count': len(strong_bola),
                  'ssrf_probe_result_count': len([obs for obs in observations if obs.get('type') == 'ssrf_probe_result']),
                  'strong_ssrf_probe_count': len(strong_ssrf),
                  # Backward compatibility aliases.
                  'first_observation_id': selected_observation_id,
                  'first_observation_type': selected_observation_type,
                  'observations_count': len(observations),
                  'cross_role_access_count': len(cross),
                  'zap_alerts_count': len(alerts),
                  'discovered_endpoints_count': len(discovered),
              })
              return out
