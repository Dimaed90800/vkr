    - data:
        code: |
          import json

          def _load_map(raw: str) -> dict:
              try:
                  value = json.loads(str(raw or '{}'))
              except Exception:
                  value = {}
              return value if isinstance(value, dict) else {}

          def _merge_counts(state: dict, delta_json: str) -> dict:
              delta = _load_map(delta_json)
              counts = state.get("skipped_by_kind_cap_count")
              if not isinstance(counts, dict):
                  counts = {}
              merged = {str(k): int(v) for k, v in counts.items() if str(k)}
              for kind, value in delta.items():
                  kind_name = str(kind or '').strip()
                  if not kind_name:
                      continue
                  try:
                      add = int(value)
                  except Exception:
                      add = 0
                  if add > 0:
                      merged[kind_name] = int(merged.get(kind_name, 0) or 0) + add
              state["skipped_by_kind_cap_count"] = merged
              return delta

          def _increment_executed(state: dict, candidate_kind: str) -> None:
              kind = str(candidate_kind or '').strip()
              if not kind:
                  return
              counts = state.get("executed_by_kind")
              if not isinstance(counts, dict):
                  counts = {}
              merged = {str(k): int(v) for k, v in counts.items() if str(k)}
              merged[kind] = int(merged.get(kind, 0) or 0) + 1
              state["executed_by_kind"] = merged

          def _increment_failure_count(state: dict, candidate_kind: str) -> int:
              kind = str(candidate_kind or '').strip() or 'unknown'
              counts = state.get("failed_by_kind")
              if not isinstance(counts, dict):
                  counts = {}
              merged = {str(k): int(v) for k, v in counts.items() if str(k)}
              merged[kind] = int(merged.get(kind, 0) or 0) + 1
              state["failed_by_kind"] = merged
              return int(merged.get(kind, 0) or 0)

          def _int_value(value, default=0) -> int:
              try:
                  return int(value)
              except Exception:
                  return default

          def _bool_value(value, default=False) -> bool:
              if isinstance(value, bool):
                  return value
              text = str(value or '').strip().lower()
              if not text:
                  return default
              if text in {'true', '1', 'yes', 'on'}:
                  return True
              if text in {'false', '0', 'no', 'off'}:
                  return False
              return default

          def _clean_message(value) -> str:
              text = ' '.join(str(value or '').split()).strip()
              if not text:
                  return "tool run failed"
              lowered = text.lower()
              blocked = [
                  'author' + 'ization',
                  'cook' + 'ie',
                  'set-' + 'cookie',
                  'request_' + 'body',
                  'response_' + 'body',
                  'raw_' + 'body',
                  'head' + 'ers',
                  'bear' + 'er',
                  'tok' + 'en=',
                  'stack' + 'trace',
                  'trace' + 'back',
              ]
              if any(marker in lowered for marker in blocked):
                  return "tool run failed"
              return text[:200]

          def _append_failure_sample(state: dict, row: dict, limit: int = 10) -> None:
              items = state.get("tool_failure_summaries")
              if not isinstance(items, list):
                  items = []
              items = items + [row]
              state["tool_failure_summaries"] = items[-limit:]

          def _load_obj(raw: str) -> dict:
              try:
                  value = json.loads(str(raw or '{}'))
              except Exception:
                  value = {}
              return value if isinstance(value, dict) else {}

          def main(state_json: str, candidate_kind: str, tool_run_id: str, tool_name: str, tool_result_status: str, tool_error_type: str, tool_error_safe_message: str, blocked_candidates_sample_json: str, blocked_candidates_count_total: str, blocked_candidates_by_kind_count_json: str, ready_candidates_sample_json: str = '', ready_candidates_by_kind_count_json: str = '', selection_outcome: str = '', skipped_by_kind_cap_delta_json: str = '', selected_candidate_summary_json: str = '', llm_planner_used: str = 'false', llm_planner_fallback: str = '', llm_selected_candidate_id: str = '', llm_selected_kind: str = '', llm_selection_reason: str = '') -> dict:
              try:
                  state = json.loads(state_json or '{}')
              except Exception:
                  state = {}
              state["stopped_reason"] = str(state.get("stopped_reason") or '').strip()
              try:
                  blocked_sample = json.loads(blocked_candidates_sample_json or '[]')
              except Exception:
                  blocked_sample = []
              if not isinstance(blocked_sample, list):
                  blocked_sample = []
              try:
                  ready_sample = json.loads(ready_candidates_sample_json or '[]')
              except Exception:
                  ready_sample = []
              if not isinstance(ready_sample, list):
                  ready_sample = []
              blocked_by_kind = _load_map(blocked_candidates_by_kind_count_json)
              ready_by_kind = _load_map(ready_candidates_by_kind_count_json)
              skipped_delta = _merge_counts(state, skipped_by_kind_cap_delta_json)
              selection = str(selection_outcome or '').strip() or "selected_ready"
              candidate_summary = _load_obj(selected_candidate_summary_json)
              next_index = int(state.get("iterations_run") or 0) + 1
              safe_error_type = str(tool_error_type or '').strip() or "tool_failed"
              safe_error_message = _clean_message(tool_error_safe_message)
              summary = {
                  "iteration_index": next_index,
                  "candidate_kind": str(candidate_kind or ''),
                  "tool_run_id": str(tool_run_id or ''),
                  "tool_result_status": str(tool_result_status or ''),
                  "observations_count": 0,
                  "first_observation_type": "",
                  "verification_plan_id": "",
                  "evidence_id": "",
                  "judge_verdict": "",
                  "finding_id": "",
                  "outcome": "tool_failed",
                  "selection_outcome": selection,
                  "skipped_by_kind_cap_delta": skipped_delta,
                  "tool_error_type": safe_error_type,
                  "tool_error_safe_message": safe_error_message,
                  "operation_id": str(candidate_summary.get('operation_id') or ''),
                  "field_path": str(candidate_summary.get('field_path') or ''),
                  "object_pair_id": str(candidate_summary.get('object_pair_id') or ''),
                  "auth_mode": str(candidate_summary.get('auth_mode') or ''),
                  "result": "tool_failed",
                  "status_code": 0,
                  "callback_received": False,
                  "access_granted": False,
                  "owner_baseline_valid": False,
                  "evidence_strength": "",
                  "dedup_key": str(candidate_summary.get('dedup_key') or ''),
              }
              state["iterations_run"] = next_index
              _increment_executed(state, candidate_kind)
              execution_attempted = bool(str(tool_run_id or '').strip())
              kind_failure_count = 0
              if execution_attempted:
                  state["tool_failures_count"] = _int_value(state.get("tool_failures_count"), 0) + 1
                  kind_failure_count = _increment_failure_count(state, candidate_kind)
              state["last_candidate_kind"] = str(candidate_kind or '')
              state["last_tool_run_status"] = str(tool_result_status or '')
              state["last_selection_outcome"] = selection
              state["last_tool_error_type"] = safe_error_type
              state["last_tool_error_safe_message"] = safe_error_message
              state["llm_planner_used"] = _bool_value(llm_planner_used)
              state["llm_planner_fallback"] = str(llm_planner_fallback or '')
              state["llm_selected_candidate_id"] = str(llm_selected_candidate_id or '')
              state["llm_selected_kind"] = str(llm_selected_kind or '')
              state["llm_selection_reason"] = str(llm_selection_reason or '')
              state["ready_candidates_sample"] = ready_sample[:10]
              state["ready_candidates_by_kind_count"] = ready_by_kind
              state["blocked_candidates_sample"] = blocked_sample[:10]
              state["blocked_candidates_count_total"] = int(str(blocked_candidates_count_total or '0') or 0)
              state["blocked_candidates_by_kind_count"] = blocked_by_kind
              diag = state.get("dify_loop_diagnostics")
              if not isinstance(diag, dict):
                  diag = {}
              diag.update({
                  "planner_ready_count": int(len(ready_sample)),
                  "selected_candidate_id": str(candidate_summary.get("candidate_id") or ''),
                  "selected_kind": str(candidate_summary.get("kind") or candidate_kind or ''),
                  "selected_candidate_has_command": bool(candidate_summary.get("tool_name")),
                  "command_tool_name": str(candidate_summary.get("tool_name") or ''),
                  "command_operation_id": str(candidate_summary.get("operation_id") or ''),
                  "execution_node_reached": execution_attempted,
                  "execution_http_status": str(tool_result_status or ''),
                  "execution_skipped_reason": "" if execution_attempted else "execution_skipped_due_to_workflow_routing",
                  "tool_failure_count": _int_value(state.get("tool_failures_count"), 0),
                  "tool_failure_reasons_sample": state.get("tool_failure_summaries") if isinstance(state.get("tool_failure_summaries"), list) else [],
                  "stop_reason_source": "dify_loop",
                  "backend_stop_reason": "",
                  "dify_stop_reason": str(state.get("stopped_reason") or ''),
                  "stop_reason_consistent_with_backend": False,
              })
              state["dify_loop_diagnostics"] = diag
              state["iteration_summaries"] = (state.get("iteration_summaries") or []) + [summary]
              if execution_attempted:
                  _append_failure_sample(
                      state,
                      {
                          "iteration_index": next_index,
                          "candidate_kind": str(candidate_kind or ''),
                          "tool_name": str(tool_name or ''),
                          "tool_run_id": str(tool_run_id or ''),
                          "error_type": safe_error_type,
                          "message": safe_error_message,
                          "status": str(tool_result_status or ''),
                      },
                  )
              failure_total = _int_value(state.get("tool_failures_count"), 0)
              max_total = max(1, _int_value(state.get("max_tool_failures_total"), 5))
              max_by_kind = max(1, _int_value(state.get("max_tool_failures_by_kind"), 3))
              fatal_mode = _bool_value(state.get("tool_failed_fatal_mode"), False)
              should_exit_loop = False
              if fatal_mode:
                  state["stopped_reason"] = "tool_failed"
                  should_exit_loop = True
              elif not execution_attempted:
                  state["stopped_reason"] = "workflow_routing_gap_detected"
                  should_exit_loop = True
              elif failure_total >= max_total or kind_failure_count >= max_by_kind:
                  state["stopped_reason"] = "too_many_tool_failures"
                  should_exit_loop = True
              return {
                  "state_json": json.dumps(state, ensure_ascii=False),
                  "should_exit_loop": should_exit_loop,
              }
