    - data:
        code: |
          import json

          def _load_json(raw, default):
              try:
                  value = json.loads(str(raw or '').strip() or '{}')
              except Exception:
                  return default
              return value if isinstance(value, type(default)) else default

          def _int_value(value) -> int:
              try:
                  return int(value)
              except Exception:
                  return 0

          def main(body: str, state_json: str) -> dict:
              try:
                  payload = json.loads(body or '{}')
              except Exception:
                  payload = {}
              state = _load_json(state_json, {})
              candidates = payload.get('candidates') or []
              kind_caps = state.get('kind_caps') if isinstance(state.get('kind_caps'), dict) else {}
              executed_by_kind = state.get('executed_by_kind') if isinstance(state.get('executed_by_kind'), dict) else {}
              skipped_by_kind_cap_count = state.get('skipped_by_kind_cap_count') if isinstance(state.get('skipped_by_kind_cap_count'), dict) else {}
              selected = {}
              skipped_by_kind_cap_delta = {}
              ready_seen = False
              for candidate in candidates:
                  command = candidate.get('command')
                  if candidate.get('status') != 'ready' or not isinstance(command, dict):
                      continue
                  ready_seen = True
                  kind = str(candidate.get('kind') or '')
                  cap = kind_caps.get(kind)
                  executed = _int_value(executed_by_kind.get(kind, 0))
                  if cap is not None and executed >= _int_value(cap):
                      skipped_by_kind_cap_delta[kind] = skipped_by_kind_cap_delta.get(kind, 0) + 1
                      continue
                  if isinstance(command, dict):
                      selected = candidate
                      break
              command = selected.get('command') if selected else {}
              missing = []
              for candidate in candidates:
                  if candidate.get('status') == 'blocked':
                      missing.append({
                          'kind': candidate.get('kind') or '',
                          'missing_inputs': candidate.get('missing_inputs') or [],
                          'reason': candidate.get('reason') or '',
                      })
              if selected:
                  selection_outcome = 'selected_ready'
              elif ready_seen:
                  selection_outcome = 'caps_exhausted'
              else:
                  selection_outcome = 'no_ready_candidate'
              return {
                  'has_ready_candidate': 'true' if selected else 'false',
                  'candidate_id': str(selected.get('candidate_id') or ''),
                  'candidate_kind': str(selected.get('kind') or ''),
                  'command_json': json.dumps(command, ensure_ascii=False) if command else '{}',
                  'ready_count': str(payload.get('ready_count') or 0),
                  'blocked_count': str(payload.get('blocked_count') or 0),
                  'skipped_existing_count': str(payload.get('skipped_existing_count') or 0),
                  'blocked_missing_inputs_summary': json.dumps(missing[:5], ensure_ascii=False),
                  'selection_outcome': selection_outcome,
                  'skipped_by_kind_cap_delta_json': json.dumps(skipped_by_kind_cap_delta, ensure_ascii=False),
              }
