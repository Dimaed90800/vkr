    - data:
        code: |
          import json

          def _safe_parse(raw: str):
              try:
                  parsed = json.loads(str(raw or '').strip())
              except Exception:
                  return None
              return parsed

          def _extract_json_text(raw: str) -> str:
              text = str(raw or '').strip()
              if not text:
                  return ''
              if text.startswith('{') and text.endswith('}'):
                  return text
              start = text.find('```json')
              if start != -1:
                  tail = text[start + 7:]
                  end = tail.find('```')
                  if end != -1:
                      candidate = tail[:end].strip()
                      if candidate:
                          return candidate
              start = text.find('```')
              if start != -1:
                  tail = text[start + 3:]
                  end = tail.find('```')
                  if end != -1:
                      candidate = tail[:end].strip()
                      if candidate.startswith('{') and candidate.endswith('}'):
                          return candidate
              # best-effort JSON object slice
              l = text.find('{')
              r = text.rfind('}')
              if l != -1 and r != -1 and r > l:
                  return text[l:r+1].strip()
              return ''

          def _unwrap_llm_payload(raw: str):
              extracted = _extract_json_text(raw)
              parsed = _safe_parse(extracted)
              if isinstance(parsed, dict):
                  # direct draft object
                  if isinstance(parsed.get("body_json"), dict):
                      return parsed
                  # common envelope formats from Dify/LLM providers
                  for key in ("text", "result", "answer", "output", "structured_output"):
                      nested = parsed.get(key)
                      if isinstance(nested, dict) and isinstance(nested.get("body_json"), dict):
                          return nested
                      if isinstance(nested, str):
                          n_extracted = _extract_json_text(nested)
                          n_parsed = _safe_parse(n_extracted)
                          if isinstance(n_parsed, dict) and isinstance(n_parsed.get("body_json"), dict):
                              return n_parsed
              return None

          def _command_kind(command: dict) -> str:
              if not isinstance(command, dict):
                  return ''
              for key in ("kind", "tool_name", "worker_kind"):
                  value = command.get(key)
                  if isinstance(value, str) and value.strip():
                      return value
              inputs = command.get("inputs")
              if isinstance(inputs, dict):
                  for key in ("tool_name", "kind", "worker_kind"):
                      value = inputs.get(key)
                      if isinstance(value, str) and value.strip():
                          return value
              return ''

          def main(candidate_kind: str, command_json: str, llm_text: str = '', merge_input_kind: str = '') -> dict:
              command = _safe_parse(command_json)
              if not isinstance(command, dict):
                  command = {}
              inputs = command.get('inputs')
              if not isinstance(inputs, dict):
                  inputs = {}
              command['inputs'] = inputs

              attached = False
              source = "none"
              error = ""
              llm_output_seen = bool(str(llm_text or '').strip())
              llm_output_parse_ok = False

              kind = (
                  str(merge_input_kind or '').strip().lower()
                  or str(candidate_kind or '').strip().lower()
                  or str(_command_kind(command) or '').strip().lower()
              )
              if kind != "ssrf_probe":
                  return {
                      "worker_command_json": json.dumps(command, ensure_ascii=False),
                      "request_draft_attached": False,
                      "request_draft_source": "none",
                      "request_draft_error": "",
                      "merge_input_kind": kind,
                      "llm_output_seen": llm_output_seen,
                      "llm_output_parse_ok": False,
                  }

              draft = _unwrap_llm_payload(llm_text)
              if not isinstance(draft, dict):
                  error = "llm_output_invalid_or_empty"
              elif not draft:
                  error = "llm_output_empty_object"
              elif not isinstance(draft.get("body_json"), dict):
                  error = "llm_output_missing_body_json"
              else:
                  inputs["request_draft"] = draft
                  attached = True
                  source = "llm"
                  llm_output_parse_ok = True

              return {
                  "worker_command_json": json.dumps(command, ensure_ascii=False),
                  "request_draft_attached": attached,
                  "request_draft_source": source,
                  "request_draft_error": error,
                  "merge_input_kind": kind,
                  "llm_output_seen": llm_output_seen,
                  "llm_output_parse_ok": llm_output_parse_ok,
              }
