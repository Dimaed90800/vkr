    - data:
        code: |
          import json
          from urllib.parse import urlparse

          DEFAULT_PLANNER_REQUEST = {
              "include_blocked": True,
              "max_candidates": 50,
              "zap": {
                  "enabled": True,
                  "target_url": "",
                  "zap_base_url": "http://zap:8080",
                  "seed_urls": [],
                  "use_spider": True,
                  "use_ajax_spider": False,
                  "max_duration_sec": 30,
                  "max_discovered_urls": 100,
                  "max_alerts": 100,
              },
              "bola": {
                  "enabled": True,
                  "object_pairs": [],
              },
          }

          def _json_list(value, default):
              raw = str(value or '').strip()
              if not raw:
                  return list(default)
              try:
                  parsed = json.loads(raw)
              except Exception:
                  return list(default)
              return parsed if isinstance(parsed, list) else list(default)

          def _json_object(value, default):
              raw = str(value or '').strip()
              if not raw:
                  return dict(default)
              try:
                  parsed = json.loads(raw)
              except Exception:
                  return dict(default)
              return parsed if isinstance(parsed, dict) else dict(default)

          def _default_allowed_hosts(target_url):
              parsed = urlparse(str(target_url or '').strip())
              host = parsed.netloc or parsed.hostname or ''
              return [host] if host else []

          def _int_value(value, default):
              raw = str(value or '').strip()
              if not raw:
                  parsed = default
              else:
                  try:
                      parsed = int(raw)
                  except Exception:
                      parsed = default
              if parsed < 1:
                  return 1
              if parsed > 10:
                  return 10
              return parsed

          def _scenario_int(value, default, lo, hi):
              raw = str(value or '').strip()
              if not raw:
                  parsed = default
              else:
                  try:
                      parsed = int(raw)
                  except Exception:
                      parsed = default
              if parsed < lo:
                  return lo
              if parsed > hi:
                  return hi
              return parsed

          def _bool_str(value, default='true'):
              raw = str(value or '').strip().lower()
              if raw in ('false', '0', 'no'):
                  return 'false'
              if raw in ('true', '1', 'yes'):
                  return 'true'
              if not raw:
                  return default
              return 'true' if default == 'true' else 'false'

          def main(
              toolbox_url,
              target_url,
              openapi_spec_text='',
              openapi_url='',
              allowed_hosts_json='',
              roles_json='',
              planner_request_json='',
              task_id='',
              judge_model='',
              max_iterations='',
              include_scenario_compiler='true',
              scenario_max_operations='120',
              scenario_max_scenarios='30',
              scenario_llm_enabled='false',
              scenario_llm_model='',
              scenario_prompt_version='scenario-planner/v1',
          ) -> dict:
