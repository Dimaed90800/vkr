    - data:
        desc: Collect backend URL, target, prompt, and campaign limits.
        title: Start
        type: start
        variables:
        - label: Backend Base URL
          max_length: 200
          options: []
          required: true
          type: text-input
          variable: backend_base_url
        - label: Target Name
