        y: 180
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        code: |
          def _safe_int(value: str, default: int) -> int:
              value = str(value or "").strip()
              if not value:
                  return default
              try:
                  return int(value)
              except Exception:
                  return default

          def _normalize_classes(value: str) -> list:
              raw = str(value or "").strip()
              if not raw:
                  return ["discovery", "bola", "bopla", "auth"]
              result = []
              for item in raw.split(","):
                  normalized = str(item or "").strip().lower()
                  if normalized and normalized not in result:
                      result.append(normalized)
              return result or ["discovery", "bola", "bopla", "auth"]

          def _normalize_url(value: str) -> str:
              return str(value or "").strip().rstrip("/")

          def main(
              backend_base_url: str,
              target_name: str,
              target_url: str,
              user_prompt: str,
              allowed_test_classes_csv: str = "",
              max_rounds: str = "",
              budget_requests_total: str = "",
              budget_time_total: str = "",
          ) -> dict:
              return {
                  "backend_base_url": _normalize_url(backend_base_url),
                  "target_name": str(target_name or "").strip(),
                  "target_url": str(target_url or "").strip(),
                  "user_prompt": str(user_prompt or "").strip(),
                  "allowed_test_classes_json": _normalize_classes(allowed_test_classes_csv),
                  "max_rounds_value": _safe_int(max_rounds, 10),
                  "budget_requests_total_value": _safe_int(budget_requests_total, 200),
                  "budget_time_total_value": _safe_int(budget_time_total, 1800),
              }
