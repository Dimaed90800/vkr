      data:
        code: |
          import json

          def main(body: str, task_id: str, worker_type: str, vulnerability_class: str, fallback_tool_name: str) -> dict:
              try:
                  payload = json.loads(body or '{}')
              except Exception:
                  payload = {}
              tool_name = str(payload.get('tool_name') or fallback_tool_name or '')
              inner_result = payload.get('result')
              if not isinstance(inner_result, dict):
                  inner_result = payload if isinstance(payload, dict) else {}
              return {
                  'worker_type': str(worker_type or ''),
                  'tool_name': tool_name,
                  'task_id': str(task_id or ''),
                  'vulnerability_class': str(vulnerability_class or ''),
                  'result_json': json.dumps(inner_result, ensure_ascii=False),
              }
