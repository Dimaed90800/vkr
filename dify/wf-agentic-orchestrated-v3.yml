      zIndex: 1002
      data:
        code: |
          def main(
              status: str,
              next_action: str,
          ) -> dict:
              status = str(status or "").strip().lower()
              next_action = str(next_action or "").strip().lower()

              should_retry = (
                  status == "needs_retry"
                  and next_action in {"retry_same_class", "verify_candidate"}
              )
              should_exit_bola_loop = not should_retry

              return {
                  "should_retry_bola": should_retry,
                  "should_exit_bola_loop": should_exit_bola_loop,
                  "judge_status": status,
                  "judge_next_action": next_action,
