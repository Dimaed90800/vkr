          options: []
          required: false
          type: text-input
          variable: budget_time_total
        x-outputs:
        - name: backend_base_url
          type: string
        - name: target_name
          type: string
        - name: target_url
          type: string
        - name: user_prompt
          type: string
        - name: allowed_test_classes_csv
          type: string
        - name: max_rounds
          type: string
        - name: budget_requests_total
