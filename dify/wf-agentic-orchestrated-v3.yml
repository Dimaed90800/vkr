app:
  description: Orchestrated backend-aligned workflow for Dify. It starts with an orchestrator
    plan, uses LLM-driven Discovery and DAST agents to choose tools, and preserves
    the bounded Access Control loops for BOLA and BOPLA.
  icon: "\U0001F6E1️"
  icon_background: "#FFEAD5"
  mode: workflow
  name: wf-agentic-orchestrated-v3
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: 
  type: marketplace
