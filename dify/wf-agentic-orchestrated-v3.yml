            Merge the task inputs with session_id.
            Respect bounded scan limits from the task inputs.

            Return JSON only:
            {
              "mode": "tool_command",
              "tool_name": "<one allowed tool>",
              "arguments": {
                "session_id": {{#parse_session.session_id#}}
