      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: code
      id: run-to-parse
      selected: false
      source: run_campaign
      sourceHandle: source
      target: parse_response
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: code
      id: parse-to-markdown
      selected: false
      source: parse_response
      sourceHandle: source
      target: build_markdown
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
