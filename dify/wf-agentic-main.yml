      selected: false
      source: build_markdown
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: answer
        targetType: end
      id: answer-to-end
      selected: false
      source: answer
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 'Collect backend URL, target, prompt, and campaign limits.'
        selected: false
        title: Start
        type: start
        variables:
        - label: Backend Base URL
          max_length: 200
          options: []
          required: true
          type: text-input
          variable: backend_base_url
        - label: Target Name
          max_length: 100
          options: []
          required: true
          type: text-input
          variable: target_name
        - label: Target URL
          max_length: 500
          options: []
          required: true
          type: text-input
          variable: target_url
        - label: User Prompt
          max_length: 4000
          options: []
          required: true
          type: paragraph
          variable: user_prompt
        - label: Allowed Test Classes CSV
          max_length: 200
          options: []
          required: false
          type: text-input
          variable: allowed_test_classes_csv
        - label: Max Rounds
          max_length: 10
          options: []
          required: false
          type: text-input
          variable: max_rounds
        - label: Request Budget
          max_length: 10
          options: []
          required: false
          type: text-input
          variable: budget_requests_total
        - label: Time Budget Seconds
          max_length: 10
          options: []
          required: false
          type: text-input
          variable: budget_time_total
        x-outputs:
        - name: backend_base_url
          type: string
        - name: target_name
          type: string
        - name: target_url
          type: string
        - name: user_prompt
          type: string
        - name: allowed_test_classes_csv
          type: string
        - name: max_rounds
          type: string
        - name: budget_requests_total
          type: string
        - name: budget_time_total
          type: string
      height: 230
      id: start
      position:
        x: 0
        y: 180
      positionAbsolute:
        x: 0
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        code: |
          def _safe_int(value: str, default: int) -> int:
              value = str(value or "").strip()
              if not value:
                  return default
              try:
                  return int(value)
              except Exception:
                  return default

          def _normalize_classes(value: str) -> list:
              raw = str(value or "").strip()
              if not raw:
                  return ["discovery", "bola", "bopla", "auth"]
              result = []
              for item in raw.split(","):
                  normalized = str(item or "").strip().lower()
                  if normalized and normalized not in result:
                      result.append(normalized)
              return result or ["discovery", "bola", "bopla", "auth"]

          def _normalize_url(value: str) -> str:
              base = str(value or "").strip().rstrip("/")
              return base

          def main(
              backend_base_url: str,
              target_name: str,
              target_url: str,
              user_prompt: str,
              allowed_test_classes_csv: str = "",
              max_rounds: str = "",
              budget_requests_total: str = "",
              budget_time_total: str = "",
          ) -> dict:
              return {
                  "backend_base_url": _normalize_url(backend_base_url),
                  "target_name": str(target_name or "").strip(),
                  "target_url": str(target_url or "").strip(),
                  "user_prompt": str(user_prompt or "").strip(),
                  "allowed_test_classes_json": _normalize_classes(allowed_test_classes_csv),
                  "max_rounds_value": _safe_int(max_rounds, 12),
                  "budget_requests_total_value": _safe_int(budget_requests_total, 200),
                  "budget_time_total_value": _safe_int(budget_time_total, 1800),
              }
        code_language: python3
        dependencies: []
        desc: 'Normalize campaign inputs and prepare values for the backend request.'
        outputs:
          backend_base_url:
            children: null
            type: string
          target_name:
            children: null
            type: string
          target_url:
            children: null
            type: string
          user_prompt:
            children: null
            type: string
          allowed_test_classes_json:
            children: null
            type: array[string]
          max_rounds_value:
            children: null
            type: number
          budget_requests_total_value:
            children: null
            type: number
          budget_time_total_value:
            children: null
            type: number
        selected: false
        title: Normalize Input
        type: code
        variables:
        - value_selector:
          - start
          - backend_base_url
          variable: backend_base_url
        - value_selector:
          - start
          - target_name
          variable: target_name
        - value_selector:
          - start
          - target_url
          variable: target_url
        - value_selector:
          - start
          - user_prompt
          variable: user_prompt
        - value_selector:
          - start
          - allowed_test_classes_csv
          variable: allowed_test_classes_csv
        - value_selector:
          - start
          - max_rounds
          variable: max_rounds
        - value_selector:
          - start
          - budget_requests_total
          variable: budget_requests_total
        - value_selector:
          - start
          - budget_time_total
          variable: budget_time_total
      height: 102
      id: normalize_input
      position:
        x: 320
        y: 180
      positionAbsolute:
        x: 320
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: |
            {
              "target_name": "{{#normalize_input.target_name#}}",
              "target_url": "{{#normalize_input.target_url#}}",
              "user_prompt": "{{#normalize_input.user_prompt#}}",
              "judge_mode": "agentic",
              "max_rounds": {{#normalize_input.max_rounds_value#}},
              "budget_requests_total": {{#normalize_input.budget_requests_total_value#}},
              "budget_time_total": {{#normalize_input.budget_time_total_value#}},
              "allowed_test_classes": {{#normalize_input.allowed_test_classes_json#}}
            }
          type: json
        desc: 'Run one full backend agentic campaign.'
        headers: 'Content-Type:application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 2
          retry_enabled: true
          retry_interval: 500
        selected: false
        ssl_verify: false
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
        title: Run Agentic Campaign
        type: http-request
        url: '{{#normalize_input.backend_base_url#}}/campaign/run'
        variables: []
      height: 186
      id: run_campaign
      position:
        x: 650
        y: 180
      positionAbsolute:
        x: 650
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 260
    - data:
        code: |
          import json

          def _safe_get(obj, *keys, default=None):
              cur = obj
              for key in keys:
                  if isinstance(cur, dict) and key in cur:
                      cur = cur[key]
                  else:
                      return default
              return cur

          def main(body: str, status_code: int) -> dict:
              parsed = json.loads(body)
              session_id = _safe_get(parsed, "session", "id")
              session_status = _safe_get(parsed, "session", "status", default="unknown")
              judge_mode = _safe_get(parsed, "session", "judge_mode", default="agentic")
              steps_executed = parsed.get("steps_executed", 0)
              metrics = parsed.get("metrics", {}) or {}
              report = parsed.get("report", {}) or {}
              executive_summary = report.get("executive_summary", {}) or {}
              risk_summary = report.get("risk_summary", {}) or {}
              summary_text = report.get("summary_text", "") or ""
              top_findings = report.get("top_findings", []) or []

              return {
                  "http_status_code": status_code,
                  "session_id": session_id,
                  "session_status": session_status,
                  "judge_mode": judge_mode,
                  "steps_executed": steps_executed,
                  "observations": metrics.get("observations", 0),
                  "confirmed_findings": metrics.get("confirmed_findings", 0),
                  "findings_total": metrics.get("findings_total", 0),
                  "confirmed_bola": metrics.get("confirmed_bola", 0),
                  "confirmed_bopla": metrics.get("confirmed_bopla", 0),
                  "headline": executive_summary.get("headline", ""),
                  "executive_message": executive_summary.get("message", ""),
                  "summary_text": summary_text,
                  "top_findings_json": json.dumps(top_findings, ensure_ascii=False),
                  "risk_summary_json": json.dumps(risk_summary, ensure_ascii=False),
                  "raw_response_json": json.dumps(parsed, ensure_ascii=False),
              }
        code_language: python3
        dependencies: []
        desc: 'Parse the backend campaign response and extract report fields.'
        outputs:
          http_status_code:
            children: null
            type: number
          session_id:
            children: null
            type: number
          session_status:
            children: null
            type: string
          judge_mode:
            children: null
            type: string
          steps_executed:
            children: null
            type: number
          observations:
            children: null
            type: number
          confirmed_findings:
            children: null
            type: number
          findings_total:
            children: null
            type: number
          confirmed_bola:
            children: null
            type: number
          confirmed_bopla:
            children: null
            type: number
          headline:
            children: null
            type: string
          executive_message:
            children: null
            type: string
          summary_text:
            children: null
            type: string
          top_findings_json:
            children: null
            type: string
          risk_summary_json:
            children: null
            type: string
          raw_response_json:
            children: null
            type: string
        selected: false
        title: Parse Campaign Response
        type: code
        variables:
        - value_selector:
          - run_campaign
          - body
          variable: body
        - value_selector:
          - run_campaign
          - status_code
          variable: status_code
      height: 130
      id: parse_response
      position:
        x: 980
        y: 180
      positionAbsolute:
        x: 980
        y: 180
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 280
    - data:
        code: |
          import json

          def main(
              session_id,
              session_status,
              judge_mode,
              steps_executed,
              observations,
              confirmed_findings,
              findings_total,
              confirmed_bola,
              confirmed_bopla,
              headline,
              executive_message,
              summary_text,
              top_findings_json,
          ) -> dict:
              try:
                  top_findings = json.loads(top_findings_json or "[]")
              except Exception:
                  top_findings = []

              lines = [
                  f"# Agentic REST API Pentest Report",
                  "",
                  f"- Session ID: {session_id}",
                  f"- Judge mode: {judge_mode}",
                  f"- Session status: {session_status}",
                  f"- Steps executed: {steps_executed}",
                  f"- Observations: {observations}",
                  f"- Findings total: {findings_total}",
                  f"- Confirmed findings: {confirmed_findings}",
                  f"- Confirmed BOLA: {confirmed_bola}",
                  f"- Confirmed BOPLA: {confirmed_bopla}",
                  "",
              ]

              if headline:
                  lines.extend(["## Executive Summary", "", f"**{headline}**"])
                  if executive_message:
                      lines.extend(["", executive_message])
                  lines.append("")

              if summary_text:
                  lines.extend(["## Narrative Summary", "", summary_text, ""])

              lines.extend(["## Top Findings", ""])
              if not top_findings:
                  lines.append("No top findings were returned by the backend report.")
              else:
                  for item in top_findings:
                      lines.extend(
                          [
                              f"### {item.get('title') or item.get('type') or 'Finding'}",
                              f"- Type: {item.get('type')}",
                              f"- Severity: {item.get('severity')}",
                              f"- Endpoint: {item.get('endpoint')}",
                              f"- Verification: {item.get('verification_status')}",
                              f"- Description: {item.get('description')}",
                              "",
                          ]
                      )

              return {"markdown_report": "\n".join(lines).strip()}
        code_language: python3
        dependencies: []
        desc: 'Convert parsed campaign data into a Markdown report.'
        outputs:
          markdown_report:
            children: null
            type: string
        selected: false
        title: Build Markdown
        type: code
        variables:
