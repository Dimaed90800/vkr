      positionAbsolute:
        x: 1800
        y: 180
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: |
          import json

          def main(body: str) -> dict:
              try:
                  payload = json.loads(body or '{}')
              except Exception:
                  payload = {}
              candidates = payload.get('candidates') or []
              if not isinstance(candidates, list):
                  candidates = []
              selected = {}
              for candidate in candidates:
                  if not isinstance(candidate, dict):
                      continue
                  command = candidate.get('command')
                  if candidate.get('status') == 'ready' and isinstance(command, dict):
                      selected = candidate
                      break
              blocked = [
                  c for c in candidates
                  if isinstance(c, dict) and c.get('status') == 'blocked'
              ]
              missing_parts = []
              for item in blocked[:5]:
                  kind = str(item.get('kind') or '')
                  missing = item.get('missing_inputs') or []
                  if missing:
                      missing_parts.append(f"{kind}: {', '.join(str(x) for x in missing)}")
              command = selected.get('command') if selected else {}
              return {
                  'has_ready_candidate': 'true' if selected else 'false',
                  'candidate_id': str(selected.get('candidate_id') or ''),
                  'candidate_kind': str(selected.get('kind') or ''),
                  'command_json': json.dumps(command, ensure_ascii=False) if command else '{}',
                  'ready_count': str(payload.get('ready_count') or 0),
                  'blocked_count': str(payload.get('blocked_count') or 0),
                  'skipped_existing_count': str(payload.get('skipped_existing_count') or 0),
                  'blocked_missing_inputs_summary': '; '.join(missing_parts),
              }
        code_language: python3
        dependencies: []
        desc: ''
        outputs:
          blocked_count:
            children: null
            type: string
          blocked_missing_inputs_summary:
            children: null
            type: string
          candidate_id:
            children: null
            type: string
          candidate_kind:
            children: null
            type: string
          command_json:
            children: null
            type: string
          has_ready_candidate:
            children: null
            type: string
          ready_count:
            children: null
            type: string
          skipped_existing_count:
            children: null
            type: string
        selected: false
        title: Select First Ready Candidate
        type: code
        variables:
        - value_selector: [call_planner_candidates, body]
          value_type: string
          variable: body
