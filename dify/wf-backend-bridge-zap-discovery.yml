    - data:
        code: |
          import json
          from urllib.parse import urlparse

          def _json_list(value, default):
              raw = str(value or '').strip()
              if not raw:
                  return list(default)
              try:
                  parsed = json.loads(raw)
              except Exception:
                  return list(default)
              return parsed if isinstance(parsed, list) else list(default)

          def _default_allowed_hosts(target_url):
              parsed = urlparse(str(target_url or '').strip())
              host = parsed.netloc or parsed.hostname or ''
              return [host] if host else []

          def _safe_bool(value, default=True):
              raw = str(value or '').strip().lower()
              if raw in {'true', '1', 'yes', 'on'}:
                  return True
              if raw in {'false', '0', 'no', 'off'}:
                  return False
              return bool(default)

          def _safe_int(value, default, lower=1, upper=1000):
              try:
                  number = int(str(value or '').strip())
              except Exception:
                  number = default
              return max(lower, min(number, upper))

          def main(toolbox_url, target_url, allowed_hosts_json='', zap_base_url='', seed_urls_json='', use_spider='', max_duration_sec='', max_discovered_urls='', max_alerts='', task_id='') -> dict:
              target = str(target_url or '').rstrip('/')
              allowed_hosts = _json_list(allowed_hosts_json, _default_allowed_hosts(target))
              seed_urls = _json_list(seed_urls_json, [])
              return {
                  'toolbox_url': str(toolbox_url or '').rstrip('/'),
                  'target_url': target,
                  'allowed_hosts_json': json.dumps(allowed_hosts, ensure_ascii=False),
                  'zap_base_url': str(zap_base_url or 'http://zap:8080').strip(),
                  'seed_urls_json': json.dumps(seed_urls, ensure_ascii=False),
                  'use_spider_json': json.dumps(_safe_bool(use_spider, True)),
                  'max_duration_sec': str(_safe_int(max_duration_sec, 30, 1, 300)),
                  'max_discovered_urls': str(_safe_int(max_discovered_urls, 100, 1, 500)),
                  'max_alerts': str(_safe_int(max_alerts, 100, 1, 500)),
                  'task_id': str(task_id or 'task_zap_discovery_passive').strip(),
              }
        code_language: python3
        dependencies: []
        desc: ''
        outputs:
          allowed_hosts_json:
            children: null
            type: string
          max_alerts:
            children: null
            type: string
          max_discovered_urls:
            children: null
            type: string
          max_duration_sec:
            children: null
            type: string
          seed_urls_json:
            children: null
            type: string
          target_url:
            children: null
            type: string
          task_id:
            children: null
            type: string
          toolbox_url:
            children: null
            type: string
          use_spider_json:
            children: null
            type: string
          zap_base_url:
            children: null
            type: string
        selected: false
        title: Normalize Inputs
        type: code
        variables:
        - value_selector: [start, toolbox_url]
          value_type: string
          variable: toolbox_url
        - value_selector: [start, target_url]
