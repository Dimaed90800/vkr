    - data:
        code: |
          import json

          def main(body: str) -> dict:
              try:
                  payload = json.loads(body or '{}')
              except Exception:
                  payload = {}
              observations = payload.get('observations') or []
              if not isinstance(observations, list):
                  observations = []
              discovered = [obs for obs in observations if isinstance(obs, dict) and obs.get('type') == 'discovered_endpoint']
              alerts = [obs for obs in observations if isinstance(obs, dict) and obs.get('type') == 'zap_alert']
              selected = alerts[0] if alerts else (discovered[0] if discovered else {})
              return {
                  'first_observation_id': str(selected.get('observation_id') or ''),
                  'first_observation_type': str(selected.get('type') or ''),
                  'observations_count': str(len(observations)),
                  'discovered_endpoints_count': str(len(discovered)),
                  'zap_alerts_count': str(len(alerts)),
                  'has_observation': 'true' if selected.get('observation_id') else 'false',
              }
