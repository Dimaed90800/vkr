services:
  toolbox:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      - zap
      - playwright-runner
      - mitmproxy
    environment:
      ZAP_BASE_URL: http://zap:8080
      PLAYWRIGHT_RUNNER_URL: http://playwright-runner:3000
      MITMPROXY_URL: http://mitmproxy:8081
      NUCLEI_BIN: /usr/local/bin/nuclei
      FFUF_BIN: /usr/local/bin/ffuf
      HTTPX_BIN: /usr/local/bin/httpx
      RESTLER_BIN: /usr/local/bin/restler
      CATS_BIN: /usr/local/bin/cats
      ASTF_BIN: /usr/local/bin/astf
      AKTO_BIN: ${AKTO_BIN:-}
      DAST_LOG_DIR: /app/logs/dast_runs
      RESTLER_WRAPPER_COMMAND: "python /app/scripts/runtime/restler_runtime_adapter.py --request-json {request_json} --result-json {result_json} --output-dir {output_dir}"
      CATS_WRAPPER_COMMAND: "python /app/scripts/runtime/cats_runtime_adapter.py --request-json {request_json} --result-json {result_json} --output-dir {output_dir}"
      AKTO_WRAPPER_COMMAND: "python /app/scripts/runtime/akto_runtime_adapter.py --request-json {request_json} --result-json {result_json} --output-dir {output_dir}"
      ASTF_WRAPPER_COMMAND: "python /app/scripts/runtime/astf_runtime_adapter.py --request-json {request_json} --result-json {result_json} --output-dir {output_dir}"
      AKTO_DASHBOARD_URL: ${AKTO_DASHBOARD_URL:-}
      AKTO_API_KEY: ${AKTO_API_KEY:-}
      AKTO_API_COLLECTION_NAME: ${AKTO_API_COLLECTION_NAME:-}
      AKTO_API_COLLECTION_ID: ${AKTO_API_COLLECTION_ID:-}
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  zap:
    image: zaproxy/zap-stable
    platform: linux/amd64
    container_name: zap
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.disablekey=true
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/JSON/core/view/version/"
        ]
      start_period: 45s
      interval: 10s
      timeout: 5s
      retries: 10

  playwright-runner:
    image: mcr.microsoft.com/playwright:v1.52.0-jammy
    command: ["sleep", "infinity"]
    restart: unless-stopped

  mitmproxy:
    image: mitmproxy/mitmproxy:latest
    command: ["mitmdump", "--listen-host", "0.0.0.0", "--listen-port", "8081"]
    ports:
      - "8081:8081"
    restart: unless-stopped

  demo_target_vulnerable:
    build:
      context: .
      dockerfile: demo_target/Dockerfile
    environment:
      DEMO_TARGET_MODE: vulnerable
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
