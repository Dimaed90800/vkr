services:
  postgres:
    image: postgres:16
    container_name: pentest_postgres
    environment:
      POSTGRES_DB: pentestdb
      POSTGRES_USER: pentest
      POSTGRES_PASSWORD: pentest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pentest -d pentestdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: pentest_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://pentest:pentest@postgres:5432/pentestdb
      ZAP_BASE_URL: http://zap:8080
      ZAP_API_KEY: changeme
      DIFY_API_URL: ${DIFY_API_URL}
      DIFY_API_KEY: ${DIFY_API_KEY}
      BOLA_AGENT_DIFY_API_URL: ${BOLA_AGENT_DIFY_API_URL}
      BOLA_AGENT_DIFY_API_KEY: ${BOLA_AGENT_DIFY_API_KEY}
      BOPLA_AGENT_DIFY_API_URL: ${BOPLA_AGENT_DIFY_API_URL}
      BOPLA_AGENT_DIFY_API_KEY: ${BOPLA_AGENT_DIFY_API_KEY}
      AUTH_AGENT_DIFY_API_URL: ${AUTH_AGENT_DIFY_API_URL}
      AUTH_AGENT_DIFY_API_KEY: ${AUTH_AGENT_DIFY_API_KEY}
      REPORT_AGENT_DIFY_API_URL: ${REPORT_AGENT_DIFY_API_URL}
      REPORT_AGENT_DIFY_API_KEY: ${REPORT_AGENT_DIFY_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      zap:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  zap:
    image: zaproxy/zap-stable
    container_name: pentest_zap
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8080
      -config api.key=changeme
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: pentest_n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      TZ: America/Los_Angeles
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
