services:
  toolbox:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      - zap
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  zap:
    image: zaproxy/zap-stable
    platform: linux/amd64
    container_name: zap
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.disablekey=true
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/JSON/core/view/version/"
        ]
      start_period: 45s
      interval: 10s
      timeout: 5s
      retries: 10

  demo_target_vulnerable:
    build:
      context: .
      dockerfile: demo_target/Dockerfile
    environment:
      DEMO_TARGET_MODE: vulnerable
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  demo_target_secure:
    build:
      context: .
      dockerfile: demo_target/Dockerfile
    environment:
      DEMO_TARGET_MODE: secure
    ports:
      - "8002:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
